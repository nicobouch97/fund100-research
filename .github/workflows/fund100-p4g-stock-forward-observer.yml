name: Fund-100 P4G Prospective US Stock Quality Momentum (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_stock_quality_momentum_p4g_v1_0.py"
      - "test_fund100_stock_quality_momentum_p4g_v1_0.py"
      - ".github/workflows/fund100-p4g-stock-forward-observer.yml"
      - "research_lab/stocks/P4G_PROSPECTIVE_QUALITY_MOMENTUM_PROTOCOL_2026_10_15.md"
  push:
    branches: [main]
    paths:
      - "fund100_stock_quality_momentum_p4g_v1_0.py"
      - "test_fund100_stock_quality_momentum_p4g_v1_0.py"
      - ".github/workflows/fund100-p4g-stock-forward-observer.yml"
  schedule:
    # After US Monday-Friday close; 03:30 UTC Tuesday-Saturday.
    - cron: "30 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Test frozen source and prospective price evidence
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_stock_quality_momentum_p4g_v1_0.py
      - name: Acquire actual public completed-session prices only after freeze
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python fund100_stock_quality_momentum_p4g_v1_0.py \
            --output-json /tmp/fund100-p4g-snapshot.json \
            --output-prices-csv /tmp/fund100-p4g-original-prices.csv
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fund100-p4g-snapshot.json").read_text())
          assert r["asof_completed_session"] >= "2026-10-15"
          assert r["future_performance_observations"] == 0
          assert not r["trading_authorized"]
          assert not r["paper_authorized"] and not r["live_authorized"]
          assert r["broker_orders"] == 0
          print("Research-only original-price source captured.")
          PY
      - name: Archive time-stamped original research snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-p4g-prospective-stock-price-evidence
          path: |
            /tmp/fund100-p4g-snapshot.json
            /tmp/fund100-p4g-original-prices.csv
          retention-days: 90
          if-no-files-found: error
