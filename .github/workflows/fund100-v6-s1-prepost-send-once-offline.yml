name: Fund-100 V6-S1 Pre-POST Signed Send-Once FAKE Bridge (NO LIVE ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_prepost_one_shot_fake_bridge_v1_0.py"
      - "test_fund100_v6_s1_prepost_one_shot_fake_bridge_v1_0.py"
      - "research_lab/V6_S1_PRE_POST_AT_MOST_ONCE_SEND_BOUNDARY_OFFLINE_2026_10_21.md"
      - ".github/workflows/fund100-v6-s1-prepost-send-once-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fake-one-way-commit-then-one-broker-callback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HMAC-pinned original seq1 head to seq2 fake commit then only one fake callback
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_s1_prepost_one_shot_fake_bridge_v1_0.py \
            test_fund100_v6_s1_private_git_cas_protocol_v1_0.py \
            test_fund100_v6_s1_first_private_head_external_witness_offline_v1_0.py \
            test_fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0.py
          test "$(git hash-object fund100_v6_s1_prepost_one_shot_fake_bridge_v1_0.py)" = "8b3832e3b4d87efbab61a0a7503314b74da1a2ac"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'Signed pre-post and simulated submit at-most-once passed; NO REAL broker or Git transport.'
