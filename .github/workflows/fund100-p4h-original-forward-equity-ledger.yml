name: Fund-100 P4H/P4I Permanently Anchored Forward Stock Returns (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_stock_forward_return_ledger_p4h_v1_0.py"
      - "test_fund100_stock_forward_return_ledger_p4h_v1_0.py"
      - "fund100_stock_forward_permanent_anchor_p4i_v1_0.py"
      - "fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py"
      - "fund100_stock_forward_source_selector_p4w_v1_0.py"
      - "test_fund100_stock_forward_source_selector_p4w_v1_0.py"
      - "test_fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py"
      - "test_fund100_stock_forward_permanent_anchor_p4i_v1_0.py"
      - "research_lab/stocks/P4I_*"
      - ".github/workflows/fund100-p4h-original-forward-equity-ledger.yml"
  push:
    branches: [main]
    paths:
      - "fund100_stock_forward_permanent_anchor_p4i_v1_0.py"
      - "fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py"
      - "fund100_stock_forward_source_selector_p4w_v1_0.py"
      - "test_fund100_stock_forward_source_selector_p4w_v1_0.py"
      - "test_fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py"
      - "test_fund100_stock_forward_permanent_anchor_p4i_v1_0.py"
      - "research_lab/stocks/P4I_*"
      - ".github/workflows/fund100-p4h-original-forward-equity-ledger.yml"
  schedule:
    # After P4G 03:30 UTC Tuesday-Saturday daily close archive.
    - cron: "40 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fund100-p4h-source-locked-ledger
  cancel-in-progress: false

jobs:
  original-artifact-return-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nicobouch97/fund100-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing offline research dependencies
        run: python -m pip install -r requirements.txt
      - name: Check P4H and P4I no-lookahead, old-vintage SHA and cost controls
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_stock_forward_return_ledger_p4h_v1_0.py \
            test_fund100_stock_forward_permanent_anchor_p4i_v1_0.py \
            test_fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py \
            test_fund100_stock_forward_source_selector_p4w_v1_0.py
      - name: Confirm P4I source anchor permanently pins actual 17 Oct observation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fund100_stock_forward_permanent_anchor_p4i_v1_0 as a
          row,sha=a.read_anchor(Path("research_lab/stocks/P4I_PERMANENT_2026_10_17_SOURCE_ANCHOR.json"))
          assert row["original_preselected_watchlist"]==["MSFT","KO","PG"]
          assert row["original_p4g_json_sha256"]==a.ORIGINAL_JSON_SHA
          assert row["original_p4g_canonical_price_csv_sha256"]==a.ORIGINAL_CSV_SHA
          assert row["broker_orders"]==0
          print("Immutable original 17 Oct price and selected issuer fingerprints:",sha)
          PY
      - name: While original artifact still exists, independently verify anchors against its REAL bytes
        if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          actual="$(gh api /repos/nicobouch97/fund100-research/actions/runs/39015519726/artifacts \
            --jq '.artifacts[] | select(.name == "fund100-p4g-prospective-stock-price-evidence" and .expired == false) | .id')"
          test "${actual}" = "12094995126"
          mkdir -p /tmp/fund100-p4i-original
          gh run download 39015519726 \
            --repo nicobouch97/fund100-research \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4i-original
          python fund100_stock_forward_permanent_anchor_p4i_v1_0.py \
            --original-json /tmp/fund100-p4i-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4i-original/fund100-p4g-original-prices.csv \
            --output /tmp/fund100-p4i-original-verified.json
      - name: Regression on exact original 17 Oct and real 23 Oct follow-up artifacts
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/fund100-p4i-real-followup
          gh run download 39926729929 --repo nicobouch97/fund100-research \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4i-real-followup
          python fund100_stock_forward_permanent_anchor_p4i_v1_0.py \
            --anchor research_lab/stocks/P4I_PERMANENT_2026_10_17_SOURCE_ANCHOR.json \
            --original-json /tmp/fund100-p4i-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4i-original/fund100-p4g-original-prices.csv \
            --followup-json /tmp/fund100-p4i-real-followup/fund100-p4g-snapshot.json \
            --followup-csv /tmp/fund100-p4i-real-followup/fund100-p4g-original-prices.csv \
            --output /tmp/fund100-p4i-20261023-regression.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/fund100-p4i-20261023-regression.json').read_text())
          assert d['original_17_oct_archive_verified_before_forward_calculation']
          assert d['overlapping_original_adjusted_prices_sha_verified']
          assert d['revised_overlap_prices_used_for_pnl'] is False
          assert 0<d['observed_overlap_vendor_relative_jitter']<5e-7
          assert d['observed_new_completed_sessions']==4
          assert d['future_return_observations']==3
          assert d['post_freeze_entry_session']=='2026-10-19'
          assert d['broker_orders']==0 and d['live_authorized'] is False
          print('Actual two public artifacts: precision-safe original vintage PASS; NO LIVE trade.')
          PY
      - name: Validate real 28 Oct PG dividend-vintage bridge against original archived source (NO BROKER)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/fund100-p4v-real-followup
          gh run download 40667867791 --repo nicobouch97/fund100-research \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4v-real-followup
          python fund100_stock_forward_corporate_action_bridge_p4v_v1_0.py \
            --anchor research_lab/stocks/P4I_PERMANENT_2026_10_17_SOURCE_ANCHOR.json \
            --original-json /tmp/fund100-p4i-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4i-original/fund100-p4g-original-prices.csv \
            --followup-json /tmp/fund100-p4v-real-followup/fund100-p4g-snapshot.json \
            --followup-csv /tmp/fund100-p4v-real-followup/fund100-p4g-original-prices.csv \
            --output /tmp/fund100-p4v-real-20261028-checked.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fund100-p4v-real-20261028-checked.json').read_text())
          assert x['original_frozen_watchlist']==['MSFT','KO','PG']
          assert x['post_freeze_entry_session']=='2026-10-19'
          assert x['observed_new_completed_sessions']==7
          assert x['future_return_observations']==6
          p=x['corporate_action_crosscheck']
          assert abs(p['observed_pg_historic_rebase_factor']-0.99342352617)<1e-6
          assert p['frozen_original_price_rows_retained']
          assert not p['revised_pre_freeze_rows_used_for_returns']
          assert not p['independent_total_return_benchmark_verified']
          assert not x['live_authorized'] and not x['trading_authorized']
          assert x['broker_orders']==0
          print('REAL PINNED 17 OCT AND 28 OCT PG DIVIDEND SOURCE MATCH: research-only, 0 orders')

          python fund100_stock_forward_source_selector_p4w_v1_0.py \
            --anchor research_lab/stocks/P4I_PERMANENT_2026_10_17_SOURCE_ANCHOR.json \
            --original-json /tmp/fund100-p4i-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4i-original/fund100-p4g-original-prices.csv \
            --followup-json /tmp/fund100-p4v-real-followup/fund100-p4g-snapshot.json \
            --followup-csv /tmp/fund100-p4v-real-followup/fund100-p4g-original-prices.csv \
            --output /tmp/fund100-p4w-real-20261028-source-selected.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fund100-p4w-real-20261028-source-selected.json').read_text())
          z=x['scheduled_research_source_selection']
          assert z['selection_method']=='KNOWN_PG_OCT23_DIVIDEND_BRIDGE_P4V'
          assert not z['strict_p4i_original_vintage_accepted']
          assert x['future_return_observations']==6
          assert not x['live_authorized'] and x['broker_orders']==0
          print('REAL FIXED SOURCE SELECTION: known PG dividend only; NO BROKER')
          PY
          PY
      - name: Locate newest successful post-anchor real P4G source snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: followup
        run: |
          set -euo pipefail
          next="$(gh run list \
            --repo nicobouch97/fund100-research \
            --workflow fund100-p4g-stock-forward-observer.yml \
            --limit 40 --json databaseId,conclusion,event,headBranch \
            --jq '[.[] | select(.conclusion == "success" and .headBranch == "main" and (.event == "schedule" or .event == "workflow_dispatch") and .databaseId > 39015519726)] | sort_by(.databaseId) | reverse | .[0].databaseId // empty')"
          if [ -z "${next}" ]; then
            echo "NO_NEW_P4G_SOURCE: zero new future stock returns, not an alpha result."
            echo "eligible=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p /tmp/fund100-p4i-followup
          gh run download "${next}" --repo nicobouch97/fund100-research \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4i-followup
          echo "eligible=true" >> "${GITHUB_OUTPUT}"
          echo "PROSPECTIVE_INPUT_RUN=${next}"
      - name: Require original price SHA or exactly documented dividend-bound research bridge
        if: steps.followup.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          python fund100_stock_forward_source_selector_p4w_v1_0.py \
            --anchor research_lab/stocks/P4I_PERMANENT_2026_10_17_SOURCE_ANCHOR.json \
            --original-json /tmp/fund100-p4i-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4i-original/fund100-p4g-original-prices.csv \
            --followup-json /tmp/fund100-p4i-followup/fund100-p4g-snapshot.json \
            --followup-csv /tmp/fund100-p4i-followup/fund100-p4g-original-prices.csv \
            --quarantine-output /tmp/fund100-p4i-source-quarantine.json \
            --output /tmp/fund100-p4i-anchored-prospective-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fund100-p4i-anchored-prospective-result.json").read_text())
          import fund100_stock_forward_permanent_anchor_p4i_v1_0 as p4i
          import fund100_stock_forward_corporate_action_bridge_p4v_v1_0 as p4v
          assert r["frozen_baseline_session"]=="2026-10-16"
          assert r["original_frozen_watchlist"]==["MSFT","KO","PG"]
          assert r["original_baseline_price_csv_sha256"]==p4i.ORIGINAL_CSV_SHA
          assert r["selection_is_not_reranked_from_followup"]
          assert not r["prior_history_used_for_strategy_pnl"]
          assert not r["period_cagr_or_statistical_alpha_inferred"]
          assert r["broker_orders"]==0
          assert not r["paper_authorized"] and not r["live_authorized"]
          assert not r["trading_authorized"]
          chosen=r["scheduled_research_source_selection"]
          if chosen["selection_method"]=="STRICT_P4I_ORIGINAL_VINTAGE":
              assert chosen["strict_p4i_original_vintage_accepted"]
              assert r["schema"]==p4i.SCHEMA
              assert r["overlapping_original_adjusted_prices_sha_verified"]
              assert r["original_17_oct_archive_verified_before_forward_calculation"]
              assert r["revised_overlap_prices_used_for_pnl"] is False
              assert r["observed_overlap_vendor_relative_jitter"] <= 5e-7
          else:
              assert chosen["selection_method"]=="KNOWN_PG_OCT23_DIVIDEND_BRIDGE_P4V"
              assert not chosen["strict_p4i_original_vintage_accepted"]
              assert "material historical vendor restatement" in chosen["strict_p4i_revision_rejection"]
              assert r["schema"]==p4v.SCHEMA
              evidence=r["corporate_action_crosscheck"]
              assert evidence["event"]==p4v.PG_EVENT
              assert evidence["frozen_original_price_rows_retained"]
              assert evidence["revised_pre_freeze_rows_used_for_returns"] is False
              assert evidence["independent_total_return_benchmark_verified"] is False
              assert evidence["cash_dividend_actually_settled_verified"] is False
          assert not chosen["later_vendor_revisions_permitted_unconditionally"]
          assert chosen["broker_orders"]==0 and not chosen["live_authorized"]
          print("Pinned 17 October research-source gate:",chosen["selection_method"],
                "; no alpha proof or broker orders.")

          PY
      - name: Preserve rejected original-vintage change evidence (no strategy returns)
        if: failure() && steps.followup.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-p4i-source-revision-quarantine
          path: /tmp/fund100-p4i-source-quarantine.json
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve real post-freeze source hash and only observed forward results
        if: steps.followup.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-p4i-permanent-anchor-real-forward-return-evidence
          path: /tmp/fund100-p4i-anchored-prospective-result.json
          retention-days: 90
          if-no-files-found: error
