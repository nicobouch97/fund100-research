# Historical one-time STOP + protected broker GET acceptance. RETIRED.
# No main push, no elevated Actions write, no dispatch job, no broker keys,
# signer, order path or success claims. Offline tests only.
name: Fund-100 One-Time STOP Protected Broker 2-GET Acceptance (NO TRADES)

on:
  pull_request:
    paths:
      - ".github/workflows/fund100-stop-broker-get-acceptance-once.yml"
      - "fund100_stop_broker_get_acceptance_once_v1_0.py"
      - "test_fund100_stop_broker_get_acceptance_once_v1_0.py"

permissions:
  contents: read

concurrency:
  group: fund100-once-stop-broker-get-integration
  cancel-in-progress: false

jobs:
  acceptance-dispatcher-offline-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original one-time main-only STOP dispatch tests (MOCK)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q test_fund100_stop_broker_get_acceptance_once_v1_0.py

