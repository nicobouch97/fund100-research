name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ENGAGED

jobs:
  release-lock:
    name: Freeze Execution Orchestrator Integration v1.9
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify broker kill switch remains engaged
        run: |
          set -euo pipefail

          if [ "${FUND100_BROKER_KILL_SWITCH}" != "ENGAGED" ]; then
            echo "STOP: broker kill switch is not ENGAGED."
            exit 1
          fi

          echo "FUND100_BROKER_KILL_SWITCH = ENGAGED"

      - name: Run complete regression suite
        run: |
          set -euo pipefail
          pytest -q

      - name: Re-run Static Audit v1.18
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_18.py

      - name: Verify orchestrator rehearsal evidence exists
        run: |
          set -euo pipefail

          test -f \
            live_activation_outputs/v5_002/execution_orchestrator_rehearsal_v1_0.json

          echo "Execution orchestrator rehearsal evidence: PRESENT"

      - name: Build Release Lock v1.9
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock_v1_9.py

      - name: Verify locked v1.9 state
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "live_activation_outputs/v5_002/"
              "pre_live_release_lock_v1_9.json"
          )

          if not path.exists():
              raise SystemExit(
                  "STOP: Release Lock v1.9 evidence missing."
              )

          body = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = {
              "release_lock_version":
                  "1.9",

              "execution_orchestrator_integration_required":
                  False,

              "execution_orchestrator_integration_completed":
                  True,

              "execution_orchestrator_release_blocker":
                  False,

              "connected_alpaca_paper_end_to_end_required":
                  True,

              "connected_alpaca_paper_end_to_end_completed":
                  False,

              "automatic_live_activation_allowed":
                  False,

              "live_execution_authorized":
                  False,

              "permit_issued":
                  False,

              "maximum_live_execution_notional_usd":
                  "0.00",

              "writer_connected":
                  False,

              "live_orders_submitted":
                  0,
          }

          for key, expected in required.items():

              actual = body.get(
                  key
              )

              if actual != expected:

                  raise SystemExit(
                      "STOP: "
                      f"{key}: expected {expected!r}, "
                      f"got {actual!r}"
                  )

          print(
              "Release Lock v1.9 state: VERIFIED"
          )
          PY

      - name: Commit Release Lock v1.9 evidence
        run: |
          set -euo pipefail

          git config user.name \
            "fund100-research-bot"

          git config user.email \
            "fund100-research-bot@users.noreply.github.com"

          git add \
            live_activation_outputs/v5_002/pre_live_release_lock_v1_9.json

          if git diff --cached --quiet; then

            echo "Release Lock v1.9 evidence unchanged."

          else

            git commit -m \
              "Freeze execution orchestrator integration evidence v1.9"

            git push

          fi

      - name: Final locked-state summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 ORCHESTRATOR BASELINE LOCK v1.9 COMPLETE"
          echo "========================================"
          echo "Prior Release Lock v1.8: VERIFIED"
          echo "Writer candidate v1.1: HARD LOCKED"
          echo "Execution orchestrator v1.0: LOCKED"
          echo "Orchestrator rehearsal evidence: LOCKED"
          echo "Fresh broker reconstruction before each phase: LOCKED"
          echo "Complete authorized-ID reconstruction: LOCKED"
          echo "Cumulative-cap guard before every writer call: LOCKED"
          echo "Single permit ceiling across SELL + BUY: LOCKED"
          echo "Restart-safe orchestration: LOCKED"
          echo "Execution orchestrator integration: COMPLETE"
          echo "Execution orchestrator release blocker: NO"
          echo "Connected Alpaca PAPER end-to-end required: YES"
          echo "Connected LIVE writer release still required: YES"
          echo "Automatic LIVE activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo "Maximum LIVE execution notional: \$0.00"
          echo "Writer connected: FALSE"
          echo "LIVE orders submitted: 0"
