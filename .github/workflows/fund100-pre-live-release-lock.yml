name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

jobs:
  release-lock:
    name: Freeze Hard-Locked Writer Candidate Baseline

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify writer-candidate lock inputs
        run: |
          set -euo pipefail

          test -f fund100_pre_live_release_lock.py
          test -f fund100_pre_live_release_lock_v1_1.py
          test -f fund100_pre_live_release_lock_v1_2.py
          test -f fund100_pre_live_release_lock_v1_3.py

          test -f test_fund100_pre_live_release_lock_v1_1.py
          test -f test_fund100_pre_live_release_lock_v1_2.py
          test -f test_fund100_pre_live_release_lock_v1_3.py

          test -f fund100_alpaca_live_execution_materializer.py
          test -f test_fund100_alpaca_live_execution_materializer.py

          test -f fund100_alpaca_live_writer_candidate_v1_0.py
          test -f test_fund100_alpaca_live_writer_candidate_v1_0.py

          test -f audit_fund100_live_boundary_v1_10.py
          test -f audit_fund100_live_boundary_v1_11.py

          test -f fund100_alpaca_live_permit_v2_issuer_v1_1.py

          test -f \
            release_outputs/v5_002/pre_live_release_evidence.json

          echo "Writer-candidate lock dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run V5-002 engine parity
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py

      - name: Re-run LIVE static safety audit v1.11
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_11.py

      - name: Re-run position-aware pre-live evidence gate
        env:
          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_PRECHECK_TESTS: PASS
          FUND100_PRECHECK_ENGINE_PARITY: PASS
          FUND100_PRECHECK_STATIC_AUDIT: PASS

        run: |
          set -euo pipefail
          python fund100_pre_live_release_gate_v1_1.py

      - name: Restore committed evidence snapshot after verification
        shell: bash
        run: |
          set -euo pipefail

          git restore \
            --source=HEAD \
            -- \
            release_outputs/v5_002/pre_live_release_evidence.json \
            release_outputs/v5_002/pre_live_release_evidence.md

          echo "Evidence verification complete."
          git status --short

      - name: Build writer-candidate release lock v1.3
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock_v1_3.py

      - name: Verify writer-candidate release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          import fund100_alpaca_live_writer_candidate_v1_0 as candidate

          root = Path.cwd()

          path = (
              root
              / "release_outputs"
              / "v5_002"
              / "pre_live_release_lock.json"
          )

          with path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package["release_lock"]

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          calculated = hashlib.sha256(
              canonical.encode("utf-8")
          ).hexdigest()

          assert (
              calculated
              == package["release_lock_sha256"]
          )

          assert (
              body["schema"]
              == "FUND100_PRE_LIVE_RELEASE_LOCK_V1_1"
          )

          assert (
              body["release_lock_builder_version"]
              == "1.3"
          )

          assert (
              body["release_layer"]
              == "v1.1-position-aware-issuer-aware-writer-candidate-locked"
          )

          assert (
              body["position_aware_live_chain_verified"]
              is True
          )

          assert (
              body["issuer_aware_release_lock"]
              is True
          )

          assert (
              body["execution_materializer_source_locked"]
              is True
          )

          assert (
              body["execution_materializer_network_capability"]
              is False
          )

          assert (
              body["execution_materializer_write_capability"]
              is False
          )

          assert (
              body["connected_writer_candidate_source_locked"]
              is True
          )

          assert (
              body["connected_writer_candidate_version"]
              == "1.0"
          )

          assert (
              body["connected_writer_candidate_transport_released"]
              is False
          )

          assert (
              body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          assert (
              body["connected_writer_candidate_workflow_exposed"]
              is False
          )

          assert (
              body["static_audit_v1_11_source_locked"]
              is True
          )

          assert (
              body["connected_writer_release_still_required"]
              is True
          )

          assert (
              body["offline_connected_writer_rehearsal_required"]
              is True
          )

          assert (
              body["live_writer_transport_released"]
              is False
          )

          assert (
              body["live_writer_public_execution_enabled"]
              is False
          )

          assert (
              body["automatic_activation_allowed"]
              is False
          )

          assert (
              body["live_execution_authorized"]
              is False
          )

          assert (
              body["permit_issued"]
              is False
          )

          assert (
              float(
                  body["max_live_execution_notional_usd"]
              )
              == 0.0
          )

          assert (
              body["network_write_capability"]
              is False
          )

          assert (
              body["writer_connected"]
              is False
          )

          assert (
              int(
                  body["orders_submitted"]
              )
              == 0
          )

          # ----------------------------------------------
          # Actual candidate module must still be locked.
          # ----------------------------------------------

          assert (
              candidate.TRANSPORT_RELEASED
              is False
          )

          assert (
              candidate.PUBLIC_EXECUTION_ENABLED
              is False
          )

          # ----------------------------------------------
          # Required files must be exact hash matches.
          # ----------------------------------------------

          hashes = (
              body[
                  "critical_file_sha256"
              ]
          )

          required = [
              "fund100_alpaca_live_execution_materializer.py",
              "audit_fund100_live_boundary_v1_10.py",
              "fund100_alpaca_live_writer_candidate_v1_0.py",
              "test_fund100_alpaca_live_writer_candidate_v1_0.py",
              "audit_fund100_live_boundary_v1_11.py",
              "fund100_pre_live_release_lock_v1_3.py",
              "test_fund100_pre_live_release_lock_v1_3.py",
          ]

          for filename in required:

              assert filename in hashes

              actual = hashlib.sha256(
                  (
                      root
                      / filename
                  ).read_bytes()
              ).hexdigest()

              assert (
                  hashes[
                      filename
                  ]
                  == actual
              )

          print(
              "Release-lock SHA256: PASS"
          )

          print(
              "Position-aware baseline: PASS"
          )

          print(
              "Issuer-aware baseline: PASS"
          )

          print(
              "Execution materializer source hash: PASS"
          )

          print(
              "Writer candidate source hash: PASS"
          )

          print(
              "Static Audit v1.11 source hash: PASS"
          )

          print(
              "Candidate transport released: FALSE"
          )

          print(
              "Candidate public execution enabled: FALSE"
          )

          print(
              "Live execution authorized: FALSE"
          )

          print(
              "Permit issued: FALSE"
          )

          print(
              "Writer connected: FALSE"
          )
          PY

      - name: Verify only release lock changed
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. release_outputs/v5_002/pre_live_release_lock\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then

            echo "Unexpected working-tree changes detected:"
            echo "$EXTRA"
            git status --short
            exit 1

          fi

          echo \
            "Only expected release-lock change is present."

      - name: Show writer-candidate release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          path = (
              "release_outputs/v5_002/"
              "pre_live_release_lock.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package["release_lock"]

          print(
              "========================================"
          )

          print(
              "FUND-100 WRITER-CANDIDATE BASELINE LOCK"
          )

          print(
              "========================================"
          )

          print(
              "Release lock ID:",
              body["release_lock_id"],
          )

          print(
              "Release lock SHA256:",
              package["release_lock_sha256"],
          )

          print(
              "Critical files:",
              body["critical_file_count"],
          )

          print(
              "Execution materializer: LOCKED"
          )

          print(
              "Connected-writer candidate: LOCKED"
          )

          print(
              "Static Audit v1.11: LOCKED"
          )

          print(
              "Candidate transport released: FALSE"
          )

          print(
              "Candidate public execution enabled: FALSE"
          )

          print(
              "Offline writer rehearsal still required: YES"
          )

          print(
              "Automatic activation allowed: FALSE"
          )

          print(
              "Live execution authorized: FALSE"
          )

          print(
              "Permit issued: FALSE"
          )

          print(
              "Maximum live execution notional: $0.00"
          )

          print(
              "Writer connected: FALSE"
          )
          PY

      - name: Check release-lock changes
        id: lock_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              release_outputs/v5_002/pre_live_release_lock.json
          )"

          if [ -z "$CHANGES" ]; then

            echo "Release lock unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release lock changed:"
            echo "$CHANGES"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit writer-candidate release lock
        if: steps.lock_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-release-evidence-bot"

          git config \
            user.email \
            "fund100-release-evidence-bot@users.noreply.github.com"

          git add \
            release_outputs/v5_002/pre_live_release_lock.json

          if git diff --cached --quiet; then

            echo "Nothing staged."
            exit 0

          fi

          git commit \
            -m "Freeze hard-locked V5-002 writer candidate baseline"

          if [ -n "$(git status --porcelain)" ]; then

            echo "Unexpected dirty working tree."
            git status --short
            exit 1

          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 WRITER-CANDIDATE BASELINE LOCK COMPLETE"
          echo "========================================"
          echo "Broker credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "Position-aware baseline: LOCKED"
          echo "Issuer-aware baseline: LOCKED"
          echo "Execution materializer: LOCKED"
          echo "Connected-writer candidate: LOCKED"
          echo "Static Audit v1.11: LOCKED"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Offline connected-writer rehearsal required: YES"
          echo "Automatic activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum live execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "Orders submitted: 0"
