name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

jobs:
  release-lock:
    name: Freeze Passing Pre-Live Baseline

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify release-lock inputs
        run: |
          set -euo pipefail

          test -f fund100_pre_live_release_lock.py

          test -f release_outputs/v5_002/pre_live_release_evidence.json
          test -f release_outputs/v5_002/pre_live_release_evidence.md

          test -f fund100_alpaca_live_writer_disconnected.py

          echo "Pre-live release-lock dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run engine parity
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py

      - name: Re-run LIVE static safety audit
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_2.py

      - name: Re-run pre-live evidence gate
        env:
          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_PRECHECK_TESTS: PASS
          FUND100_PRECHECK_ENGINE_PARITY: PASS
          FUND100_PRECHECK_STATIC_AUDIT: PASS

        run: |
          set -euo pipefail
          python fund100_pre_live_release_gate.py

      - name: Restore committed evidence snapshot after verification
        shell: bash
        run: |
          set -euo pipefail

          echo "Evidence gate passed."
          echo "Restoring committed evidence snapshot before creating release lock."

          git restore \
            --source=HEAD \
            -- \
            release_outputs/v5_002/pre_live_release_evidence.json \
            release_outputs/v5_002/pre_live_release_evidence.md

          echo
          echo "Working tree after evidence restoration:"
          git status --short

      - name: Build safe-baseline release lock
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock.py

      - name: Verify only release lock changed
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(git status --porcelain)"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE '^.. release_outputs/v5_002/pre_live_release_lock\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then
            echo "Unexpected working-tree changes detected:"
            echo "$EXTRA"
            echo
            git status --short
            exit 1
          fi

          echo "Working tree contains only the expected release-lock change."
          git status --short

      - name: Show release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          path = "release_outputs/v5_002/pre_live_release_lock.json"

          with open(path, "r") as f:
              package = json.load(f)

          body = package["release_lock"]

          print("========================================")
          print("FUND-100 SAFE BASELINE LOCK")
          print("========================================")
          print("Release lock ID:", body["release_lock_id"])
          print("Release lock SHA256:", package["release_lock_sha256"])
          print(
              "Critical-file-set SHA256:",
              body["critical_file_set_sha256"],
          )
          print("Live execution authorized: FALSE")
          print("Permit issued: FALSE")
          print("Maximum live execution notional: $0.00")
          print("Writer connected: FALSE")
          PY

      - name: Check release-lock changes
        id: lock_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain -- release_outputs/v5_002/pre_live_release_lock.json)"

          if [ -z "$CHANGES" ]; then

            echo "Release lock unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release lock changed:"
            echo "$CHANGES"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit release lock
        if: steps.lock_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-release-evidence-bot"
          git config user.email "fund100-release-evidence-bot@users.noreply.github.com"

          git add release_outputs/v5_002/pre_live_release_lock.json

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Freeze V5-002 pre-live safe baseline"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: working tree became dirty after release-lock commit."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 PRE-LIVE BASELINE LOCK COMPLETE"
          echo "========================================"
          echo "Broker credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "Engineering baseline: LOCKED"
          echo "Automatic activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum live execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "Orders submitted: 0"
