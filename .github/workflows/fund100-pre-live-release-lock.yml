name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

jobs:
  release-lock:
    name: Freeze Offline-Rehearsed Writer Baseline

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify v1.4 lock inputs
        run: |
          set -euo pipefail

          test -f fund100_pre_live_release_lock.py
          test -f fund100_pre_live_release_lock_v1_1.py
          test -f fund100_pre_live_release_lock_v1_2.py
          test -f fund100_pre_live_release_lock_v1_3.py
          test -f fund100_pre_live_release_lock_v1_4.py

          test -f test_fund100_pre_live_release_lock_v1_4.py

          test -f fund100_alpaca_live_execution_materializer.py
          test -f fund100_alpaca_live_writer_candidate_v1_0.py

          test -f \
            fund100_alpaca_live_writer_transport_rehearsal_v1_0.py

          test -f \
            test_fund100_alpaca_live_writer_transport_rehearsal_v1_0.py

          test -f audit_fund100_live_boundary_v1_12.py

          test -f \
            .github/workflows/fund100-live-writer-transport-rehearsal.yml

          test -f \
            live_dryrun_outputs/v5_002/live_writer_transport_rehearsal_v1_0.json

          test -f \
            release_outputs/v5_002/pre_live_release_evidence.json

          test -f \
            release_outputs/v5_002/pre_live_release_evidence.md

          test -f \
            release_outputs/v5_002/pre_live_release_lock.json

          echo "Release-lock v1.4 dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run V5-002 engine parity
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py

      - name: Re-run LIVE static safety audit v1.12
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_12.py

      - name: Verify committed offline rehearsal evidence
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          lock_path = (
              "release_outputs/v5_002/"
              "pre_live_release_lock.json"
          )

          rehearsal_path = (
              "live_dryrun_outputs/v5_002/"
              "live_writer_transport_rehearsal_v1_0.json"
          )

          with open(
              lock_path,
              "r",
              encoding="utf-8",
          ) as handle:
              lock_package = json.load(handle)

          lock_body = (
              lock_package[
                  "release_lock"
              ]
          )

          canonical_lock = json.dumps(
              lock_body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical_lock.encode("utf-8")
              ).hexdigest()
              == lock_package[
                  "release_lock_sha256"
              ]
          )

          assert (
              lock_body[
                  "release_lock_builder_version"
              ]
              == "1.3"
          )

          with open(
              rehearsal_path,
              "r",
              encoding="utf-8",
          ) as handle:
              rehearsal_package = json.load(handle)

          body = (
              rehearsal_package[
                  "rehearsal"
              ]
          )

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == rehearsal_package[
                  "rehearsal_sha256"
              ]
          )

          assert (
              body[
                  "source_release_lock_sha256"
              ]
              == lock_package[
                  "release_lock_sha256"
              ]
          )

          assert (
              body[
                  "source_release_lock_builder_version"
              ]
              == "1.3"
          )

          assert (
              body[
                  "candidate_transport_constant_false_before_after"
              ]
              is True
          )

          assert (
              body[
                  "candidate_public_execution_constant_false_before_after"
              ]
              is True
          )

          assert (
              body[
                  "clean_restart_duplicate_suppression"
              ]
              is True
          )

          assert (
              body[
                  "partial_restart_missing_only"
              ]
              is True
          )

          assert (
              body[
                  "response_loss_restart_duplicate_suppression"
              ]
              is True
          )

          assert (
              body[
                  "existing_order_mismatch_rejected"
              ]
              is True
          )

          assert (
              body[
                  "at_most_once_client_order_id_behavior_verified"
              ]
              is True
          )

          assert (
              body[
                  "real_alpaca_credentials_supplied"
              ]
              is False
          )

          assert (
              body[
                  "real_broker_network_access"
              ]
              is False
          )

          assert (
              body[
                  "real_broker_get_requests"
              ]
              == 0
          )

          assert (
              body[
                  "real_broker_post_requests"
              ]
              == 0
          )

          assert (
              body[
                  "orders_submitted_to_alpaca"
              ]
              == 0
          )

          print(
              "Prior writer-candidate lock v1.3: PASS"
          )

          print(
              "Offline rehearsal SHA256: PASS"
          )

          print(
              "Rehearsal-to-lock binding: PASS"
          )

          print(
              "Restart/idempotency evidence: PASS"
          )

          print(
              "Real broker requests: 0"
          )

          print(
              "Orders submitted to Alpaca: 0"
          )
          PY

      - name: Re-run position-aware release evidence gate
        env:
          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_PRECHECK_TESTS: PASS
          FUND100_PRECHECK_ENGINE_PARITY: PASS
          FUND100_PRECHECK_STATIC_AUDIT: PASS

        run: |
          set -euo pipefail
          python fund100_pre_live_release_gate_v1_1.py

      - name: Restore committed release evidence snapshot
        run: |
          set -euo pipefail

          git restore \
            --source=HEAD \
            -- \
            release_outputs/v5_002/pre_live_release_evidence.json \
            release_outputs/v5_002/pre_live_release_evidence.md

          echo "Release evidence verification complete."

      - name: Build rehearsal-evidence release lock v1.4
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock_v1_4.py

      - name: Verify v1.4 release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          lock_path = (
              root
              / "release_outputs"
              / "v5_002"
              / "pre_live_release_lock.json"
          )

          candidate_path = (
              root
              / "fund100_alpaca_live_writer_candidate_v1_0.py"
          )

          with lock_path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package[
              "release_lock"
          ]

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == package[
                  "release_lock_sha256"
              ]
          )

          assert (
              body[
                  "release_lock_builder_version"
              ]
              == "1.4"
          )

          assert (
              body[
                  "release_layer"
              ]
              == "v1.1-position-aware-issuer-aware-writer-rehearsed-locked"
          )

          assert (
              body[
                  "offline_connected_writer_rehearsal_completed"
              ]
              is True
          )

          assert (
              body[
                  "offline_connected_writer_rehearsal_verified"
              ]
              is True
          )

          assert (
              body[
                  "offline_connected_writer_rehearsal_required"
              ]
              is False
          )

          assert (
              body[
                  "offline_connected_writer_rehearsal_artifact_locked"
              ]
              is True
          )

          assert (
              body[
                  "static_audit_v1_12_source_locked"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_runtime_check_required"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_runtime_check_completed"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_release_still_required"
              ]
              is True
          )

          assert (
              body[
                  "connected_writer_candidate_transport_released"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          assert (
              body[
                  "live_writer_transport_released"
              ]
              is False
          )

          assert (
              body[
                  "live_writer_public_execution_enabled"
              ]
              is False
          )

          assert (
              body[
                  "automatic_activation_allowed"
              ]
              is False
          )

          assert (
              body[
                  "live_execution_authorized"
              ]
              is False
          )

          assert (
              body[
                  "permit_issued"
              ]
              is False
          )

          assert (
              float(
                  body[
                      "max_live_execution_notional_usd"
                  ]
              )
              == 0.0
          )

          assert (
              body[
                  "network_write_capability"
              ]
              is False
          )

          assert (
              body[
                  "writer_connected"
              ]
              is False
          )

          assert (
              int(
                  body[
                      "orders_submitted"
                  ]
              )
              == 0
          )

          # ----------------------------------------------
          # Inspect release constants without importing
          # the POST-capable candidate.
          # ----------------------------------------------

          source = candidate_path.read_text(
              encoding="utf-8"
          )

          tree = ast.parse(
              source
          )

          constants = {}

          for node in tree.body:

              if not isinstance(
                  node,
                  ast.Assign,
              ):

                  continue

              if (
                  len(
                      node.targets
                  )
                  != 1
              ):

                  continue

              target = node.targets[0]

              if not isinstance(
                  target,
                  ast.Name,
              ):

                  continue

              if (
                  target.id
                  not in {
                      "TRANSPORT_RELEASED",
                      "PUBLIC_EXECUTION_ENABLED",
                  }
              ):

                  continue

              assert isinstance(
                  node.value,
                  ast.Constant,
              )

              constants[
                  target.id
              ] = (
                  node.value.value
              )

          assert (
              constants[
                  "TRANSPORT_RELEASED"
              ]
              is False
          )

          assert (
              constants[
                  "PUBLIC_EXECUTION_ENABLED"
              ]
              is False
          )

          hashes = (
              body[
                  "critical_file_sha256"
              ]
          )

          required = [
              "fund100_alpaca_live_writer_transport_rehearsal_v1_0.py",
              "test_fund100_alpaca_live_writer_transport_rehearsal_v1_0.py",
              "audit_fund100_live_boundary_v1_12.py",
              ".github/workflows/fund100-live-writer-transport-rehearsal.yml",
              "live_dryrun_outputs/v5_002/live_writer_transport_rehearsal_v1_0.json",
              "fund100_pre_live_release_lock_v1_4.py",
              "test_fund100_pre_live_release_lock_v1_4.py",
          ]

          for filename in required:

              assert filename in hashes

              actual = hashlib.sha256(
                  (
                      root
                      / filename
                  ).read_bytes()
              ).hexdigest()

              assert (
                  actual
                  == hashes[
                      filename
                  ]
              )

          print(
              "Release-lock SHA256: PASS"
          )

          print(
              "Offline writer rehearsal evidence: LOCKED"
          )

          print(
              "Restart/idempotency proof: LOCKED"
          )

          print(
              "Static Audit v1.12: LOCKED"
          )

          print(
              "Candidate TRANSPORT_RELEASED: FALSE"
          )

          print(
              "Candidate PUBLIC_EXECUTION_ENABLED: FALSE"
          )

          print(
              "GET-only runtime pre-connect check required: YES"
          )

          print(
              "Live execution authorized: FALSE"
          )

          print(
              "Permit issued: FALSE"
          )

          print(
              "Writer connected: FALSE"
          )
          PY

      - name: Verify only release lock changed
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. release_outputs/v5_002/pre_live_release_lock\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then

            echo "Unexpected working-tree changes detected:"
            echo "$EXTRA"
            git status --short
            exit 1

          fi

          echo "Only expected release-lock change is present."

      - name: Check release-lock changes
        id: lock_check
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              release_outputs/v5_002/pre_live_release_lock.json
          )"

          if [ -z "$CHANGES" ]; then

            echo "Release lock unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "Release lock changed:"
            echo "$CHANGES"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit rehearsal-evidence release lock
        if: steps.lock_check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-release-evidence-bot"

          git config \
            user.email \
            "fund100-release-evidence-bot@users.noreply.github.com"

          git add \
            release_outputs/v5_002/pre_live_release_lock.json

          if git diff --cached --quiet; then

            echo "Nothing staged."
            exit 0

          fi

          git commit \
            -m "Freeze offline V5-002 writer rehearsal evidence"

          if [ -n "$(git status --porcelain)" ]; then

            echo "Unexpected dirty working tree."
            git status --short
            exit 1

          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 OFFLINE-REHEARSED BASELINE LOCK COMPLETE"
          echo "========================================"
          echo "Broker credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "Position-aware baseline: LOCKED"
          echo "Issuer-aware baseline: LOCKED"
          echo "Execution materializer: LOCKED"
          echo "Connected-writer candidate: LOCKED"
          echo "Offline writer rehearsal evidence: LOCKED"
          echo "Restart/idempotency evidence: LOCKED"
          echo "Static Audit v1.12: LOCKED"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "GET-only runtime pre-connect check required: YES"
          echo "Connected-writer release still required: YES"
          echo "Automatic activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum live execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "Orders submitted: 0"
