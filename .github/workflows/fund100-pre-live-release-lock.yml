name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

jobs:
  release-lock:
    name: Freeze PAPER Connected-Writer Parity Evidence

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify v1.6 inputs
        run: |
          set -euo pipefail

          test -f fund100_pre_live_release_lock.py
          test -f fund100_pre_live_release_lock_v1_5.py
          test -f fund100_pre_live_release_lock_v1_6.py

          test -f test_fund100_pre_live_release_lock_v1_6.py

          test -f fund100_alpaca_paper_transport_v1_0.py
          test -f fund100_alpaca_paper_writer_parity_v1_0.py
          test -f test_fund100_alpaca_paper_writer_parity_v1_0.py

          test -f \
            .github/workflows/fund100-alpaca-paper-writer-parity.yml

          test -f \
            live_dryrun_outputs/v5_002/paper_connected_writer_parity_v1_0.json

          test -f audit_fund100_live_boundary_v1_13.py

          test -f \
            release_outputs/v5_002/pre_live_release_lock.json

          echo "Release-lock v1.6 dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run V5-002 engine parity
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py

      - name: Re-run LIVE static safety audit v1.13
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_13.py

      - name: Verify committed PAPER parity evidence
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          lock_path = (
              "release_outputs/v5_002/"
              "pre_live_release_lock.json"
          )

          parity_path = (
              "live_dryrun_outputs/v5_002/"
              "paper_connected_writer_parity_v1_0.json"
          )

          with open(
              lock_path,
              "r",
              encoding="utf-8",
          ) as handle:
              lock_package = json.load(handle)

          lock_body = lock_package["release_lock"]

          lock_canonical = json.dumps(
              lock_body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  lock_canonical.encode("utf-8")
              ).hexdigest()
              == lock_package["release_lock_sha256"]
          )

          assert (
              lock_body["release_lock_builder_version"]
              == "1.5"
          )

          assert (
              lock_body["paper_connected_writer_parity_required"]
              is True
          )

          assert (
              lock_body["paper_connected_writer_parity_completed"]
              is False
          )

          assert (
              lock_body["connected_writer_candidate_transport_released"]
              is False
          )

          assert (
              lock_body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          with open(
              parity_path,
              "r",
              encoding="utf-8",
          ) as handle:
              parity_package = json.load(handle)

          parity = parity_package["paper_parity"]

          parity_canonical = json.dumps(
              parity,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  parity_canonical.encode("utf-8")
              ).hexdigest()
              == parity_package["paper_parity_sha256"]
          )

          assert (
              parity["source_release_lock_builder_version"]
              == "1.5"
          )

          assert (
              parity["source_release_lock_sha256"]
              == lock_package["release_lock_sha256"]
          )

          assert (
              parity["first_submission_status"]
              == "SUBMITTED"
          )

          assert (
              parity["restart_status"]
              == "EXISTING_MATCHING_ORDER"
          )

          assert (
              parity["candidate_get_requests"]
              == 2
          )

          assert (
              parity["candidate_post_requests"]
              == 1
          )

          assert (
              parity["duplicate_post_requests"]
              == 0
          )

          assert (
              parity["candidate_non_paper_host_requests"]
              == 0
          )

          assert (
              parity["paper_cancel_requested"]
              is True
          )

          assert (
              parity["paper_cancel_response_code"]
              == 204
          )

          assert (
              parity["paper_order_terminal_status"]
              == "CANCELED"
          )

          assert (
              parity["paper_order_zero_fill_verified"]
              is True
          )

          assert (
              parity["open_order_index_converged"]
              is True
          )

          assert (
              parity["final_genuinely_open_orders"]
              == 0
          )

          assert (
              parity["live_endpoint_contacted"]
              is False
          )

          assert (
              parity["live_credentials_supplied"]
              is False
          )

          assert (
              parity["live_execution_authorized"]
              is False
          )

          assert (
              parity["live_permit_issued"]
              is False
          )

          assert (
              float(
                  parity["live_max_execution_notional_usd"]
              )
              == 0.0
          )

          assert (
              parity["live_writer_connected"]
              is False
          )

          assert (
              parity["live_orders_submitted"]
              == 0
          )

          print("Prior release lock v1.5: PASS")
          print("PAPER parity SHA256: PASS")
          print("Parity-to-v1.5 binding: PASS")
          print("Candidate GET-before-POST: PASS")
          print("Candidate POST count: 1")
          print("Duplicate POST count: 0")
          print("PAPER cancel response: 204")
          print("PAPER terminal state: CANCELED")
          print("PAPER zero-fill: PASS")
          print("Open-order index convergence: PASS")
          print("Final genuinely open orders: 0")
          print("LIVE endpoint contact: NONE")
          print("LIVE orders submitted: 0")
          PY

      - name: Build PAPER parity release lock v1.6
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock_v1_6.py

      - name: Verify v1.6 release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          path = (
              root
              / "release_outputs"
              / "v5_002"
              / "pre_live_release_lock.json"
          )

          with path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package["release_lock"]

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == package["release_lock_sha256"]
          )

          assert (
              body["release_lock_builder_version"]
              == "1.6"
          )

          assert (
              body["paper_connected_writer_parity_required"]
              is False
          )

          assert (
              body["paper_connected_writer_parity_completed"]
              is True
          )

          assert (
              body["paper_connected_writer_parity_verified"]
              is True
          )

          assert (
              body["paper_connected_writer_zero_fill_verified"]
              is True
          )

          assert (
              body["paper_connected_writer_open_index_converged"]
              is True
          )

          assert (
              body["paper_connected_writer_duplicate_posts"]
              == 0
          )

          assert (
              body["paper_connected_writer_live_endpoint_contacts"]
              == 0
          )

          assert (
              body["paper_connected_writer_live_orders"]
              == 0
          )

          assert (
              body[
                  "connected_writer_status_semantics_hardening_required"
              ]
              is True
          )

          assert (
              body[
                  "connected_writer_status_semantics_hardening_completed"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_cumulative_cap_recovery_required"
              ]
              is True
          )

          assert (
              body[
                  "connected_writer_cumulative_cap_recovery_completed"
              ]
              is False
          )

          assert (
              body["connected_writer_release_still_required"]
              is True
          )

          assert (
              body["connected_writer_candidate_transport_released"]
              is False
          )

          assert (
              body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          assert (
              body["connected_writer_candidate_workflow_exposed"]
              is False
          )

          assert (
              body["live_writer_transport_released"]
              is False
          )

          assert (
              body["live_writer_public_execution_enabled"]
              is False
          )

          assert (
              body["automatic_activation_allowed"]
              is False
          )

          assert (
              body["live_execution_authorized"]
              is False
          )

          assert (
              body["permit_issued"]
              is False
          )

          assert (
              float(
                  body["max_live_execution_notional_usd"]
              )
              == 0.0
          )

          assert (
              body["network_write_capability"]
              is False
          )

          assert (
              body["writer_connected"]
              is False
          )

          assert (
              body["orders_submitted"]
              == 0
          )

          hashes = body["critical_file_sha256"]

          assert (
              body["critical_file_count"]
              == len(hashes)
          )

          required = [
              "fund100_alpaca_paper_transport_v1_0.py",
              "fund100_alpaca_paper_writer_parity_v1_0.py",
              "test_fund100_alpaca_paper_writer_parity_v1_0.py",
              ".github/workflows/"
              "fund100-alpaca-paper-writer-parity.yml",
              "live_dryrun_outputs/v5_002/"
              "paper_connected_writer_parity_v1_0.json",
              "fund100_pre_live_release_lock_v1_6.py",
              "test_fund100_pre_live_release_lock_v1_6.py",
              ".github/workflows/"
              "fund100-pre-live-release-lock.yml",
          ]

          for filename in required:

              assert filename in hashes

              actual = hashlib.sha256(
                  (
                      root
                      / filename
                  ).read_bytes()
              ).hexdigest()

              assert (
                  hashes[filename]
                  == actual
              )

          print("Release-lock SHA256: PASS")
          print("PAPER connected-writer parity: LOCKED")
          print("PAPER zero-fill evidence: LOCKED")
          print("PAPER restart/idempotency evidence: LOCKED")
          print("Candidate transport released: FALSE")
          print("Candidate public execution enabled: FALSE")
          print("Status-semantics hardening required: YES")
          print("Cumulative-cap recovery hardening required: YES")
          print("Live execution authorized: FALSE")
          print("Permit issued: FALSE")
          print("Writer connected: FALSE")
          PY

      - name: Verify only release lock changed
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. release_outputs/v5_002/pre_live_release_lock\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then
            echo "Unexpected working-tree changes:"
            echo "$EXTRA"
            git status --short
            exit 1
          fi

          echo "Only expected release-lock change is present."

      - name: Check release-lock changes
        id: lock_check
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              release_outputs/v5_002/pre_live_release_lock.json
          )"

          if [ -z "$CHANGES" ]; then
            echo "Release lock unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release lock changed:"
            echo "$CHANGES"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit PAPER parity release lock
        if: steps.lock_check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-release-evidence-bot"

          git config \
            user.email \
            "fund100-release-evidence-bot@users.noreply.github.com"

          git add \
            release_outputs/v5_002/pre_live_release_lock.json

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Freeze V5-002 PAPER writer parity evidence"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected dirty working tree."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 PAPER-PARITY BASELINE LOCK COMPLETE"
          echo "========================================"
          echo "Broker credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "LIVE GET-only pre-connect evidence: LOCKED"
          echo "PAPER connected-writer parity: LOCKED"
          echo "PAPER GET-before-POST evidence: LOCKED"
          echo "PAPER restart duplicate suppression: LOCKED"
          echo "PAPER zero-fill cleanup: LOCKED"
          echo "PAPER open-order convergence: LOCKED"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Status-semantics hardening required: YES"
          echo "Cumulative-cap recovery hardening required: YES"
          echo "Connected-writer LIVE release still required: YES"
          echo "Automatic activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum LIVE execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "LIVE orders submitted: 0"
