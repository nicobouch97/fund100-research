name: Fund-100 Pre-Live Safe Baseline Lock

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-pre-live-safe-baseline-lock
  cancel-in-progress: false

jobs:
  release-lock:
    name: Freeze GET-Only Live Pre-Connect Evidence

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify v1.5 lock inputs
        run: |
          set -euo pipefail

          test -f fund100_pre_live_release_lock.py
          test -f fund100_pre_live_release_lock_v1_4.py
          test -f fund100_pre_live_release_lock_v1_5.py

          test -f test_fund100_pre_live_release_lock_v1_5.py

          test -f fund100_alpaca_live_preconnect_runtime_check.py
          test -f test_fund100_alpaca_live_preconnect_runtime_check.py

          test -f audit_fund100_live_boundary_v1_13.py

          test -f \
            .github/workflows/fund100-live-static-audit.yml

          test -f \
            .github/workflows/fund100-alpaca-live-preconnect-runtime-check.yml

          test -f \
            live_dryrun_outputs/v5_002/live_preconnect_runtime_check.json

          test -f \
            live_dryrun_outputs/v5_002/live_execution_manifest.json

          test -f \
            live_dryrun_outputs/v5_002/scheduled_execution_time.json

          test -f \
            release_outputs/v5_002/pre_live_release_lock.json

          test -f \
            release_outputs/v5_002/pre_live_release_evidence.json

          test -f \
            release_outputs/v5_002/pre_live_release_evidence.md

          echo "Release-lock v1.5 dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run V5-002 engine parity
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py

      - name: Re-run LIVE static safety audit v1.13
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_13.py

      - name: Re-run position-aware release evidence gate
        env:
          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_PRECHECK_TESTS: PASS
          FUND100_PRECHECK_ENGINE_PARITY: PASS
          FUND100_PRECHECK_STATIC_AUDIT: PASS

        run: |
          set -euo pipefail
          python fund100_pre_live_release_gate_v1_1.py

      - name: Restore committed release evidence snapshot
        run: |
          set -euo pipefail

          git restore \
            --source=HEAD \
            -- \
            release_outputs/v5_002/pre_live_release_evidence.json \
            release_outputs/v5_002/pre_live_release_evidence.md

          echo "Release evidence verification complete."

      - name: Verify committed GET-only pre-connect evidence
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          lock_path = (
              "release_outputs/v5_002/"
              "pre_live_release_lock.json"
          )

          runtime_path = (
              "live_dryrun_outputs/v5_002/"
              "live_preconnect_runtime_check.json"
          )

          with open(
              lock_path,
              "r",
              encoding="utf-8",
          ) as handle:
              lock_package = json.load(handle)

          lock_body = (
              lock_package[
                  "release_lock"
              ]
          )

          canonical_lock = json.dumps(
              lock_body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical_lock.encode("utf-8")
              ).hexdigest()
              == lock_package[
                  "release_lock_sha256"
              ]
          )

          assert (
              lock_body[
                  "release_lock_builder_version"
              ]
              == "1.4"
          )

          assert (
              lock_body[
                  "live_preconnect_runtime_check_required"
              ]
              is True
          )

          assert (
              lock_body[
                  "live_preconnect_runtime_check_completed"
              ]
              is False
          )

          assert (
              lock_body[
                  "connected_writer_candidate_transport_released"
              ]
              is False
          )

          assert (
              lock_body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          with open(
              runtime_path,
              "r",
              encoding="utf-8",
          ) as handle:
              runtime_package = json.load(handle)

          runtime = (
              runtime_package[
                  "runtime_check"
              ]
          )

          canonical_runtime = json.dumps(
              runtime,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical_runtime.encode("utf-8")
              ).hexdigest()
              == runtime_package[
                  "runtime_check_sha256"
              ]
          )

          assert (
              runtime[
                  "source_release_lock_sha256"
              ]
              == lock_package[
                  "release_lock_sha256"
              ]
          )

          assert (
              runtime[
                  "source_release_lock_builder_version"
              ]
              == "1.4"
          )

          assert (
              runtime[
                  "preconnect_runtime_check_passed"
              ]
              is True
          )

          assert (
              runtime[
                  "runtime_binding_matches_locked_chain"
              ]
              is True
          )

          assert (
              runtime[
                  "candidate_module_imported"
              ]
              is False
          )

          assert (
              runtime[
                  "candidate_transport_released"
              ]
              is False
          )

          assert (
              runtime[
                  "candidate_public_execution_enabled"
              ]
              is False
          )

          assert (
              runtime[
                  "broker_http_methods"
              ]
              == "GET_ONLY"
          )

          assert (
              runtime[
                  "broker_get_request_count"
              ]
              == 4
          )

          assert (
              runtime[
                  "broker_post_request_count"
              ]
              == 0
          )

          assert (
              runtime[
                  "broker_put_request_count"
              ]
              == 0
          )

          assert (
              runtime[
                  "broker_patch_request_count"
              ]
              == 0
          )

          assert (
              runtime[
                  "broker_delete_request_count"
              ]
              == 0
          )

          assert (
              runtime[
                  "open_order_count"
              ]
              == 0
          )

          assert (
              runtime[
                  "live_holdings_persisted"
              ]
              is False
          )

          assert (
              runtime[
                  "live_dollar_values_persisted"
              ]
              is False
          )

          assert (
              runtime[
                  "live_execution_authorized"
              ]
              is False
          )

          assert (
              runtime[
                  "permit_issued"
              ]
              is False
          )

          assert (
              float(
                  runtime[
                      "max_live_execution_notional_usd"
                  ]
              )
              == 0.0
          )

          assert (
              runtime[
                  "writer_connected"
              ]
              is False
          )

          assert (
              runtime[
                  "orders_submitted"
              ]
              == 0
          )

          print("Prior release lock v1.4: PASS")
          print("Runtime-check SHA256: PASS")
          print("Runtime-to-lock binding: PASS")
          print("Fresh LIVE structural binding: PASS")
          print("Open orders: 0")
          print("Broker HTTP methods: GET ONLY")
          print("Broker write requests: 0")
          print("Live execution authorized: FALSE")
          print("Orders submitted: 0")
          PY

      - name: Build pre-connect evidence release lock v1.5
        run: |
          set -euo pipefail
          python fund100_pre_live_release_lock_v1_5.py

      - name: Verify v1.5 release lock
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          path = (
              root
              / "release_outputs"
              / "v5_002"
              / "pre_live_release_lock.json"
          )

          with path.open(
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = (
              package[
                  "release_lock"
              ]
          )

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == package[
                  "release_lock_sha256"
              ]
          )

          assert (
              body[
                  "schema"
              ]
              == "FUND100_PRE_LIVE_RELEASE_LOCK_V1_1"
          )

          assert (
              body[
                  "release_lock_builder_version"
              ]
              == "1.5"
          )

          assert (
              body[
                  "release_layer"
              ]
              == (
                  "v1.1-position-aware-issuer-aware-"
                  "writer-rehearsed-preconnect-locked"
              )
          )

          assert (
              body[
                  "live_preconnect_runtime_check_required"
              ]
              is False
          )

          assert (
              body[
                  "live_preconnect_runtime_check_completed"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_runtime_check_verified"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_runtime_check_artifact_locked"
              ]
              is True
          )

          assert (
              body[
                  "static_audit_v1_13_source_locked"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_workflow_source_locked"
              ]
              is True
          )

          assert (
              body[
                  "live_preconnect_runtime_broker_http_methods"
              ]
              == "GET_ONLY"
          )

          assert (
              body[
                  "live_preconnect_runtime_broker_write_request_count"
              ]
              == 0
          )

          assert (
              body[
                  "live_preconnect_runtime_evidence_persists_holdings"
              ]
              is False
          )

          assert (
              body[
                  "live_preconnect_runtime_evidence_persists_dollar_values"
              ]
              is False
          )

          assert (
              body[
                  "paper_connected_writer_parity_required"
              ]
              is True
          )

          assert (
              body[
                  "paper_connected_writer_parity_completed"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_release_still_required"
              ]
              is True
          )

          assert (
              body[
                  "connected_writer_candidate_transport_released"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_candidate_public_execution_enabled"
              ]
              is False
          )

          assert (
              body[
                  "connected_writer_candidate_workflow_exposed"
              ]
              is False
          )

          assert (
              body[
                  "live_writer_transport_released"
              ]
              is False
          )

          assert (
              body[
                  "live_writer_public_execution_enabled"
              ]
              is False
          )

          assert (
              body[
                  "automatic_activation_allowed"
              ]
              is False
          )

          assert (
              body[
                  "live_execution_authorized"
              ]
              is False
          )

          assert (
              body[
                  "permit_issued"
              ]
              is False
          )

          assert (
              float(
                  body[
                      "max_live_execution_notional_usd"
                  ]
              )
              == 0.0
          )

          assert (
              body[
                  "network_write_capability"
              ]
              is False
          )

          assert (
              body[
                  "writer_connected"
              ]
              is False
          )

          assert (
              int(
                  body[
                      "orders_submitted"
                  ]
              )
              == 0
          )

          hashes = (
              body[
                  "critical_file_sha256"
              ]
          )

          assert (
              body[
                  "critical_file_set_sha256"
              ]
              == hashlib.sha256(
                  json.dumps(
                      hashes,
                      sort_keys=True,
                      separators=(",", ":"),
                      ensure_ascii=True,
                  ).encode(
                      "utf-8"
                  )
              ).hexdigest()
          )

          assert (
              body[
                  "critical_file_count"
              ]
              == len(
                  hashes
              )
          )

          required = [
              "fund100_alpaca_live_preconnect_runtime_check.py",
              "test_fund100_alpaca_live_preconnect_runtime_check.py",
              "audit_fund100_live_boundary_v1_13.py",
              ".github/workflows/fund100-live-static-audit.yml",
              ".github/workflows/"
              "fund100-alpaca-live-preconnect-runtime-check.yml",
              "live_dryrun_outputs/v5_002/"
              "live_preconnect_runtime_check.json",
              "fund100_pre_live_release_lock_v1_5.py",
              "test_fund100_pre_live_release_lock_v1_5.py",
              ".github/workflows/fund100-pre-live-release-lock.yml",
          ]

          for filename in required:

              assert filename in hashes

              actual = hashlib.sha256(
                  (
                      root
                      / filename
                  ).read_bytes()
              ).hexdigest()

              assert (
                  hashes[
                      filename
                  ]
                  == actual
              )

          print("Release-lock SHA256: PASS")
          print("Pre-connect runtime evidence: LOCKED")
          print("Static Audit v1.13: LOCKED")
          print("Runtime broker methods: GET ONLY")
          print("Runtime broker write requests: 0")
          print("Candidate transport released: FALSE")
          print("Candidate public execution enabled: FALSE")
          print("PAPER writer parity required: YES")
          print("Live execution authorized: FALSE")
          print("Permit issued: FALSE")
          print("Writer connected: FALSE")
          PY

      - name: Verify only release lock changed
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. release_outputs/v5_002/pre_live_release_lock\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then
            echo "Unexpected working-tree changes detected:"
            echo "$EXTRA"
            git status --short
            exit 1
          fi

          echo "Only expected release-lock change is present."

      - name: Check release-lock changes
        id: lock_check
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              release_outputs/v5_002/pre_live_release_lock.json
          )"

          if [ -z "$CHANGES" ]; then
            echo "Release lock unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release lock changed:"
            echo "$CHANGES"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit pre-connect evidence release lock
        if: steps.lock_check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-release-evidence-bot"

          git config \
            user.email \
            "fund100-release-evidence-bot@users.noreply.github.com"

          git add \
            release_outputs/v5_002/pre_live_release_lock.json

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Freeze V5-002 live pre-connect evidence"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected dirty working tree."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 PRE-CONNECT EVIDENCE LOCK COMPLETE"
          echo "========================================"
          echo "Broker credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "Offline writer rehearsal evidence: LOCKED"
          echo "LIVE GET-only pre-connect evidence: LOCKED"
          echo "Static Audit v1.13: LOCKED"
          echo "Pre-connect runtime requirement: COMPLETE"
          echo "Runtime broker methods: GET ONLY"
          echo "Runtime broker write requests: 0"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "PAPER connected-writer parity required: YES"
          echo "Connected-writer LIVE release still required: YES"
          echo "Automatic activation allowed: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum live execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "Orders submitted: 0"
