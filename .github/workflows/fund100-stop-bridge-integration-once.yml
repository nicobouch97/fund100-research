# Retired original emergency STOP bridge one-time acceptance route.
# The one-time STOP run occurred; this workflow now ONLY runs offline tests
# on pull requests. No push trigger, broker secrets, GitHub Actions:write,
# original STOP dispatcher job, STOP completion claims, GO or orders.
name: Fund-100 One-Time STOP Bridge Original Integration Acceptance (NO TRADES)

on:
  pull_request:
    paths:
      - ".github/workflows/fund100-stop-bridge-integration-once.yml"
      - "fund100_stop_bridge_integration_dispatch_once_v1_0.py"
      - "test_fund100_stop_bridge_integration_dispatch_once_v1_0.py"

permissions:
  contents: read

concurrency:
  group: fund100-once-bridge-stop-integration
  cancel-in-progress: false

jobs:
  acceptance-dispatcher-offline-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original one-time main-only STOP dispatch tests (MOCK)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q test_fund100_stop_bridge_integration_dispatch_once_v1_0.py

