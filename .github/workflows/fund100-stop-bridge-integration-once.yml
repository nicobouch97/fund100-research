# Exactly one reviewed post-bridge original emergency STOP acceptance dispatch.
# No Alpaca, no broker mutation, no trading, no GO. This sender uses
# GitHub's fixed original STOP workflow and an isolated Actions:write job.
# Original STOP may selectively cancel matching live Fund-100 orders.
# Must be retired after the accepted one-time integration proof.
name: Fund-100 One-Time STOP Bridge Original Integration Acceptance (NO TRADES)

on:
  pull_request:
    paths:
      - ".github/workflows/fund100-stop-bridge-integration-once.yml"
      - "fund100_stop_bridge_integration_dispatch_once_v1_0.py"
      - "test_fund100_stop_bridge_integration_dispatch_once_v1_0.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-stop-bridge-integration-once.yml"

permissions:
  contents: read

concurrency:
  group: fund100-once-bridge-stop-integration
  cancel-in-progress: false

jobs:
  acceptance-dispatcher-offline-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original one-time main-only STOP dispatch tests (MOCK)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q test_fund100_stop_bridge_integration_dispatch_once_v1_0.py

  dispatch-protected-original-stop-once:
    if: >-
      github.repository == 'nicobouch97/fund100-research' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message,
        'P0: one-time verified STOP bridge integration acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current protected main and audited original STOP bridge
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_REPOSITORY" = 'nicobouch97/fund100-research'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_WORKFLOW_REF" = 'nicobouch97/fund100-research/.github/workflows/fund100-stop-bridge-integration-once.yml@refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          grep -Eq '^LEGACY_V5_BOOTSTRAP_RELEASED *= *False$' fund100_live_bootstrap_v1_0.py
          grep -Eq '^LEGACY_V5_ORDER_SUBMISSION_RELEASED *= *False$' fund100_live_production_controller_v1_0.py
          grep -Eq '^ORIGINAL_ACWI_ENTRYPOINT_RELEASED *= *False$' fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py
          grep -Fq "Notify independent GitHub STOP observer via fixed repository event" .github/workflows/fund100-live-emergency-stop.yml
          grep -Fq "fund100_stop_repo_dispatch_bridge_v1_0.py" .github/workflows/fund100-live-emergency-stop.yml
          test "$(git hash-object fund100_stop_repo_dispatch_bridge_v1_0.py)" = '8d46cbe1b2230dc13eccf50c395b877869702673'
          echo 'Original emergency STOP will run; no broker credential or trading order in this job.'
      - name: Dispatch reviewed emergency STOP exactly once; ACK is not completion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B fund100_stop_bridge_integration_dispatch_once_v1_0.py
