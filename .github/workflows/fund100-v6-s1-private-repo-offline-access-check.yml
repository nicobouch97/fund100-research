name: Fund-100 V6-S1 Cross-Repository Access Contract (OFFLINE)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_private_state_actions_readonly_probe_v1_0.py"
      - "test_fund100_v6_s1_private_state_actions_readonly_probe_v1_0.py"
      - ".github/workflows/fund100-v6-s1-private-repo-offline-access-check.yml"
      - "research_lab/V6_S1_PRIVATE_STATE_REPO_VERIFIED_AND_GETONLY_ACCESS_PROTOCOL_2026_10_20.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install 'pytest>=8,<9'
      - name: Run synthetic remote identity and strict GET-only error tests
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_private_state_actions_readonly_probe_v1_0.py
          python -m pytest -q test_fund100_v6_s1_private_git_cas_protocol_v1_0.py
      - name: Verify no credentials or brokerage requests
        run: |
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_private_state_actions_readonly_probe_v1_0 as p
          assert p.NO_LIVE_TRADING
          assert len(p.ALLOW)==2
          s=Path(p.__file__).read_text()
          for bad in ('method="POST"', 'method="PUT"', 'ALPACA_LIVE_KEY'):
              assert bad not in s
          print("Offline-only: private repo LIVE Actions access and CAS updates remain UNTESTED.")
          PY
