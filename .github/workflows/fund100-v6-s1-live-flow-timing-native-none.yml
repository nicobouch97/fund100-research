name: Fund-100 V6-S1 LIVE Funding Timing and NONE History Seven GET (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py"
      - "test_fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py"
      - "fund100_v6_s1_live_cashflow_risk_bounds_v1_0.py"
      - "test_fund100_v6_s1_live_cashflow_risk_bounds_v1_0.py"
      - "test_fund100_v6_s1_flow_timing_pinned_scope_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - "research_lab/V6_S1_REAL_SOURCE_CASHFLOW_TIMING_AND_NATIVE_NONE_PROTOCOL_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-live-flow-timing-native-none.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py"
      - "fund100_v6_s1_live_cashflow_risk_bounds_v1_0.py"
      - ".github/workflows/fund100-v6-s1-live-flow-timing-native-none.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-s1-private-funding-seven-get
  cancel-in-progress: false

jobs:
  nontrading-source-and-scope-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only existing offline research test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Original cashflow timing, NONE PNL source and exact approval scope
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py
          python -m pytest -q test_fund100_v6_s1_live_cashflow_risk_bounds_v1_0.py
          python -m pytest -q test_fund100_v6_s1_flow_timing_pinned_scope_v1_0.py
          python -m pytest -q test_fund100_v6_s1_live_private_xle_activity_getonly_v1_0.py
          python -m pytest -q test_fund100_v6_s1_funding_adjusted_risk_dietz_v1_0.py
      - name: Verify original LIVE STOP and source observer no-POST
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          import ast
          from pathlib import Path
          import fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0 as q
          assert len(q.PATHS)==7
          assert q.EXTRA_PARAMS=={'period':'1M','timeframe':'1D','cashflow_types':'NONE'}
          s=Path(q.__file__).read_text()
          for bad in ('submit_'+'authorized_order_batch(', 'requests.post(',
                      'method="POST"', 'method="DELETE"'):
              assert bad not in s
          assert not any(isinstance(n,ast.FunctionDef) and n.name in ('submit_order','place_order')
                         for n in ast.walk(ast.parse(s)))
          print('Original seven read-only GETs. No real-money order authority.')
          PY

  authentic-private-seven-get:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: nontrading-source-and-scope-fixtures
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check credential eligibility only for reviewed exact seven-GET source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import audit_fund100_live_boundary as a
          w='.github/workflows/fund100-v6-s1-live-flow-timing-native-none.yml'
          p='fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py'
          assert a.approved_scoped_live_script(w,p,Path(w).read_text())
          print('SHA-pinned GET-only financial source reader PASS.')
          PY
      - name: Query actual private funding timing and native NONE series (SEVEN GET ONLY)
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          python fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py
      - name: Confirm original STOP remains disabled
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'LIVE funding data qualified without brokerage orders or account balance disclosure.'
