name: Audit Fund-100 V5-002 Engine

on:
  workflow_dispatch:

jobs:
  parity-audit:
    name: V5-002 Engine Parity Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run existing tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Run V5-002 parity audit
        run: |
          set -euo pipefail
          python audit_v5_002_engine.py
