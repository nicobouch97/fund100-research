name: Fund-100 V6-S1 Trading Account Cash Capability (OFFLINE)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_trading_account_cash_capability_v1_0.py"
      - "test_fund100_v6_s1_trading_account_cash_capability_v1_0.py"
      - "research_lab/V6_S1_ACTUAL_TRADING_API_ACCOUNT_SETTLEMENT_FIELD_PROTOCOL_2026_10_20.md"
      - ".github/workflows/fund100-v6-s1-trading-account-cash-capability-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documented-account-shape-is-not-cash-settlement-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Test independent Trading account field inventory, BUY settlement hold
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_trading_account_cash_capability_v1_0.py
          python -m pytest -q test_fund100_v6_s1_settled_sale_cash_source_gate_v1_0.py
          python -m pytest -q test_fund100_v6_s1_independent_high_exante_policy_v1_0.py
      - name: No broker or private state token and unchanged remote operator STOP
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_trading_account_cash_capability_v1_0 as q
          assert q.ACTUAL_SETTLEMENT_PROOF_AUTHORIZED is False
          s=Path(q.__file__).read_text()
          assert 'urlopen(' not in s
          assert 'method="POST"' not in s
          print('Trading Account source-shape CLASSIFIER ONLY; no LIVE GET or order authorization.')
          PY
