name: Fund-100 V6 Signed Genesis Regression (RETIRED WRITER; NO BROKER)

# The first genuine private signed recurring seq0 was created and independently
# HMAC-read on main in run 40876805816 (2026-10-29). This ONE-TIME writer
# must never be rearmed by a later push, dispatch, schedule or rerun.
# Retain credentialless regression tests only; no protected environment,
# production secrets, private Git mutation or brokerage access.
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-v6-recurring-signed-genesis-production-once.yml"
      - "fund100_v6_recurring_production_genesis_once_v1_0.py"
      - "test_fund100_v6_recurring_production_genesis_once_v1_0.py"

permissions:
  contents: read

jobs:
  credentialless-no-order-one-shot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regress signed original proof and single-create failure handling (FAKE ONLY)
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_recurring_production_genesis_once_v1_0.py \
            test_fund100_v6_recurring_protected_genesis_transport_candidate_v1_0.py \
            test_fund100_v6_recurring_private_protected_getonly_v1_0.py \
            test_fund100_v6_recurring_genesis_single_create_offline_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
