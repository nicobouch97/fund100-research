name: Fund-100 V5 Native PAPER Compiler (offline)

on:
  push:
    branches: [main]
    paths:
      - "fund100_v5_paper_native_compiler_v1_0.py"
      - "test_fund100_v5_paper_native_compiler_v1_0.py"
      - ".github/workflows/fund100-v5-paper-native-compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v5-paper-native-compiler
  cancel-in-progress: true

jobs:
  offline-model-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confirm pure PAPER-source compiler uses frozen model
        run: |
          set -euo pipefail
          python -m py_compile \
            fund100_v5_paper_native_compiler_v1_0.py \
            test_fund100_v5_paper_native_compiler_v1_0.py
          python -m pytest -q \
            test_fund100_v5_paper_native_compiler_v1_0.py \
            test_fund100_v5_compiler_attestation_v1_0.py \
            test_fund100_v5_genuine_paper_parity_v1_0.py
