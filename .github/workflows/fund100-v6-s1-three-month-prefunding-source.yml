name: Fund-100 V6-S1 Protected Three-Month Prefunding Eight GET (NO ORDERS)

on:
  # One unattended weekly replay nine minutes after NYSE core open.
  # 09:39 America/New_York automatically tracks EST/EDT; no UTC drift.
  # This is a STOP-only eight-GET observation, NOT a trade release.
  # GitHub schedule delivery is best effort; a missed slot never authorises an order.
  schedule:
    - cron: "39 9 * * 1"
      timezone: "America/New_York"
  push:
    branches: [main]
    paths:
      - "fund100_v6_s1_three_month_prefunding_probe_v1_0.py"
      - "test_fund100_v6_s1_three_month_prefunding_probe_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - "test_fund100_v6_s1_three_month_protected_scope_v1_0.py"
      - ".github/workflows/fund100-v6-s1-three-month-prefunding-source.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-s1-three-month-original-readonly
  cancel-in-progress: false

jobs:
  source-integrity-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner and reviewed NYSE calendar
        # This job has NO broker or private state credentials. The same
        # pinned dependencies are used by the separately gated 8-GET job.
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'pytest>=8,<9' 'pandas==2.3.3' 'exchange-calendars==4.13.2'
      - name: Prove 8-GET, original source, and signed STOP boundary offline
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_three_month_prefunding_probe_v1_0.py test_fund100_v6_s1_three_month_protected_scope_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"first_original_acwi_sell_enabled": false' fund100_v6_s1_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import audit_fund100_live_boundary as audit
          import fund100_v6_s1_three_month_prefunding_probe_v1_0 as source
          workflow = '.github/workflows/fund100-v6-s1-three-month-prefunding-source.yml'
          script = 'fund100_v6_s1_three_month_prefunding_probe_v1_0.py'
          assert len(source.REQUEST_PLAN) == 8
          assert source.REQUEST_PLAN[-1] == (
              '/v2/account/portfolio/history', {'period':'3M','timeframe':'1D'})
          assert audit.git_blob_digest(Path(script)) == '6a96266164af0fe84f5780cde90e2f0b85033eb6'
          assert audit.approved_scoped_live_script(
              workflow, script, Path(workflow).read_text())
          print('Eight GET source PINNED. Original STOP remains. No broker credentials.')
          PY

  protected-original-eight-get:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: source-integrity-and-scope
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revalidate reviewed exact source and immutable workflow scope
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          test "$FUND100_RISK_LEVEL" = 'HIGH'
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"first_original_acwi_sell_enabled": false' fund100_v6_s1_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import audit_fund100_live_boundary as audit
          workflow = '.github/workflows/fund100-v6-s1-three-month-prefunding-source.yml'
          script = 'fund100_v6_s1_three_month_prefunding_probe_v1_0.py'
          assert audit.git_blob_digest(Path(script)) == '6a96266164af0fe84f5780cde90e2f0b85033eb6'
          assert audit.approved_scoped_live_script(
              workflow, script, Path(workflow).read_text())
          print('Source-only main workflow qualifies for eight GET. All trading remains STOP.')
          PY
      - name: Install exact reviewed NYSE calendar prior to broker credentials
        # Same calendar versions as the dormant active original first-sale gate.
        # No broker or private Git credentials exist in this step.
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'pandas==2.3.3' 'exchange-calendars==4.13.2'
          python - <<'PY'
          import pandas, exchange_calendars
          assert pandas.__version__=='2.3.3'
          assert exchange_calendars.__version__=='4.13.2'
          PY
      - name: Read actual original account and 3M history (EIGHT GET ONLY)
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          python fund100_v6_s1_three_month_prefunding_probe_v1_0.py
      - name: Confirm no trading release
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'Historical source observation complete; original LIVE trade release still blocked.'
