name: Fund-100 Genuine V5 PAPER Parity (read-only)

on:
  push:
    branches: [main]
    paths:
      - "fund100_v5_genuine_paper_parity_v1_0.py"
      - "fund100_v5_compiler_attestation_v1_0.py"
      - "test_fund100_v5_compiler_attestation_v1_0.py"
      - "test_fund100_v5_genuine_paper_parity_v1_0.py"
      - ".github/workflows/fund100-v5-genuine-paper-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v5-genuine-paper-parity
  cancel-in-progress: true

jobs:
  nonexecuting-parity:
    name: Validate genuine compiler to PAPER plan with no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and run offline genuine-event parity suite
        run: |
          set -euo pipefail
          python -m py_compile \
            fund100_v5_genuine_paper_parity_v1_0.py \
            fund100_v5_compiler_attestation_v1_0.py \
            test_fund100_v5_compiler_attestation_v1_0.py \
            test_fund100_v5_genuine_paper_parity_v1_0.py
          python -m pytest -q \
            test_fund100_v5_genuine_paper_parity_v1_0.py \
            test_fund100_v5_compiler_attestation_v1_0.py \
            test_fund100_live_compiler_contract_v1_0.py \
            test_fund100_etf_paper_rehearsal_v1_0.py
      - name: Confirm no PAPER or LIVE credentials are configured
        run: |
          set -euo pipefail
          echo "Genuine-event PAPER parity: NO BROKER REQUESTS OR WRITES."
