name: Freeze Fund-100 Research Dataset v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-dataset:
    name: Freeze Research Dataset v2

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Freeze Research Dataset v2
        run: |
          set -euo pipefail
          python freeze_research_dataset_v2.py

      - name: Commit frozen dataset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-research-bot"
          git config user.email "fund100-research-bot@users.noreply.github.com"

          git add research_lab/frozen_history_v2.csv
          git add research_lab/frozen_history_v2_manifest.json

          git commit \
            -m "Freeze Fund-100 Research Dataset v2"

          git push origin HEAD:main
