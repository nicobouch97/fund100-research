name: Fund-100 V6-S1 Private Git State CAS Protocol (OFFLINE ONLY)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_private_git_cas_protocol_v1_0.py"
      - "test_fund100_v6_s1_private_git_cas_protocol_v1_0.py"
      - "research_lab/V6_S1_REMOTE_PRIVATE_GIT_CAS_PERSISTENCE_PRE_REG_2026_10_20.md"
      - ".github/workflows/fund100-v6-s1-private-git-cas-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-git-cas-synthetic-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline-only test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Competing Git file SHA commits, remote read-back, original order identities
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_private_git_cas_protocol_v1_0.py
          python -m pytest -q test_fund100_v6_s1_private_order_attempt_journal_v1_0.py
          python -m pytest -q test_fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py
      - name: Ensure current LIVE and remote writer remain hard-locked
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_private_git_cas_protocol_v1_0 as c
          assert not c.REMOTE_TRANSPORT_RELEASED
          assert not c.LIVE_ORDER_RELEASED
          text=Path(c.__file__).read_text()
          for bad in ('urlopen(', 'requests.put(',
                      'ALPACA_'+'LIVE_KEY','ALPACA_'+'LIVE_SECRET'):
            assert bad not in text
          print('Private state CAS protocol simulation only. Neither Git write nor broker access.')
          PY
