name: Fund-100 P4J Authentic Stock Source Vintage Diagnosis (NO TRADING)

on:
  pull_request:
    paths:
      - "fund100_stock_original_price_vintage_diff_p4j_v1_0.py"
      - "test_fund100_stock_original_price_vintage_diff_p4j_v1_0.py"
      - ".github/workflows/fund100-p4j-authentic-stock-source-vintage.yml"
      - "research_lab/stocks/P4J_ACTUAL_PRICE_SOURCE_DIFFERENCE_PROTOCOL_2026_10_21.md"
  push:
    branches: [main]
    paths:
      - "fund100_stock_original_price_vintage_diff_p4j_v1_0.py"
      - ".github/workflows/fund100-p4j-authentic-stock-source-vintage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authentic-vintage-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline historical source validators
        run: python -m pip install -r requirements.txt
      - name: Prove synthetic price differences cannot become false stock returns
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_stock_original_price_vintage_diff_p4j_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
      - name: Download only two original P4G same-repo source artifacts
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          mkdir -p /tmp/fund100-p4j-original /tmp/fund100-p4j-followup
          gh run download 39015519726 --repo "$GITHUB_REPOSITORY" \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4j-original
          gh run download 39571738927 --repo "$GITHUB_REPOSITORY" \
            --name fund100-p4g-prospective-stock-price-evidence \
            --dir /tmp/fund100-p4j-followup
          test -s /tmp/fund100-p4j-original/fund100-p4g-snapshot.json
          test -s /tmp/fund100-p4j-original/fund100-p4g-original-prices.csv
          test -s /tmp/fund100-p4j-followup/fund100-p4g-snapshot.json
          test -s /tmp/fund100-p4j-followup/fund100-p4g-original-prices.csv
      - name: Diagnose authenticated original historical price discrepancies
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          python fund100_stock_original_price_vintage_diff_p4j_v1_0.py \
            --original-json /tmp/fund100-p4j-original/fund100-p4g-snapshot.json \
            --original-csv /tmp/fund100-p4j-original/fund100-p4g-original-prices.csv \
            --later-json /tmp/fund100-p4j-followup/fund100-p4g-snapshot.json \
            --later-csv /tmp/fund100-p4j-followup/fund100-p4g-original-prices.csv \
            --output /tmp/fund100-p4j-vintage-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/fund100-p4j-vintage-summary.json').read_text())
          assert r['schema']=='FUND100_P4J_GENUINE_PRICE_VINTAGE_DIFF_V1'
          assert r['no_forward_return_calculated']
          assert not r['trading_authorized'] and r['broker_requests']==0
          assert r['live_orders']==r['paper_orders']==0
          assert not r['cause_of_difference_independently_proven']
          print('Authenticated first-seen source comparison only; no orders.')
          PY
      - name: Archive source-difference metadata, not vendor price series
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fund100-p4j-original-source-vintage-difference-summary
          path: /tmp/fund100-p4j-vintage-summary.json
          if-no-files-found: error
          retention-days: 30
