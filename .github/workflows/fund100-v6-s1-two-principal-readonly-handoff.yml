name: Fund-100 V6-S1 Source-Bound Broker then Private HMAC READ (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_two_principal_readonly_handoff_v1_0.py"
      - "fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0.py"
      - "test_fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0.py"
      - "test_fund100_v6_s1_two_principal_readonly_handoff_v1_0.py"
      - "fund100_v6_s1_owner_fence_private_getonly_v1_0.py"
      - "test_fund100_v6_s1_owner_fence_private_getonly_v1_0.py"
      - "research_lab/V6_S1_TWO_PRINCIPAL_LIVE_READONLY_SOURCE_HANDOFF_PROTOCOL_2026_10_22.md"
      - ".github/workflows/fund100-v6-s1-original-client-id-getonly.yml"
      - ".github/workflows/fund100-v6-s1-two-principal-readonly-handoff.yml"
  workflow_run:
    workflows:
      - "Fund-100 V6-S1 REAL LIVE Original Client-ID GET only (NO ORDERS)"
      - "Fund-100 V6-S1 LIVE Funding Timing and NONE History Seven GET (NO ORDERS)"
    types: [completed]
    # The upstream REAL broker reader must run on main. PR source jobs are
    # offline fixtures, not eligible brokerage readiness and should not
    # spawn another apparently green downstream run.
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: fund100-v6-s1-original-client-id-to-private-read-handoff
  cancel-in-progress: false

jobs:
  offline-source-run-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject forged stale incomplete skipped or PR-triggered broker provenance
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v6_s1_two_principal_readonly_handoff_v1_0.py test_fund100_v6_s1_owner_fence_private_getonly_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json

  protected-fresh-broker-then-independent-private-HMAC:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    needs: offline-source-run-contract
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The checker authenticates the actual original seven-GET step completion UTC,
      # not merely the mutable GitHub workflow run updated_at timestamp.
      - name: Authenticate current original broker source run jobs on main under 5 minutes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'nicobouch97/fund100-research'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_run'
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          test "$FUND100_RISK_LEVEL" = 'HIGH'
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/fund100-source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/fund100-source-jobs.json"
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import fund100_v6_s1_two_principal_readonly_handoff_v1_0 as h
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'fund100-source-run.json').read_text())
          jobs=json.loads((root/'fund100-source-jobs.json').read_text())
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r=h.verify_any_source(run=run,jobs=jobs,checked_main_sha=sha,
                     observed_at_utc=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
          assert not r['orders_authorized'] and r['real_broker_POSTs']==0
          print('Authentic SAME-MAIN seven-GET source completed with original redacted 404 gate; no order permission.')
          PY
      - name: Separately read original signed PRIVATE HEAD seq0 or ACWI seq1 without any broker key
        env:
          FUND100_PRIVATE_STATE_READ_TOKEN: ${{ secrets.FUND100_PRIVATE_STATE_READ_TOKEN }}
          FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX: ${{ secrets.FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          test "$FUND100_RISK_LEVEL" = 'HIGH'
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          test "$(git hash-object fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0.py)" = "96aeb01c23c7f4efbc8e0e9fd117e90a34ce8382"
          test "$(git hash-object fund100_v6_s1_private_git_cas_protocol_v1_0.py)" = "9b9f8917faa21b4157600ac642f80595445a7276"
          test "$(git hash-object research_lab/V6_S1_INITIAL_PUBLIC_LEDGER_GENESIS_WITNESS_2026_10_21.json)" = "b6fd44c4bb0b17bcd906e97c7ca8d6a50cc00a99"
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import fund100_v6_s1_two_principal_readonly_handoff_v1_0 as h
          import fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0 as r
          root=Path(os.environ['RUNNER_TEMP'])
          broker_run=json.loads((root/'fund100-source-run.json').read_text())
          broker_jobs=json.loads((root/'fund100-source-jobs.json').read_text())
          main_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          observed=r.recover_current_original_signed_head_readonly(
              public_comment_id='6321330005',
              bootstrap_run_id='39637082911',
              read_token=os.environ['FUND100_PRIVATE_STATE_READ_TOKEN'],
              hmac_hex=os.environ['FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX'],
              public_token=os.environ['GITHUB_TOKEN'])
          assert observed['private_ledger_sequence'] in (0,1)
          assert observed['private_genesis_HMAC_signature_and_original_account_binding_verified']
          assert observed['independent_public_issue8_comment_digest_and_identity_verified']
          assert observed['private_git_writes']==0 and observed['broker_orders']==0
          assert observed['independently_immutable_rollback_anchor_proven'] is False
          source=h.verify_any_source(run=broker_run,jobs=broker_jobs,
                   checked_main_sha=main_sha,
                   observed_at_utc=datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
          if source['status']=='CURRENT_RISK_SOURCE_STOP_READY_FOR_PRIVATE_HMAC_READ':
              if observed['private_ledger_sequence']==0:
                  joined=h.join_current_risk_and_signed_genesis(source=source,genesis=observed)
                  assert joined['status']=='STOPPED_REAL_RISK_AND_SIGNED_EMPTY_LEDGER_READS_JOINED'
              else:
                  joined=h.join_current_risk_and_signed_first_reservation(
                      source=source,reserved=observed)
                  assert joined['status']=='STOPPED_RISK_AND_FIRST_SIGNED_ACWI_RESERVATION_READS_JOINED'
                  print('Original signed ACWI sequence-1 head + public witness VERIFIED READ ONLY; no retry or order.')
              assert joined['orders_authorized'] is False
              assert joined['broker_POSTs']==joined['private_Git_PUTs']==0
              print('Source-verified postfunding 6/20/35 account risk passed: '+
                    str(joined['postfunding_account_6_20_35_read_evidence']))
              print('Original risk-to-signed-private-head join VERIFIED READ ONLY: LIVE RISK AND ORDER RELEASE BLOCKED.')
          else:
              # Original real LIVE client-ID source has three independently
              # queried 404s; these are NOT "never POSTed" assurance.
              joined=h.join_original_broker_client_ids_and_signed_first_reservation(
                  source=source,reserved=observed)
              assert joined['status']=='STOPPED_ORIGINAL_BROKER_404_AND_SIGNED_ACWI_SEQ1_READS_JOINED'
              assert joined['original_broker_seven_GET_3_client_ID_404s_verified']
              assert joined['original_signed_ACWI_seq1_reserved_no_retry_verified']
              assert joined['client_ID_404_proves_no_earlier_POST'] is False
              assert joined['orders_authorized'] is False
              assert joined['broker_POSTs']==joined['private_Git_PUTs']==0
              print('Original LIVE broker client IDs 3x404 + independently signed ACWI seq1: VERIFIED READ ONLY; 404 does NOT prove never POSTed.')
          # Only redacted signed/risk-verifier verdicts go to a runner-local
          # handoff for the next STEP (same protected job, no WRITE tokens).
          # This never stores real account/position values or private HMAC.
          safe={'source':source,'reserved':observed}
          assert source['orders_authorized'] is False
          assert observed['production_trade_order_submission_authorized'] is False
          assert all(v is None for v in (
              observed.get('private_raw_bytes'),
              observed.get('account_binding_or_account_id'),
              observed.get('hmac_key_or_signature'),
          ))
          (root/'fund100-s1-redacted-handoff.json').write_text(
              json.dumps(safe,sort_keys=True),encoding='utf-8')
          print('SUCCESS: current verified original broker seven-GET and separately protected HMAC private head read, within 5m.')
          print('No brokerage key available in private read; NO mutation token, trade, external immutable watermark or release.')
          PY
      - name: Observe original first ACWI owner fence through ONE private GET principal (NO WRITE)
        env:
          FUND100_PRIVATE_STATE_READ_TOKEN: ${{ secrets.FUND100_PRIVATE_STATE_READ_TOKEN }}
          FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX: ${{ secrets.FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$FUND100_BROKER_KILL_SWITCH" = "ENGAGED"
          test "$FUND100_RISK_LEVEL" = "HIGH"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          import os,json
          from pathlib import Path
          import fund100_v6_s1_owner_fence_private_getonly_v1_0 as h
          import fund100_v6_s1_two_principal_readonly_handoff_v1_0 as joined
          observed=h.read_current_original_acwi_owner_fence_getonly(
              read_token=os.environ["FUND100_PRIVATE_STATE_READ_TOKEN"],
              hmac_hex=os.environ["FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX"])
          assert observed["status"] in (
              "OWNER_FENCE_NOT_VISIBLE_TO_ORIGINAL_READ_PRINCIPAL",
              "SIGNED_UNCLAIMED_FIRST_ACWI_OWNER_FENCE_READONLY",
              "SIGNED_ALREADY_CLAIMED_FIRST_ACWI_OWNER_FENCE_HOLD")
          assert observed["write_principal_absence_independently_verified"] is False
          assert observed["owner_claim_or_broker_POST_authorized"] is False
          assert observed["real_private_Git_PUTs"] == observed["broker_orders"] == 0
          # Complete a THREE-source join, not just independent status logs.
          # Source and private reservation were verified by the preceding
          # successful step in this SAME protected job. No broker credentials
          # and no private WRITE principal are available to this step.
          safe=json.loads((Path(os.environ['RUNNER_TEMP'])/
              'fund100-s1-redacted-handoff.json').read_text(encoding='utf-8'))
          if safe['reserved']['private_ledger_sequence']==1:
              decision=joined.join_first_acwi_owner_and_protected_broker_readonly(
                  source=safe['source'],reserved=safe['reserved'],
                  owner_fence=observed)
              assert decision['status']=='STOPPED_FIRST_ACWI_THREE_SOURCE_JOIN_NO_ORDER_AUTHORITY'
              assert decision['owner_claim_or_broker_post_released'] is False
              assert decision['real_broker_POSTs']==decision['real_private_Git_PUTs']==0
              assert decision['external_immutable_head_anchor_verified'] is False
              print('Original first ACWI three-source readiness: '+
                    ','.join(decision['remaining_release_blockers']))
          else:
              assert safe['reserved']['private_ledger_sequence']==0
              print('Original private ledger still empty: ACWI execution HOLD.')
          print("Original first ACWI owner fence READ principal: "+observed["status"])
          print("Separate WRITE principal and immutable head NOT verified; STOP.")
          PY
      - name: Explicit no-order STOP
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'Source-bound cross-principal READ ONLY. Current trade release DISABLED.'

  # An upstream workflow_run can finish green from PR-only OFFLINE fixtures
  # while the protected account/private HMAC job was intentionally SKIPPED.
  # For a *qualifying* main-branch source, failure or skip of that protected
  # job must make this entire handoff workflow RED, never apparent success.
  # This reporter has zero secrets, broker access or private Git write rights.
  source-bound-protected-verdict:
    if: always() && github.event_name == 'workflow_run'
    needs:
      - offline-source-run-contract
      - protected-fresh-broker-then-independent-private-HMAC
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Distinguish PR-only source checks from real protected HMAC readiness
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          OFFLINE_RESULT: ${{ needs.offline-source-run-contract.result }}
          PROTECTED_RESULT: ${{ needs.protected-fresh-broker-then-independent-private-HMAC.result }}
        run: |
          set -euo pipefail
          test "$OFFLINE_RESULT" = "success"
          if [[ "$UPSTREAM_EVENT" == "pull_request" ]]; then
            test "$PROTECTED_RESULT" = "skipped"
            echo 'PR_ONLY_OFFLINE_SOURCE: protected LIVE/private HMAC job NOT RUN; NOT a live-readiness PASS.'
          elif [[ "$UPSTREAM_BRANCH" == "main" && "$UPSTREAM_CONCLUSION" == "success" ]]; then
            test "$PROTECTED_RESULT" = "success"
            echo 'ELIGIBLE_MAIN_SOURCE: protected authenticated broker+HMAC job actually completed; NO ORDERS.'
          else
            test "$PROTECTED_RESULT" = "skipped"
            echo 'INELIGIBLE_SOURCE: broker/private source was NOT authenticated; no trading authority.'
          fi
