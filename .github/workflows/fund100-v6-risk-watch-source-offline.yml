name: Fund-100 V6-S1 Independent Risk Watch Source Mocks (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'test_fund100_v6_s1_independent_risk_watch_v1_0.py'
      - '.github/workflows/fund100-v6-risk-watch-source-offline.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'test_fund100_v6_s1_independent_risk_watch_v1_0.py'
      - '.github/workflows/fund100-v6-risk-watch-source-offline.yml'

permissions:
  contents: read

jobs:
  mock-source-hard-lock-and-risk-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V6 watcher source remains hard locked (credentialless mocks only)
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9' 'pandas==2.3.3' 'exchange-calendars==4.13.2'
          python -m pytest -q test_fund100_v6_s1_independent_risk_watch_v1_0.py
          grep -Fq 'SCHEDULED_RUNTIME_RELEASED = False' fund100_v6_s1_independent_risk_watch_v1_0.py
          test ! -e .github/workflows/fund100-v6-s1-independent-risk-watch.yml
