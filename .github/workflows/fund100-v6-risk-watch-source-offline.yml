name: Fund-100 V6-S1 Independent Risk Watch Source Mocks (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'test_fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'fund100_v6_risk_receipt_signer_locked_v1_0.py'
      - 'test_fund100_v6_risk_receipt_signer_locked_v1_0.py'
      - 'fund100_v6_github_oidc_reader_identity_locked_v1_0.py'
      - 'test_fund100_v6_github_oidc_reader_identity_locked_v1_0.py'
      - '.github/workflows/fund100-v6-risk-watch-source-offline.yml'
      - '.github/workflows/fund100-v6-s1-independent-risk-watch.yml'
      - 'test_fund100_v6_s1_scheduled_stop_preflight_v1_0.py'
  push:
    branches: [main]
    paths:
      - 'fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'test_fund100_v6_s1_independent_risk_watch_v1_0.py'
      - 'fund100_v6_risk_receipt_signer_locked_v1_0.py'
      - 'test_fund100_v6_risk_receipt_signer_locked_v1_0.py'
      - 'fund100_v6_github_oidc_reader_identity_locked_v1_0.py'
      - 'test_fund100_v6_github_oidc_reader_identity_locked_v1_0.py'
      - '.github/workflows/fund100-v6-risk-watch-source-offline.yml'
      - '.github/workflows/fund100-v6-s1-independent-risk-watch.yml'
      - 'test_fund100_v6_s1_scheduled_stop_preflight_v1_0.py'

permissions:
  contents: read

jobs:
  mock-source-hard-lock-and-risk-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V6 watcher source remains hard locked (credentialless mocks only)
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9' 'pandas==2.3.3' 'exchange-calendars==4.13.2' 'cryptography>=45,<47'
          python -m pytest -q test_fund100_v6_s1_independent_risk_watch_v1_0.py test_fund100_v6_risk_receipt_signer_locked_v1_0.py test_fund100_v6_github_oidc_reader_identity_locked_v1_0.py
          grep -Fq 'SIGNER_SOURCE_RELEASED = False' fund100_v6_risk_receipt_signer_locked_v1_0.py
          grep -Fq 'OIDC_IDENTITY_SOURCE_RELEASED = False' fund100_v6_github_oidc_reader_identity_locked_v1_0.py
          grep -Fq 'NO_8GET_PROOF_FROM_JWT = True' fund100_v6_github_oidc_reader_identity_locked_v1_0.py
          grep -Fq 'NO_RISK_SIGNING_KEY = True' fund100_v6_github_oidc_reader_identity_locked_v1_0.py
          grep -Fq 'EXPECTED_SIGNER_PUBLIC_KEY_HEX = None' fund100_v6_risk_receipt_signer_locked_v1_0.py
          grep -Fq 'SCHEDULED_RUNTIME_RELEASED = False' fund100_v6_s1_independent_risk_watch_v1_0.py
          grep -Fq 'def _capture_private_eight_get_witness() -> dict | str:' fund100_v6_s1_independent_risk_watch_v1_0.py
          grep -Fq 'MAX_BROKER_SNAPSHOT_SECONDS = receipt_contract.MAX_BROKER_SNAPSHOT_SECONDS' fund100_v6_s1_independent_risk_watch_v1_0.py
          grep -Fq 'MAX_RISK_EVALUATION_SECONDS = receipt_contract.MAX_SIGN_DELAY_SECONDS' fund100_v6_s1_independent_risk_watch_v1_0.py
          ! grep -Fq 'sign_reviewed_eight_get_result(' fund100_v6_s1_independent_risk_watch_v1_0.py
          test -f .github/workflows/fund100-v6-s1-independent-risk-watch.yml
          grep -Fq 'NO_BROKER_NO_RISK_PASS' .github/workflows/fund100-v6-s1-independent-risk-watch.yml
          grep -Fq 'contents: read' .github/workflows/fund100-v6-s1-independent-risk-watch.yml
          grep -Fq 'stopped-preflight:' .github/workflows/fund100-v6-s1-independent-risk-watch.yml
          ! grep -Eq 'ALPACA_API_KEY|ALPACA_SECRET|risk-watch-broker-check|risk-watch-pass-attestation' .github/workflows/fund100-v6-s1-independent-risk-watch.yml
