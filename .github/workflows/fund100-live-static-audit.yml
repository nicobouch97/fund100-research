name: Fund-100 LIVE Static Safety Audit

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_alpaca_paper_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_alpaca_paper_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

  pull_request:
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_alpaca_paper_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_alpaca_paper_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

permissions:
  contents: read

concurrency:
  group: fund100-live-static-safety-audit
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ENGAGED

jobs:
  audit:
    name: Audit LIVE Boundary Through v1.18
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify broker kill switch remains engaged
        run: |
          set -euo pipefail

          if [ "${FUND100_BROKER_KILL_SWITCH}" != "ENGAGED" ]; then
            echo "STOP: broker kill switch is not ENGAGED."
            exit 1
          fi

          echo "FUND100_BROKER_KILL_SWITCH = ENGAGED"

      - name: Run full test suite
        run: |
          set -euo pipefail
          pytest -q

      - name: Re-run Static Audit v1.17 baseline
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_17.py

      - name: Run Static Audit v1.18
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_18.py

      - name: Final locked-state summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 LIVE STATIC AUDIT COMPLETE"
          echo "========================================"
          echo "Static audit safety layer: v1.18"
          echo "Release Lock v1.8 prerequisite: PRESERVED"
          echo "Writer candidate v1.1: HARD LOCKED"
          echo "Execution orchestrator v1.0: PURE / OFFLINE"
          echo "Fresh broker reconstruction before materialization: VERIFIED"
          echo "Complete authorized-ID reconstruction before cap: VERIFIED"
          echo "Cumulative-cap guard before writer: VERIFIED"
          echo "Orchestrator rehearsal workflow credentials: NONE"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Orchestrator released: FALSE"
          echo "Current live writer connected: FALSE"
          echo "Orders submitted: 0"
