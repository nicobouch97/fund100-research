name: Fund-100 LIVE Static Safety Audit

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_alpaca_paper_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_alpaca_paper_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

  pull_request:
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_alpaca_paper_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_alpaca_paper_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

permissions:
  contents: read

concurrency:
  group: fund100-live-static-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: Prove LIVE Boundary Remains Non-Writing

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify v1.17 audit inputs
        run: |
          set -euo pipefail

          test -f audit_fund100_live_boundary_v1_15.py
          test -f audit_fund100_live_boundary_v1_16.py
          test -f audit_fund100_live_boundary_v1_17.py

          test -f fund100_alpaca_live_writer_candidate_v1_1.py

          test -f \
            fund100_alpaca_live_cumulative_cap_guard_v1_0.py

          test -f \
            test_fund100_alpaca_live_cumulative_cap_guard_v1_0.py

          test -f \
            fund100_alpaca_live_cumulative_cap_rehearsal_v1_0.py

          test -f \
            test_fund100_alpaca_live_cumulative_cap_rehearsal_v1_0.py

          test -f \
            .github/workflows/fund100-live-cumulative-cap-rehearsal.yml

          echo "LIVE static-audit v1.17 dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run offline LIVE boundary audit v1.17
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_17.py

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE STATIC AUDIT COMPLETE"
          echo "========================================"
          echo "Static audit safety layer: v1.17"
          echo "Writer candidate v1.1: HARD LOCKED"
          echo "Status-semantics hardening: VERIFIED"
          echo "Cumulative-cap guard: PURE / OFFLINE"
          echo "Cumulative-cap rehearsal: OFFLINE ONLY"
          echo "Rehearsal direct network client: NONE"
          echo "Rehearsal broker credentials: NONE"
          echo "SELL/restart/BUY scenario: PRESENT"
          echo "Over-cap-before-writer scenario: PRESENT"
          echo "Lost-response reconstruction scenario: PRESENT"
          echo "Partial-fill accounting scenario: PRESENT"
          echo "Terminal-history blocking scenario: PRESENT"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Current live writer connected: FALSE"
          echo "Orders submitted: 0"
