name: Fund-100 LIVE Static Safety Audit

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

  pull_request:
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "test_fund100_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

permissions:
  contents: read

concurrency:
  group: fund100-live-static-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: Prove LIVE Boundary Remains Non-Writing

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify v1.13 audit inputs
        run: |
          set -euo pipefail

          test -f audit_fund100_live_boundary_v1_11.py
          test -f audit_fund100_live_boundary_v1_12.py
          test -f audit_fund100_live_boundary_v1_13.py

          test -f fund100_alpaca_live_execution_materializer.py
          test -f fund100_alpaca_live_writer_candidate_v1_0.py

          test -f fund100_alpaca_live_preconnect_runtime_check.py
          test -f test_fund100_alpaca_live_preconnect_runtime_check.py

          test -f \
            .github/workflows/fund100-alpaca-live-preconnect-runtime-check.yml

          echo "LIVE static-audit v1.13 dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run offline LIVE boundary audit v1.13
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_13.py

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE STATIC AUDIT COMPLETE"
          echo "========================================"
          echo "Static audit safety layer: v1.13"
          echo "Execution materializer: VERIFIED"
          echo "Connected-writer candidate: HARD LOCKED"
          echo "Offline transport rehearsal: VERIFIED"
          echo "Pre-connect runtime checker: GET ONLY"
          echo "Pre-connect candidate import: NONE"
          echo "Pre-connect HTTP mutation capability: NONE"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Current live writer connected: FALSE"
          echo "Orders submitted: 0"
