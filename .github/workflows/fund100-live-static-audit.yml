name: Fund-100 LIVE Static Safety Audit

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

  pull_request:
    paths:
      - "fund100_alpaca_live_*.py"
      - "fund100_broker_safety.py"
      - "test_fund100_alpaca_live_*.py"
      - "audit_fund100_live_boundary*.py"
      - ".github/workflows/**"
      - "live_dryrun_outputs/v5_002/**"
      - "live_activation_outputs/v5_002/**"

permissions:
  contents: read

concurrency:
  group: fund100-live-static-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: Prove LIVE Boundary Remains Non-Writing

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify audit files
        run: |
          set -euo pipefail

          test -f audit_fund100_live_boundary.py
          test -f audit_fund100_live_boundary_v1_4.py
          test -f audit_fund100_live_boundary_v1_5.py
          test -f audit_fund100_live_boundary_v1_6.py
          test -f audit_fund100_live_boundary_v1_7.py

          test -f fund100_alpaca_live_writer_disconnected_v1_1.py
          test -f fund100_alpaca_live_position_reconcile.py
          test -f fund100_alpaca_live_manifest_v1_1.py
          test -f fund100_alpaca_live_intent_validator_v1_1.py
          test -f fund100_alpaca_live_permit_v2_issuer.py

          test -f test_fund100_alpaca_live_position_reconcile.py
          test -f test_fund100_alpaca_live_manifest_v1_1.py
          test -f test_fund100_alpaca_live_intent_validator_v1_1.py

          echo "LIVE static-audit dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Run offline LIVE boundary audit v1.7
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_7.py

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE STATIC AUDIT COMPLETE"
          echo "========================================"
          echo "Static audit safety layer: v1.7"
          echo "Frozen V5 execution universe: VERIFIED"
          echo "Position-aware reconciliation: VERIFIED"
          echo "Position-aware manifest: VERIFIED"
          echo "Position-aware intents: VERIFIED"
          echo "Live credentials supplied: NO"
          echo "Broker network access: NONE"
          echo "Live writer connected: FALSE"
          echo "Orders submitted: 0"
