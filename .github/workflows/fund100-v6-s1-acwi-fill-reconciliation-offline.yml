name: Fund-100 V6-S1 Offline ACWI Fill Reconciliation
on:
  pull_request:
    paths:
      - "fund100_v6_s1_original_acwi_fill_flat_offline_v1_0.py"
      - "test_fund100_v6_s1_original_acwi_fill_flat_offline_v1_0.py"
      - "fund100_v6_s1_original_acwi_broker_fill_flat_getonly_bridge_v1_0.py"
      - "test_fund100_v6_s1_original_acwi_broker_fill_flat_getonly_bridge_v1_0.py"
      - ".github/workflows/fund100-v6-s1-acwi-fill-reconciliation-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-offline-fill-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-linked sell, fill and flat position scenarios
        run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v6_s1_original_acwi_fill_flat_offline_v1_0.py test_fund100_v6_s1_original_acwi_broker_fill_flat_getonly_bridge_v1_0.py
