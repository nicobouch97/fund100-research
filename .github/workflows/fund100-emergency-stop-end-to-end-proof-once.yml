# Retired one-time STOP-only integration trigger. The original source-locked
# dispatcher remains archived for credentialless negative/offline tests.
# This workflow has NO push trigger, Actions:write, broker credentials,
# workflow_dispatch, or operational STOP dispatch job.
# Production emergency STOP remains solely in the protected main operator
# emergency workflow. No orders may be started or rearmed here.
name: Fund-100 One-Shot Actual Emergency STOP Evidence (SAFE STOP ONLY)

on:
  pull_request:
    paths:
      - ".github/workflows/fund100-emergency-stop-end-to-end-proof-once.yml"
      - "fund100_emergency_stop_e2e_dispatch_once_v1_0.py"
      - "test_fund100_emergency_stop_e2e_dispatch_once_v1_0.py"

permissions:
  contents: read

concurrency:
  group: fund100-one-time-actual-emergency-stop-e2e
  cancel-in-progress: false

jobs:
  credentialless-stop-dispatch-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test only fixed STOP workflow is dispatchable (MOCK, no broker)
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
          python -m pytest -q test_fund100_emergency_stop_e2e_dispatch_once_v1_0.py

