name: Fund-100 V6-S1 Offline Transition Stage Review (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_transition_staging_v1_0.py"
      - "test_fund100_v6_s1_transition_staging_v1_0.py"
      - "research_lab/V6_S1_BROKERLESS_TRANSITION_STAGING_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-offline-transition-stages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-transition-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline pytest only
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify no broker clients, credentials, or trading exits
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('fund100_v6_s1_transition_staging_v1_0.py').read_text()
          assert 'def review(' in p
          for forbidden in ('requests.', 'urllib.', 'httpx.', 'paper_request(', 'live_request(', 'place_order(', 'ALPACA_LIVE_KEY', 'ALPACA_PAPER_KEY'):
              assert forbidden not in p, forbidden
          PY
      - name: Run synthetic S1 settlement and STOP stage tests
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_transition_staging_v1_0.py
      - name: No LIVE release
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo "Offline review only. No live broker calls, orders, activation or sales."
