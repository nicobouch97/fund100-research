name: Fund-100 V6-S1 SELL Fill-to-Private-CAS Recovery (OFFLINE)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_sell_fill_flat_cas_recovery_v1_0.py"
      - "test_fund100_v6_s1_sell_fill_flat_cas_recovery_v1_0.py"
      - "research_lab/V6_S1_SELL_FULL_FILL_FLAT_PRIVATE_CAS_RECOVERY_PRE_REG_2026_10_21.md"
      - ".github/workflows/fund100-v6-s1-sell-complete-cas-recovery-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-sell-completion-and-persistent-git-cas-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Test V6 original BUY receipts, future SELL, CAS concurrency and recovery
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_sell_fill_flat_cas_recovery_v1_0.py
          python -m pytest -q test_fund100_v6_s1_private_git_cas_protocol_v1_0.py
          python -m pytest -q test_fund100_v6_s1_actual_live_original_buy_receipt_fill_six_get_v1_0.py
          python -m pytest -q test_fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py
      - name: No auth tokens/broker API or LIVE order release
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_sell_fill_flat_cas_recovery_v1_0 as s
          import fund100_v6_s1_private_git_cas_protocol_v1_0 as cas
          assert not s.TRANSPORT_RELEASED
          assert not s.LIVE_SELL_BUY_AUTHORIZED
          assert not cas.REMOTE_TRANSPORT_RELEASED
          assert not cas.LIVE_ORDER_RELEASED
          assert s.MODE=="INVENTED_ACCOUNT_ORDER_FILL_FIXTURES_ONLY"
          code=Path(s.__file__).read_text()
          for x in ('urlopen(', 'method="POST"', 'method="PUT"','requests.post(', 'requests.put('):
              assert x not in code
          print("Signed CAS state completion synthetic only. Private repo access and orders untouched.")
          PY
