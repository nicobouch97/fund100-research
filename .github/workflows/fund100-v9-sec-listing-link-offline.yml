name: Fund-100 V9 Nasdaq/SEC Current Issuer Link Offline CI (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v9_sec_current_listing_association_v1_0.py"
      - "test_fund100_v9_sec_current_listing_association_v1_0.py"
      - ".github/workflows/fund100-v9-sec-listing-link-offline.yml"
      - ".github/workflows/fund100-v9-sec-listing-link-capture.yml"
      - "research_lab/stocks/V9_CURRENT_NASDAQ_SEC_ASSOCIATION_AUDIT_2026_11_10.md"
  push:
    branches: [main]
    paths:
      - "fund100_v9_sec_current_listing_association_v1_0.py"
      - "test_fund100_v9_sec_current_listing_association_v1_0.py"
      - ".github/workflows/fund100-v9-sec-listing-link-offline.yml"
      - ".github/workflows/fund100-v9-sec-listing-link-capture.yml"
      - "research_lab/stocks/V9_CURRENT_NASDAQ_SEC_ASSOCIATION_AUDIT_2026_11_10.md"

permissions:
  contents: read

jobs:
  research-only-cross-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install no-network tests and existing SEC admission dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9' 'pandas==2.3.3'
      - name: Test original listing and SEC source validation; no broker, orders or CIK disclosure
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v9_official_current_listing_discovery_v1_0.py test_fund100_v9_sec_current_listing_association_v1_0.py
          python - <<'PY'
          import fund100_v9_sec_current_listing_association_v1_0 as m
          assert m.LIVE_AUTHORIZED is False
          assert m.NO_BROKER_READS == m.NO_BROKER_ORDERS == m.NO_PRIVATE_STATE_WRITES == 0
          assert m.SEC_URL == 'https://www.sec.gov/files/company_tickers_exchange.json'
          PY
