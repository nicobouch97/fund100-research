name: Fund-100 Alpaca LIVE Read Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fund100-alpaca-live-readonly.yml'

permissions:
  contents: read

concurrency:
  group: fund100-alpaca-live-readonly
  cancel-in-progress: false

jobs:
  live-readonly:
    name: Inspect Alpaca LIVE Account Read Only
    if: ${{ github.repository == 'nicobouch97/fund100-research' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    environment: fund100-live-broker
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out reviewed main without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify main workflow, exact checkout and reviewed GET-only source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'nicobouch97/fund100-research'
          test "$GITHUB_REF" = 'refs/heads/main'
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$GITHUB_WORKFLOW_REF" = 'nicobouch97/fund100-research/.github/workflows/fund100-alpaca-live-readonly.yml@refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object fund100_alpaca_live_readonly_smoke.py)" = 'a8cf058595a960d67055a63e65f574530f7074c8'
          test "$(git hash-object fund100_broker_safety.py)" = '871908c2027f1f5c8917f3138f95f1b1fea73816'
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("fund100_live_operator_control.json").read_text())
          b = json.loads(Path("fund100_v6_s1_operator_control.json").read_text())
          if (a.get("schema") != "FUND100_OPERATOR_CONTROL_V1"
              or a.get("trading_enabled") is not False
              or b.get("schema") != "FUND100_V6_S1_OPERATOR_CONTROL_V2"
              or b.get("trading_enabled") is not False
              or b.get("first_original_acwi_sell_enabled") is not False):
              raise SystemExit("Fund-100 operator STOP not verified")
          PY
          echo 'Trusted main GET-only broker smoke source verified; no secret used.'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        run: |
          set -euo pipefail

          test -f fund100_alpaca_live_readonly_smoke.py
          test -f fund100_broker_safety.py

          echo "LIVE read-only dependencies found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Inspect LIVE Alpaca account
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
          FUND100_LIVE_WRITE_MODE: DISABLED

        run: |
          set -euo pipefail
          # Invoke the exact-pinned GET-only source so static credential
          # auditors can attribute LIVE secrets to a reviewed script.
          # Never emit provider error bodies or Python tracebacks.
          if ! python fund100_alpaca_live_readonly_smoke.py 2>/dev/null; then
            echo 'LIVE direct-key GET-only check failed; no broker mutation' >&2
            exit 1
          fi

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE READ-ONLY CHECK COMPLETE"
          echo "========================================"
          echo "GET requests only"
          echo "Orders submitted: 0"
          echo "Broker modifications: 0"
