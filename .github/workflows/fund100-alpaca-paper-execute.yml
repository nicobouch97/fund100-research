name: Fund-100 Alpaca Paper Execute

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-alpaca-paper-execution
  cancel-in-progress: false

jobs:
  paper-execute:
    name: Execute V5-002 Paper Portfolio

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required files
        run: |
          set -euo pipefail

          test -f fund100_broker_safety.py
          test -f fund100_alpaca_paper_execute_guarded.py
          test -f fund100_alpaca_paper_execute_bootstrap.py
          test -f fund100_alpaca_paper_reconcile.py
          test -f shadow_outputs/v5_002/shadow_state.json

          echo "Guarded paper execution dependencies found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Execute guarded Alpaca PAPER workflow
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}

          FUND100_ENABLE_PAPER_ORDERS: YES_PAPER_ONLY

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

        run: |
          set -euo pipefail
          python fund100_alpaca_paper_execute_guarded.py
