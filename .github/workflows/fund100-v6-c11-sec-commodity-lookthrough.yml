name: Fund-100 V6 C11 SEC Commodity Futures Look-through (OFFLINE)

on:
  pull_request:
    paths:
      - "fund100_v6_c11_dbc_sec_futures_lookthrough_v1_0.py"
      - "test_fund100_v6_c11_dbc_sec_futures_lookthrough_v1_0.py"
      - "research_lab/commodities/V6_C11_SEC_FILING_DBC_LOOKTHROUGH_PROTOCOL_2026_10_21.md"
      - ".github/workflows/fund100-v6-c11-sec-commodity-lookthrough.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asof-filing-original-28-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Check genuine research CSV SHA / filing vintage / concentration / STOP
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_c11_dbc_sec_futures_lookthrough_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
      - name: Produce 21 Oct research source look-through only
        run: |
          set -euo pipefail
          python fund100_v6_c11_dbc_sec_futures_lookthrough_v1_0.py \
            --decision-date 2026-10-21 \
            --hypothetical-dbc-fraction 0.15 \
            > /tmp/fund100-c11-sec-dbc-available-lookthrough.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fund100-c11-sec-dbc-available-lookthrough.json").read_text())
          assert r["chosen_statement_date"] == "2026-06-30"
          assert r["earliest_permissible_use_date"] == "2026-08-10"
          assert not r["usable_as_LIVE_allocator_risk_factor_weights"]
          assert not r["new_trade_authorized"]
          assert r["broker_request_count"] == r["paper_orders"] == r["live_orders"] == 0
          print("Original SEC source dated as-of only; no LIVE approval.")
          PY
      - name: Archive source-provenance research result (no market feed)
        uses: actions/upload-artifact@v4
        with:
          name: fund100-v6-c11-dbc-sec-futures-notional-lookthrough
          path: /tmp/fund100-c11-sec-dbc-available-lookthrough.json
          retention-days: 60
