name: Fund-100 V6-S1 Completed PAPER Proof (OFFLINE REGRESSION ONLY)

# The genuine one-time paper round trip already PASSED in run 39269640353.
# The annual cron caused a second, blocked rehearsal on 2026-10-19.
# Never automatically submit or re-submit another paper order.
on:
  pull_request:
    paths:
      - "fund100_v6_s1_one_time_paper_fill_probe_v1_0.py"
      - "test_fund100_v6_s1_one_time_paper_fill_probe_v1_0.py"
      - "research_lab/V6_S1_2USD_PAPER_ORDER_MECHANICS_PROTOCOL_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-paper-fill-once.yml"

permissions:
  contents: read

jobs:
  archived-one-time-proof-offline-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline regression runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify original one-time fractional PAPER implementation without broker requests
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_one_time_paper_fill_probe_v1_0.py
          python -m pytest -q test_fund100_v6_s1_concentrated_risk_and_paper_asset_v1_0.py
      - name: One-time PAPER credentials and broker orders are permanently absent from this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          flow=Path(".github/workflows/fund100-v6-s1-paper-fill-once.yml").read_text()
          lines=flow.splitlines()
          assert not any(line.strip().startswith('schedule:') for line in lines)
          assert not any(line.strip().startswith('workflow_dispatch:') for line in lines)
          key_name='ALPACA_'+'PAPER_KEY:'
          secret_name='ALPACA_'+'PAPER_SECRET:'
          assert not any(line.strip().startswith((key_name,secret_name)) for line in lines)
          full_probe='python '+'fund100_v6_s1_one_time_paper_fill_probe_v1_0.py'
          assert not any(line.strip().startswith(full_probe) for line in lines)
          print("One-time PAPER execution retired; archived tests ONLY. ZERO broker orders.")
          PY
