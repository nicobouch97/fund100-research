name: Fund-100 V6-S1 T+1 Settlement Evidence Gate (OFFLINE ONLY)

on:
  pull_request:
    paths:
      - "research_lab/V6_S1_PRIVATE_SETTLED_PROCEEDS_RECONCILIATION_PRE_REG_2026_10_20.md"
      - "fund100_v6_s1_settled_sale_cash_source_gate_v1_0.py"
      - "test_fund100_v6_s1_settled_sale_cash_source_gate_v1_0.py"
      - ".github/workflows/fund100-v6-s1-settlement-evidence-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-broker-tplusone-settlement-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only offline regression dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Test original fractional sells, cash/settlement source, high-risk envelope
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_settled_sale_cash_source_gate_v1_0.py
          python -m pytest -q test_fund100_v6_s1_independent_high_exante_policy_v1_0.py
          python -m pytest -q test_fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py
      - name: Assert no secret broker transport or LIVE order release
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_settled_sale_cash_source_gate_v1_0 as gate
          assert not gate.RELEASE_LIVE_BUY
          assert gate.MODE=='INVENTED_SETTLEMENT_AND_ACCOUNT_FIXTURES_ONLY'
          s=Path(gate.__file__).read_text()
          assert 'urlopen(' not in s and 'method="POST"' not in s
          print("V6 settlement source fixture ONLY. No broker data/credentials or orders.")
          PY
