name: Fund-100 V6 S1 Monthly Original HMAC Journal Bridge (OFFLINE)
on:
  pull_request:
    paths:
      - "fund100_v6_s1_monthly_signed_event_bridge_offline_v1_0.py"
      - "test_fund100_v6_s1_monthly_signed_event_bridge_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-monthly-signed-event-bridge-offline.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v6_s1_monthly_signed_event_bridge_offline_v1_0.py"
      - "test_fund100_v6_s1_monthly_signed_event_bridge_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-monthly-signed-event-bridge-offline.yml"
permissions:
  contents: read
jobs:
  existing-recurring-journal-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original recurring HMAC bridge and monthly safety regressions, no broker
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_s1_monthly_signed_event_bridge_offline_v1_0.py \
            test_fund100_v6_s1_recurring_rebalance_core_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          grep -Eq '"first_original_acwi_sell_enabled": false' fund100_v6_s1_operator_control.json
          echo 'EXISTING recurring HMAC journal reused; no real order, private write, or release.'
