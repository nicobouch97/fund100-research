name: Fund-100 Alpaca Paper Restart Recovery v1.1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-alpaca-paper-restart-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover Interrupted Paper Event

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify recovery files
        run: |
          set -euo pipefail

          test -f fund100_alpaca_paper_restart_resume_v1_1.py
          test -f fund100_alpaca_paper_restart_rehearsal.py
          test -f fund100_alpaca_paper_twosided_rehearsal.py
          test -f fund100_alpaca_paper_execute_bootstrap.py
          test -f fund100_alpaca_paper_reconcile.py
          test -f fund100_broker_safety.py

          echo "Recovery dependencies found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Resume interrupted PAPER event
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_ENABLE_RESTART_REHEARSAL: YES_PAPER_RESTART_TEST

        run: |
          set -euo pipefail
          python fund100_alpaca_paper_restart_resume_v1_1.py
