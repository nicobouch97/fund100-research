name: Fund-100 V7 U8 Rolling SEC100 Two-Close Source Cohorts (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v7_u8_sec100_rolling_forward_v1_0.py'
      - 'test_fund100_v7_u8_sec100_rolling_forward_v1_0.py'
      - '.github/workflows/fund100-v7-u8-sec100-rolling-forward.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_v7_u8_sec100_rolling_forward_v1_0.py'
      - 'test_fund100_v7_u8_sec100_rolling_forward_v1_0.py'
      - '.github/workflows/fund100-v7-u8-sec100-rolling-forward.yml'
  schedule:
    - cron: '11 3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fund100-v7-u8-rolling-sec100-research-only
  cancel-in-progress: false

jobs:
  offline-rolling-cohort-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rolling replay, no survivor selection, no broker
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q \
            test_fund100_v7_u8_sec100_rolling_forward_v1_0.py \
            test_fund100_v7_u7_sec100_two_close_costed_mark_v1_0.py \
            test_fund100_v7_u6_sec100_causal_forward_admission_v1_0.py \
            test_fund100_v7_u5_original_sec100_postbaseline_delta_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          import fund100_v7_u8_sec100_rolling_forward_v1_0 as x
          assert x.BROKER_GETS == x.BROKER_POSTS == x.BROKER_ORDERS == 0
          assert x.TRADING_AUTHORIZED is False and x.MAX_ARCHIVES == 20
          PY

  original-rolling-source-cohorts-and-later-marks:
    needs: offline-rolling-cohort-regressions
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      GH_TOKEN: ${{ github.token }}
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original SEC and market research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify main STOP and authenticated original SEC100 baseline
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          mkdir -p /tmp/u8-first-u3 /tmp/u8-first-u4 /tmp/u8-sec-observers
          for spec in \
            "40545345749:fund100-v7-u3-dated-issuer-mirror-sec100.yml" \
            "40550119246:fund100-v7-u4-first-sec100-baseline.yml"; do
            run="${spec%%:*}"
            workflow="${spec#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > "/tmp/u8-original-run-$run.json"
            RUN="$run" EXPECTED_WORKFLOW="$workflow" python - <<'PY'
          import json, os
          from pathlib import Path
          doc = json.loads(Path('/tmp/u8-original-run-' + os.environ['RUN'] + '.json').read_text())
          assert doc['status'] == 'completed' and doc['conclusion'] == 'success'
          assert doc['head_branch'] == 'main' and doc['path'].endswith('/' + os.environ['EXPECTED_WORKFLOW'])
          assert doc['event'] in ('push', 'schedule', 'workflow_dispatch')
          PY
          done
          gh run download 40545345749 --repo "$GITHUB_REPOSITORY" \
            -n fund100-v7-u3-first-dated-mirror-sec100-40545345749 -D /tmp/u8-first-u3
          gh run download 40550119246 --repo "$GITHUB_REPOSITORY" \
            -n fund100-v7-u4-first-100-sec-original-baseline-40550119246 -D /tmp/u8-first-u4
      - name: Select bounded consecutive successful original U5 source archives
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fund100-v7-u5-original-sec100-watch.yml/runs?branch=main&status=success&per_page=100" > /tmp/u8-u5-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/u8-u5-runs.json').read_text())
          runs=[r for r in doc['workflow_runs']
                if r['head_branch']=='main'
                and r['status']=='completed' and r['conclusion']=='success'
                and r['event'] in ('push','schedule','workflow_dispatch')
                and r['path'].endswith('/fund100-v7-u5-original-sec100-watch.yml')]
          runs.sort(key=lambda r:(r['created_at'],r['id']))
          if len(runs)<2:
              raise SystemExit('HOLD: fewer than two verified SEC100 original observer archives')
          # Bounded last twelve source receipts, not a complete historical census.
          selected=runs[-12:]
          if any(a['id']>=b['id'] for a,b in zip(selected,selected[1:])):
              raise SystemExit('HOLD: SEC100 source run IDs not chronological')
          observations=[{'run_id':r['id'],
                         'path':f"/tmp/u8-sec-observers/{r['id']}"} for r in selected]
          Path('/tmp/u8-observations.json').write_text(json.dumps(observations))
          print('Consecutive main U5 source archives to replay:',len(observations))
          PY
          for id in $(python -c 'import json; print(" ".join(str(r["run_id"]) for r in json.load(open("/tmp/u8-observations.json"))))'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "/tmp/u8-verified-run-$id.json"
            RUN="$id" python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('/tmp/u8-verified-run-'+os.environ['RUN']+'.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_branch']=='main'
          assert r['path'].endswith('/fund100-v7-u5-original-sec100-watch.yml')
          assert r['event'] in ('push','schedule','workflow_dispatch')
          PY
            mkdir -p "/tmp/u8-sec-observers/$id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" \
              -n "fund100-v7-u5-100issuer-original-delta-$id" \
              -D "/tmp/u8-sec-observers/$id"
          done
      - name: Replay every adjacent SEC source pair before independent market prices
        run: |
          set -euo pipefail
          python fund100_v7_u8_sec100_rolling_forward_v1_0.py \
            --original-u3 /tmp/u8-first-u3 \
            --original-first-sec /tmp/u8-first-u4 \
            --observations-json /tmp/u8-observations.json \
            --output-dir /tmp/u8-original-rolling-marks
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/u8-original-rolling-marks/rolling-original-sec100-cohort-marks.json').read_text())
          assert r['archived_observer_pairs']>0
          assert r['all_source_pairs_in_window_evaluated_without_success_filter'] is True
          assert r['source_relative_distinct_exposures']==r['priced_two_close_exposures']+r['pending_two_close_exposures']
          assert r['statistically_proven_alpha'] is False
          assert r['broker_gets']==r['broker_posts']==r['broker_orders']==0
          assert r['trading_authorized'] is False and r['live_authorized'] is False
          PY
      - name: Archive frozen rosters and original revisable price vintage
        uses: actions/upload-artifact@v4
        with:
          name: fund100-v7-u8-rolling-sec100-source-marks-${{ github.run_id }}
          path: /tmp/u8-original-rolling-marks/
          retention-days: 90
          if-no-files-found: error
