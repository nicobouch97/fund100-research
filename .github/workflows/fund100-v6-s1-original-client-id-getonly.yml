name: Fund-100 V6-S1 REAL LIVE Original Client-ID GET only (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_live_original_client_ids_getonly_v1_0.py"
      - "test_fund100_v6_s1_live_original_client_ids_getonly_v1_0.py"
      - "test_fund100_v6_s1_live_client_id_pin_scope_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - "research_lab/V6_S1_AUTHENTIC_LIVE_ORIGINAL_CLIENT_IDS_SOURCE_PROTOCOL_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-original-client-id-getonly.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-v6-s1-original-client-id-getonly.yml"
      - "research_lab/V6_S1_AUTHENTIC_LIVE_ORIGINAL_CLIENT_IDS_SOURCE_PROTOCOL_2026_10_19.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-s1-original-live-client-ids-getonly
  cancel-in-progress: false

jobs:
  original-safety-and-credential-boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner only
        run: python -m pip install 'pytest>=8,<9'
      - name: Original broker-ID, unknown POST, 404 and exact pin tests
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_live_original_client_ids_getonly_v1_0.py
          python -m pytest -q test_fund100_v6_s1_live_client_id_pin_scope_v1_0.py
          python -m pytest -q test_fund100_v6_real_live_getonly_transition_readiness_v1_0.py
      - name: Inspect no new broker HTTP writer or public finance output
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import fund100_v6_s1_live_original_client_ids_getonly_v1_0 as q
          assert not q.LIVE_ORDER_TRANSPORT_RELEASED
          assert q.FIRST_FOUR==('/v2/account','/v2/positions','/v2/orders','/v2/clock')
          assert q.ORDER_ID_PATH=='/v2/orders:by_client_order_id'
          s=Path(q.__file__).read_text()
          for blocked in ('urlopen(', 'method="POST"', 'requests.post(',
                          'submit_'+'authorized_order_batch('):
            assert blocked not in s, blocked
          print('Original V6 S1 LIVE client IDs READ ONLY, ZERO order authority.')
          PY

  genuine-private-live-client-id-read:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: original-safety-and-credential-boundary-tests
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact original Git blob pins and protected read-only approval
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import audit_fund100_live_boundary as a
          flow='.github/workflows/fund100-v6-s1-original-client-id-getonly.yml'
          script='fund100_v6_s1_live_original_client_ids_getonly_v1_0.py'
          assert a.approved_scoped_live_script(flow,script,Path(flow).read_text())
          print('Exact source-pinned main-only LIVE READ credential scope PASS.')
          PY
      - name: Query three genuine original V6 migration client IDs (NO ORDER POST)
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          # The original pinned reader prints ONLY redacted categorical facts.
          # A successful run now attests not just a completed GET but also that
          # no deterministic original V6 client ID was seen in these GETs.
          redacted_file="$RUNNER_TEMP/fund100-v6-s1-redacted-client-ids.txt"
          python fund100_v6_s1_live_original_client_ids_getonly_v1_0.py | tee "$redacted_file"
          grep -Fxq 'original_account_binding_and_all_four_quantities_matched: True' "$redacted_file"
          grep -Fxq 'original_held_xle_preserved: True' "$redacted_file"
          grep -Fxq 'open_orders_at_first_four_gets: 0' "$redacted_file"
          grep -Fxq 'original_three_client_ids_observed: 0' "$redacted_file"
          grep -Fxq 'original_three_client_ids_not_found_404: 3' "$redacted_file"
          grep -Fxq 'migration_broker_order_status: NO_MATCHING_V6_IDS_OBSERVED_NOT_NEVER_POST_PROOF' "$redacted_file"
          grep -Fxq 'broker_get_requests: 7' "$redacted_file"
          grep -Fxq 'broker_non_get_requests: 0' "$redacted_file"
          grep -Fxq 'broker_orders_submitted: 0' "$redacted_file"
          grep -Fxq 'real_order_submission_authorized: False' "$redacted_file"
          rm -f "$redacted_file"
          echo 'All seven authentic read-only source statuses match required preflight; 404 NEVER implies an order permit.'
      - name: Preserve original funded account STOP after source read
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'LIVE client-ID source checked. Zero orders; no production journal anchor.'
