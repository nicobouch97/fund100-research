name: Fund-100 LIVE Launch Status (offline, non-executable)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fund100_launch_readiness_snapshot_v1_0.py"
      - "test_fund100_launch_readiness_snapshot_v1_0.py"
      - "fund100_v6_launch_critical_path_v1_0.py"
      - "test_fund100_v6_launch_critical_path_v1_0.py"
      - "fund100_v6_s1_*.py"
      - "fund100_v6_recurring_*.py"
      - "fund100_alpaca_live_writer_candidate_v1_1.py"
      - "fund100_live_operator_control.json"
      - "fund100_v6_s1_operator_control.json"
      - ".github/workflows/fund100-v6-s1-original-first-acwi-funded-once.yml"
      - ".github/workflows/fund100-v6-s1-first-xlk-buy-funded-once.yml"
      - ".github/workflows/fund100-live-launch-status-offline.yml"
  push:
    branches: [main]
    paths:
      - "fund100_launch_readiness_snapshot_v1_0.py"
      - "test_fund100_launch_readiness_snapshot_v1_0.py"
      - "fund100_v6_launch_critical_path_v1_0.py"
      - "test_fund100_v6_launch_critical_path_v1_0.py"
      - "fund100_v6_s1_*.py"
      - "fund100_v6_recurring_*.py"
      - "fund100_alpaca_live_writer_candidate_v1_1.py"
      - "fund100_live_operator_control.json"
      - "fund100_v6_s1_operator_control.json"
      - ".github/workflows/fund100-v6-s1-original-first-acwi-funded-once.yml"
      - ".github/workflows/fund100-v6-s1-first-xlk-buy-funded-once.yml"
      - ".github/workflows/fund100-live-launch-status-offline.yml"

permissions:
  contents: read

jobs:
  summary:
    name: Evidence-based status, zero broker access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test fail-closed readiness assessment
        run: python -m pytest -q test_fund100_launch_readiness_snapshot_v1_0.py test_fund100_v6_launch_critical_path_v1_0.py
      - name: Produce advisory report, no broker credentials
        run: |
          set -euo pipefail
          python fund100_launch_readiness_snapshot_v1_0.py > launch_readiness_snapshot.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("launch_readiness_snapshot.json").read_text())
          assert report["schema"] == "FUND100_NON_EXECUTABLE_LAUNCH_SNAPSHOT_V1"
          assert report["live_order_authorized"] is False
          assert report["paper_order_authorized"] is False
          assert report["broker_network_access"] == "NONE"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("### Fund-100 launch readiness (informational only)\n")
              file.write("Status: **" + report["status"] + "**\n\n")
              file.write("No broker connection or order authority in this workflow.\n")
              file.write("Outstanding items: " + ", ".join(report["blockers"]) + "\n")
          PY
      - name: Produce V6 critical-path report, code-only and no broker
        run: |
          set -euo pipefail
          python fund100_v6_launch_critical_path_v1_0.py > v6_launch_critical_path.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r=json.loads(Path("v6_launch_critical_path.json").read_text())
          assert r["schema"] == "FUND100_V6_OFFLINE_LIVE_CRITICAL_PATH_V1"
          assert r["live_order_authorized"] is False
          assert r["broker_requests"] == r["private_git_requests"] == 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n### V6 launch critical path (offline only)\n")
              for name, stage in r["stages"].items():
                  f.write("- " + name + ": **" + stage["code_status"] + "** (")
                  f.write(str(len(stage["locked_flags"])) + " locks)\n")
              f.write("\nActual broker/private head/immutable/kill state: **unverified**.\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fund100-non-executable-launch-snapshot
          path: |
            launch_readiness_snapshot.json
            v6_launch_critical_path.json
          retention-days: 14
