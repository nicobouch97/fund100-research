name: Fund-100 C3E DBC SEC Five-Disclosure Timeline (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_dbc_holdings_chronology_c3e_v1_0.py"
      - "test_fund100_dbc_holdings_chronology_c3e_v1_0.py"
      - "research_lab/commodities/dbc_sec_futures_holdings_2025_q2_prechange.csv"
      - "research_lab/commodities/dbc_sec_futures_holdings_2025_q4_postchange.csv"
      - ".github/workflows/fund100-dbc-c3e-sec-chronology.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-dbc-c3e-sec-chronology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filing-safe-timeline:
    name: SEC DBC Q2/Q3/Q4 2025 and Q1/Q2 2026 research chronology
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No broker credentials, no data-licensing costs, no market order APIs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate all five real public SEC holdings schedules and no-lookahead
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_dbc_holdings_chronology_c3e_v1_0.py test_fund100_dbc_index_break_c3d_v1_0.py test_fund100_dbc_sec_holdings_c3c_v1_0.py
      - name: Generate sector and public-known-date report without any trading
        run: |
          set -euo pipefail
          python fund100_dbc_holdings_chronology_c3e_v1_0.py --output-json /tmp/fund100-dbc-c3e-five-snapshots.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("/tmp/fund100-dbc-c3e-five-snapshots.json").read_text())
          assert x["status"] == "OFFICIAL_SEC_HOLDINGS_HISTORY_NOT_TRADE_READY"
          assert x["count_snapshots"] == 5
          assert x["count_actual_reported_open_futures_lines"] == 112
          assert x["lookahead_safe_asof_examples"]["2025-08-07"] is None
          assert x["lookahead_safe_asof_examples"]["2026-03-02"] == "2025-09-30"
          assert x["lookahead_safe_asof_examples"]["2026-03-03"] == "2025-12-31"
          assert x["backtest_eligible"] is False
          assert x["live_authorized"] is False and x["paper_authorized"] is False
          assert x["broker_order_count"] == 0
          print("SEC filing-dated exposure chronology only, no tradable carry or broker access.")
          PY
      - name: Preserve reproducible research report only
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-c3e-dbc-five-filing-snapshots-${{ github.run_id }}
          path: /tmp/fund100-dbc-c3e-five-snapshots.json
          retention-days: 90
          if-no-files-found: error
