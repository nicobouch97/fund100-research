name: Fund-100 V7 X7 Flow-Neutral Benchmark (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0.py'
      - 'test_fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0.py'
      - '.github/workflows/fund100-v7-x7-flow-neutral-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0.py'
      - 'test_fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0.py'
      - '.github/workflows/fund100-v7-x7-flow-neutral-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-flow-and-benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Fund flows are not returns; no real broker
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python -m pytest -q test_fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0.py
          python - <<'PY'
          import fund100_v7_x7_flow_neutral_strategy_benchmark_v1_0 as m
          assert m.BROKER_GETS == m.BROKER_POSTS == m.BROKER_ORDERS == 0
          assert not m.LIVE_EXECUTION_ENABLED
          assert m.LIVE_PILOT_PRINCIPAL_CEILING_USD == '130.30'
          PY
