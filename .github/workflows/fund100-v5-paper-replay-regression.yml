name: Fund-100 PAPER Replay & Native Runner Regression

on:
  push:
    branches: [main]
    paths:
      - "fund100_v5_paper_broker_adapter_v1_0.py"
      - "fund100_v5_paper_native_runner_v1_0.py"
      - "fund100_v5_paper_execution_bridge_v1_0.py"
      - "test_fund100_v5_paper_broker_adapter_v1_0.py"
      - "test_fund100_v5_paper_native_runner_v1_0.py"
      - "test_fund100_v5_paper_execution_bridge_v1_0.py"
      - ".github/workflows/fund100-v5-paper-replay-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v5-paper-replay-regression
  cancel-in-progress: true

jobs:
  verify-no-replay:
    name: Test genuine signal, accepted-order replay and PAPER-only broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Offline execution regression without any broker credentials
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_v5_paper_native_runner_v1_0.py \
            test_fund100_v5_paper_broker_adapter_v1_0.py \
            test_fund100_v5_paper_execution_bridge_v1_0.py \
            test_fund100_v5_paper_native_compiler_v1_0.py
