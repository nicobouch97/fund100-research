name: Fund-100 V6 Immutable Signed Genesis V2 Draft Finish Regression (RETIRED)

# Run 40894337592 successfully published immutable release 427978301 with
# exact original signed seq0 HMAC and asset SHA256. Original CREATE and
# original PATCH are BOTH RETIRED; no main push, dispatch, schedules,
# protected credentials, release mutations, private state writes or broker.
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-v6-recurring-immutable-genesis-v2-draft-finish-once.yml"
      - "fund100_v6_recurring_immutable_genesis_v2_draft_finish_once_v1_0.py"
      - "test_fund100_v6_recurring_immutable_genesis_v2_draft_finish_once_v1_0.py"

permissions:
  contents: read

jobs:
  offline-signed-draft-recovery-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve fake-only original draft/PATCH tests under immutable HOLD
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q             test_fund100_v6_recurring_immutable_genesis_v2_draft_finish_once_v1_0.py             test_fund100_v6_recurring_immutable_genesis_v2_once_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
