name: Fund-100 V6 Signed Genesis V2 Release Regression (RETIRED CREATOR)

# Protected main run 40892690151 actually created original draft 427978301
# and uploaded asset 688837795, so this v2 creator is permanently RETIRED.
# Only the separate exact-draft recovery workflow can verify/publish it.
# No main push, dispatch, schedule, secrets, release POST or broker authority.
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-v6-recurring-immutable-genesis-v2-once.yml"
      - "fund100_v6_recurring_immutable_genesis_v2_once_v1_0.py"
      - "test_fund100_v6_recurring_immutable_genesis_v2_once_v1_0.py"

permissions:
  contents: read

jobs:
  credentialless-original-v2-create-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve signed fake-only v2 create tests; no protected mutation
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v6_recurring_immutable_genesis_v2_once_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
