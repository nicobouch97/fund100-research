name: Fund-100 V9 Original Broad SEC Annual Quality Source Coverage (NO BROKER)

# A bounded original current 32-CIK SEC financial COVERAGE diagnostic, NOT
# historical alpha, security-class qualification or a trade-eligible universe.
# Once after merge, then one weekly Saturday research capture only.
on:
  push:
    branches: [main]
    paths:
      - "fund100_v9_broad_original_sec_quality_coverage_v1_0.py"
      - "test_fund100_v9_broad_original_sec_quality_coverage_v1_0.py"
      - "fund100_v9_f2_original_finance_ratio_source_v1_0.py"
      - "test_fund100_v9_f2_original_finance_ratio_source_v1_0.py"
      - ".github/workflows/fund100-v9-broad-sec-coverage-offline.yml"
      - ".github/workflows/fund100-v9-broad-sec-coverage-capture.yml"
      - "research_lab/stocks/V9_ORIGINAL_BROAD_SEC_FINANCIAL_COVERAGE_PILOT_2026_11_10.md"
  schedule:
    - cron: "20 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v9-broad-original-sec-coverage-research
  cancel-in-progress: false

jobs:
  original-current-sec-issuer-sample:
    if: github.repository == 'nicobouch97/fund100-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original SEC research and offline regression dependencies
        run: python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9' 'pandas==2.3.3'
      - name: Enforce STOP and run offline source integrity tests
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FUND100_BROKER_KILL_SWITCH" = ENGAGED
          test "$FUND100_LIVE_WRITE_MODE" = DISABLED
          python -m pytest -q \
            test_fund100_v9_official_current_listing_discovery_v1_0.py \
            test_fund100_v9_sec_current_listing_association_v1_0.py \
            test_fund100_v9_broad_original_sec_quality_coverage_v1_0.py \
            test_fund100_v9_f2_original_finance_ratio_source_v1_0.py
      - name: Fetch original broad prospectively selected SEC source coverage only
        env:
          SEC_USER_AGENT: ${{ secrets.FUND100_SEC_USER_AGENT }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          python -B fund100_v9_broad_original_sec_quality_coverage_v1_0.py \
            --out "$OUT_DIR/v9-broad-sec-annual-coverage.json"
      - name: Retain redacted category totals and source hashes for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: v9-broad-sec-annual-source-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-broad-sec-annual-coverage.json
          if-no-files-found: error
          retention-days: 30
