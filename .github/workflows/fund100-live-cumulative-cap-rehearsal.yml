name: Fund-100 LIVE Cumulative Cap/Restart Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-live-cumulative-cap-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Rehearse Cumulative Permit Cap Across Restarts

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify cumulative-cap rehearsal inputs
        run: |
          set -euo pipefail

          test -f fund100_alpaca_live_writer_candidate_v1_1.py

          test -f fund100_alpaca_live_cumulative_cap_guard_v1_0.py

          test -f \
            test_fund100_alpaca_live_cumulative_cap_guard_v1_0.py

          test -f \
            fund100_alpaca_live_writer_status_rehearsal_v1_0.py

          test -f \
            fund100_alpaca_live_cumulative_cap_rehearsal_v1_0.py

          test -f \
            test_fund100_alpaca_live_cumulative_cap_rehearsal_v1_0.py

          test -f audit_fund100_live_boundary_v1_17.py

          test -f \
            release_outputs/v5_002/pre_live_release_lock.json

          echo "Cumulative-cap rehearsal inputs found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run LIVE static safety audit v1.17
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_17.py

      - name: Run completely offline cumulative-cap rehearsal
        run: |
          set -euo pipefail
          python fund100_alpaca_live_cumulative_cap_rehearsal_v1_0.py

      - name: Verify safe cumulative-cap rehearsal artifact
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          path = (
              "live_dryrun_outputs/v5_002/"
              "live_cumulative_cap_rehearsal_v1_0.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package[
              "cumulative_cap_rehearsal"
          ]

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == package[
                  "cumulative_cap_rehearsal_sha256"
              ]
          )

          assert (
              body["schema"]
              == "FUND100_LIVE_CUMULATIVE_CAP_REHEARSAL_V1"
          )

          assert (
              body["mode"]
              == "COMPLETELY_OFFLINE_FAKE_BROKER"
          )

          assert (
              body["source_release_lock_builder_version"]
              == "1.7"
          )

          assert (
              body["writer_candidate_version"]
              == "1.1"
          )

          assert (
              body["cumulative_cap_guard_version"]
              == "1.0"
          )

          assert (
              body["permit_cap_usd"]
              == 100.0
          )

          assert (
              body["real_alpaca_credentials_supplied"]
              is False
          )

          assert (
              body["real_broker_network_access"]
              is False
          )

          assert (
              body["real_broker_get_requests"]
              == 0
          )

          assert (
              body["real_broker_post_requests"]
              == 0
          )

          assert (
              body["orders_submitted_to_alpaca"]
              == 0
          )

          assert (
              body["fake_broker_only"]
              is True
          )

          assert (
              body["writer_candidate_transport_released"]
              is False
          )

          assert (
              body["writer_candidate_public_execution_enabled"]
              is False
          )

          assert (
              body[
                  "complete_authorized_id_reconstruction_verified"
              ]
              is True
          )

          assert (
              body["sell_restart_buy_exact_cap_verified"]
              is True
          )

          assert (
              body["sell_phase_projected_usd"]
              == 60.0
          )

          assert (
              body["restart_consumed_before_buy_usd"]
              == 60.0
          )

          assert (
              body["buy_phase_new_usd"]
              == 40.0
          )

          assert (
              body["exact_cap_projected_final_usd"]
              == 100.0
          )

          assert (
              body["exact_cap_remaining_after_buy_usd"]
              == 0.0
          )

          assert (
              body["restart_replay_new_gross_usd"]
              == 0.0
          )

          assert (
              body["restart_replay_new_posts"]
              == 0
          )

          assert (
              body["over_cap_blocked_before_writer"]
              is True
          )

          assert (
              body["over_cap_attempted_projected_usd"]
              == 100.01
          )

          assert (
              body["over_cap_writer_posts"]
              == 0
          )

          assert (
              body["lost_response_recovery_verified"]
              is True
          )

          assert (
              body["lost_response_initial_fake_posts"]
              == 1
          )

          assert (
              body["lost_response_restart_consumed_usd"]
              == 60.0
          )

          assert (
              body["lost_response_restart_new_gross_usd"]
              == 0.0
          )

          assert (
              body["lost_response_restart_new_posts"]
              == 0
          )

          assert (
              body[
                  "partial_fill_full_original_notional_consumed"
              ]
              is True
          )

          assert (
              body["partial_fill_consumed_usd"]
              == 60.0
          )

          assert (
              body["terminal_failure_history_statuses"]
              == [
                  "canceled",
                  "expired",
                  "rejected",
              ]
          )

          assert (
              body["terminal_failure_history_consumed_usd"]
              == 60.0
          )

          assert (
              body["terminal_failure_continuation_blocked"]
              is True
          )

          assert (
              body["terminal_failure_writer_posts"]
              == 0
          )

          assert (
              body["unsafe_history_continuation_blocked"]
              is True
          )

          assert (
              body["incomplete_lookup_fails_closed"]
              is True
          )

          assert (
              body["historical_over_cap_fails_closed"]
              is True
          )

          assert (
              body[
                  "single_permit_ceiling_across_phases_verified"
              ]
              is True
          )

          assert (
              body[
                  "restart_reconstruction_from_broker_verified"
              ]
              is True
          )

          assert (
              body["previous_client_id_not_double_counted"]
              is True
          )

          assert (
              body["previous_client_id_not_resubmitted"]
              is True
          )

          assert (
              body["cumulative_cap_rehearsal_passed"]
              is True
          )

          assert (
              body["cumulative_cap_hardening_tested"]
              is True
          )

          assert (
              body[
                  "cumulative_cap_hardening_release_lock_completed"
              ]
              is False
          )

          assert (
              body["live_execution_authorized"]
              is False
          )

          assert (
              body["permit_issued"]
              is False
          )

          assert (
              float(
                  body["max_live_execution_notional_usd"]
              )
              == 0.0
          )

          assert (
              body["network_write_capability"]
              is False
          )

          assert (
              body["writer_connected"]
              is False
          )

          print("Cumulative-cap rehearsal SHA256: PASS")
          print("SELL/restart/BUY exact-cap accounting: PASS")
          print("Over-cap before-writer rejection: PASS")
          print("Lost-response broker reconstruction: PASS")
          print("Restart double-count prevention: PASS")
          print("Restart duplicate POST prevention: PASS")
          print("Partial-fill full-notional accounting: PASS")
          print("Failed-terminal history retention: PASS")
          print("Failed-terminal continuation: BLOCKED")
          print("Unsafe history continuation: BLOCKED")
          print("Incomplete reconstruction: BLOCKED")
          print("Historical over-cap state: BLOCKED")
          print("Real broker network access: NONE")
          print("Orders submitted to Alpaca: 0")
          PY

      - name: Verify only rehearsal artifact changed
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. live_dryrun_outputs/v5_002/live_cumulative_cap_rehearsal_v1_0\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then
            echo "Unexpected working-tree changes:"
            echo "$EXTRA"
            git status --short
            exit 1
          fi

          echo "Only expected cumulative-cap artifact changed."

      - name: Check rehearsal artifact changes
        id: rehearsal_check
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              live_dryrun_outputs/v5_002/live_cumulative_cap_rehearsal_v1_0.json
          )"

          if [ -z "$CHANGES" ]; then
            echo "Cumulative-cap artifact unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Cumulative-cap artifact changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit safe cumulative-cap rehearsal artifact
        if: steps.rehearsal_check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-cap-rehearsal-bot"

          git config \
            user.email \
            "fund100-cap-rehearsal-bot@users.noreply.github.com"

          git add \
            live_dryrun_outputs/v5_002/live_cumulative_cap_rehearsal_v1_0.json

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Record V5-002 cumulative cap rehearsal"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected dirty working tree."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 CUMULATIVE CAP REHEARSAL COMPLETE"
          echo "========================================"
          echo "Release lock v1.7: VERIFIED"
          echo "Writer candidate v1.1: VERIFIED"
          echo "Cumulative-cap guard v1.0: VERIFIED"
          echo "Mode: COMPLETELY OFFLINE"
          echo "SELL -> restart -> BUY cumulative accounting: PASS"
          echo "Exact permit ceiling: PASS"
          echo "Over-cap phase: BLOCKED BEFORE WRITER"
          echo "Lost-response restart reconstruction: PASS"
          echo "Restart double-count prevention: PASS"
          echo "Restart duplicate POST prevention: PASS"
          echo "Partial-fill full-notional accounting: PASS"
          echo "Failed-terminal historical notional retained: PASS"
          echo "Failed-terminal continuation: BLOCKED"
          echo "Unsafe historical continuation: BLOCKED"
          echo "Incomplete broker reconstruction: BLOCKED"
          echo "Historical over-cap state: BLOCKED"
          echo "Real Alpaca credentials supplied: NO"
          echo "Real broker network access: NONE"
          echo "Candidate transport released: FALSE"
          echo "Candidate public execution enabled: FALSE"
          echo "Cumulative-cap hardening tested: YES"
          echo "Cumulative-cap release lock completed: NO"
          echo "Live execution authorized: FALSE"
          echo "Permit issued: FALSE"
          echo 'Maximum LIVE execution notional: $0.00'
          echo "Writer connected: FALSE"
          echo "Orders submitted to Alpaca: 0"
