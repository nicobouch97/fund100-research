name: Fund-100 Unified V5/V6 Emergency STOP Mock Tests (NO BROKER)
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-live-emergency-stop.yml"
      - "fund100_v6_s1_first_acwi_signed_cancel_only_v1_0.py"
      - "fund100_live_emergency_stop_v1_0.py"
      - "test_fund100_live_emergency_stop_no_redirect_v1_0.py"
      - "test_fund100_v6_s1_first_acwi_signed_cancel_only_v1_0.py"
      - "test_fund100_v6_s1_unified_emergency_stop_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - ".github/workflows/fund100-unified-stop-offline.yml"
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/fund100-live-emergency-stop.yml"
      - "fund100_v6_s1_first_acwi_signed_cancel_only_v1_0.py"
      - "fund100_live_emergency_stop_v1_0.py"
      - "test_fund100_live_emergency_stop_no_redirect_v1_0.py"
      - "test_fund100_v6_s1_first_acwi_signed_cancel_only_v1_0.py"
      - "test_fund100_v6_s1_unified_emergency_stop_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - ".github/workflows/fund100-unified-stop-offline.yml"

permissions:
  contents: read
concurrency:
  group: fund100-unified-stop-credentialless-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-stop:
    name: Mock exact signed V6 ACWI order STOP and V5 unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install credentialless test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'pytest==8.4.2'
      - name: Test no-network emergency STOP contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_v6_s1_first_acwi_signed_cancel_only_v1_0.py \
            test_fund100_v6_s1_unified_emergency_stop_v1_0.py \
            test_fund100_live_emergency_stop_v1_0.py \
            test_fund100_live_emergency_stop_no_redirect_v1_0.py
