name: Fund-100 V7 E2 Event Forward-Only Evidence (NO BROKER)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fund100_v7_e2_event_forward_return_v1_0.py'
      - 'test_fund100_v7_e2_event_forward_return_v1_0.py'
      - '.github/workflows/fund100-v7-e2-event-forward-only.yml'
permissions:
  contents: read
jobs:
  synthetic-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q test_fund100_v7_e2_event_forward_return_v1_0.py
      - run: |
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
