name: Fund-100 V8 Q2 First New-Vintage SEC ROA + Completed Prices (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py"
      - "test_fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py"
      - ".github/workflows/fund100-v8-q2-first-new-sec-price-source.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py"
      - "test_fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py"
      - ".github/workflows/fund100-v8-q2-first-new-sec-price-source.yml"
  schedule:
    - cron: "17 7 30,31 10 *"
    - cron: "17 7 1-6 11 *"

permissions:
  contents: read

concurrency:
  group: fund100-v8-q2-first-future-sec-original-readonly
  cancel-in-progress: false

jobs:
  source-causality-and-no-broker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source timing, same-10K annual income, issuer drift and locked research status
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q test_fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json

  acquire-first-post-registration-original-sec-roa-and-adjusted-price:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: source-causality-and-no-broker-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SEC_USER_AGENT: ${{ secrets.FUND100_SEC_USER_AGENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One first original research source only, without private writes
        id: first
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          test "$GITHUB_REF" = "refs/heads/main"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          utc="$(date -u +%Y%m%d)"
          if [[ "$utc" < "20261030" || "$utc" > "20261106" ]]; then
            echo "Outside future Q2 first-source capture window; no source request."
            echo "acquire=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fund100-v8-q2-new-original-first&per_page=25" \
            > /tmp/q2-existing-first-archive.json
          if jq -e '.artifacts[] | select(.expired == false and .name == "fund100-v8-q2-new-original-first")' \
            /tmp/q2-existing-first-archive.json >/dev/null; then
            echo "Existing first original research archive detected; no duplicate first."
            echo "acquire=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "acquire=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.first.outputs.acquire == 'true'
        with:
          python-version: "3.12"
      - name: Install existing public research dependencies
        if: steps.first.outputs.acquire == 'true'
        run: python -m pip install -r requirements.txt
      - name: Acquire actual official SEC and completed market price sources (GET only)
        if: steps.first.outputs.acquire == 'true'
        run: |
          set -euo pipefail
          python -B fund100_v8_q2_first_actual_sec_roa_price_source_v1_0.py \
            --output-dir "/tmp/fund100-v8-q2-original-$GITHUB_RUN_ID"
      - name: Archive first actual original SEC/price bytes before any future marks
        if: steps.first.outputs.acquire == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-v8-q2-new-original-first
          path: /tmp/fund100-v8-q2-original-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
      - name: No broker or live strategy release
        if: steps.first.outputs.acquire == 'true'
        run: |
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          echo 'Research-only. No broker, private journal, signature, release, or live order.'
