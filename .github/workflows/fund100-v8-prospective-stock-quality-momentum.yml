name: Fund-100 V8 Prospective US Stock Quality Momentum (RESEARCH ONLY)

# Frozen first next-vintage stock factor rule.
# No SEC/price/Alpaca network access or broker credentials in this job.
on:
  pull_request:
    paths:
      - "fund100_v8_prospective_stock_profitability_momentum_v1_0.py"
      - "test_fund100_v8_prospective_stock_profitability_momentum_v1_0.py"
      - ".github/workflows/fund100-v8-prospective-stock-quality-momentum.yml"

permissions:
  contents: read

jobs:
  predeclared-prospective-source-and-factor-rule-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test untouched future vintage rank, lookahead rejection and no orders
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v8_prospective_stock_profitability_momentum_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
