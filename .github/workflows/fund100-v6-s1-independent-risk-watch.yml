name: Fund-100 V6-S1 Independent First ACWI Risk Watch (NO TRADE)

# STAGE 1: genuine, credentialless STOP-only schedule probe.
# This DOES NOT run live brokerage risk or attest a PASS. GitHub schedule is
# best-effort, so a missing/late run must never be considered safe.
on:
  schedule:
    - cron: "11,26,41,56 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-s1-stopped-preflight
  cancel-in-progress: false

jobs:
  stopped-preflight:
    name: V6 stopped-state schedule check (NO BROKER, NO PASS)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read reviewed main branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify current V5/V6 operator STOP without broker access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import fund100_live_operator_control_v1_0 as v5
          import fund100_v6_s1_operator_control_v2_0 as v6

          # This preflight is deliberately incapable of checking LIVE broker
          # risk or writing operator control. If either source is unavailable,
          # the job fails; no PASS attestation step or trade permit exists.
          if v5.validate_control(v5.read_current_control()) is not False:
              raise SystemExit("V5_STOP_UNVERIFIED")
          status = v6.read_current_control()
          if (status["trading_enabled"] is not False
              or status["first_original_acwi_sell_enabled"] is not False):
              raise SystemExit("V6_ACTIVE_REQUIRES_UNRELEASED_BROKER_WATCH_HOLD")
          print("V6_SCHEDULE_HEARTBEAT: OPERATOR_STOPPED_NO_BROKER_NO_RISK_PASS")
          PY

  stop-on-unverified-controls:
    name: Request existing emergency STOP after unverified V6 controls
    needs: stopped-preflight
    if: ${{ always() && needs.stopped-preflight.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # ISOLATED: can request an existing emergency workflow, but cannot edit
    # repository contents or access Alpaca. No checkout or third-party actions.
    # Actions:write permits OTHER workflow dispatches too; this job executes
    # only the fixed audited endpoint and contains no arbitrary caller input.
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
    steps:
      - name: Request existing main emergency STOP (ACK is NOT STOP confirmation)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          REPO = "nicobouch97/fund100-research"
          WATCH_REF = (
              REPO + "/.github/workflows/"
              "fund100-v6-s1-independent-risk-watch.yml@refs/heads/main")
          URL = (
              "https://api.github.com/repos/" + REPO
              + "/actions/workflows/fund100-live-emergency-stop.yml/dispatches")
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError("STOP dispatch redirection forbidden")
          if (os.environ.get("GITHUB_ACTIONS") != "true"
              or os.environ.get("GITHUB_REPOSITORY") != REPO
              or os.environ.get("GITHUB_REF") != "refs/heads/main"
              or os.environ.get("GITHUB_EVENT_NAME") not in
                  ("schedule", "workflow_dispatch")
              or os.environ.get("GITHUB_WORKFLOW_REF") != WATCH_REF
              or os.environ.get("GITHUB_RUN_ATTEMPT") != "1"
              or re.fullmatch(r"[0-9a-f]{40}",
                              os.environ.get("GITHUB_SHA","")) is None):
              raise SystemExit("STOP_DISPATCH_SCOPE_INVALID")
          token = os.environ.get("GITHUB_TOKEN", "")
          if len(token) < 20 or token != token.strip() or "\n" in token:
              raise SystemExit("STOP_DISPATCH_TOKEN_UNAVAILABLE")
          req = Request(
              URL, method="POST",
              # Explicit run-details opt-in; default 204 has no run ID.
              # We need the original dispatch ID for later STOP verification.
              data=b'{"ref":"main","return_run_details":true}',
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "Fund100-v6-stop-only-relay",
              })
          # ONE request; never retry a potentially accepted STOP dispatch.
          with build_opener(NoRedirect()).open(req, timeout=12) as response:
              if response.status != 200 or response.geturl() != URL:
                  raise RuntimeError("STOP_DISPATCH_ACK_UNVERIFIED")
              raw = response.read(2049)
          if len(raw) > 2048:
              raise RuntimeError("STOP_DISPATCH_ACK_TOO_LARGE")
          ack = json.loads(raw)
          if (type(ack) is not dict
              or type(ack.get("workflow_run_id")) is not int
              or ack["workflow_run_id"] <= 0
              or ack.get("run_url") !=
                  "https://api.github.com/repos/"+REPO+
                  "/actions/runs/"+str(ack["workflow_run_id"])
              or ack.get("html_url") !=
                  "https://github.com/"+REPO+
                  "/actions/runs/"+str(ack["workflow_run_id"])):
              raise RuntimeError("STOP_DISPATCH_ACK_UNTRUSTED")
          # A valid dispatch ACK ONLY means the STOP workflow was requested.
          # Never imply that V5/V6 STOP commits, broker DELETE, or final
          # open-order reconciliation actually completed.
          # Workflow run ID is not a secret; preserve it for the external
          # exact-run STOP/cancellation completion verifier.
          print("STOP_DISPATCH_RUN_ID=" + str(ack["workflow_run_id"]))
          print("STOP_DISPATCH_ACCEPTED_NOT_CONFIRMED")
          PY
