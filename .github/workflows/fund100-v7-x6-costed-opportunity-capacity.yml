name: Fund-100 V7 X6 Costed Opportunity Capacity (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0.py'
      - 'test_fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0.py'
      - '.github/workflows/fund100-v7-x6-costed-opportunity-capacity.yml'
      - 'fund100_v7_x5_capacity_aware_portfolio_router_v1_0.py'
  push:
    branches: [main]
    paths:
      - 'fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0.py'
      - 'test_fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0.py'
      - '.github/workflows/fund100-v7-x6-costed-opportunity-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brokerless-costed-switch-and-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - name: Confirm source STOP and run isolated X5/X6 regression tests
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python -m pytest -q test_fund100_v7_x5_capacity_aware_portfolio_router_v1_0.py test_fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0.py
          python - <<'PY'
          import fund100_v7_x6_costed_multiasset_opportunity_selector_v1_0 as x
          assert x.BROKER_GETS==x.BROKER_POSTS==x.BROKER_ORDERS==0
          assert not x.TRADING_AUTHORIZED
          PY
