name: Fund-100 C3G DBIQ Indexed 28-Contract Basket (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_dbiq_indexed_constituents_c3g_v1_0.py"
      - "test_fund100_dbiq_indexed_constituents_c3g_v1_0.py"
      - "research_lab/commodities/dbiq_diversified_index_web_indexed_28_constituents_2026_10_15.csv"
      - ".github/workflows/fund100-dbiq-c3g-indexed-basket.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-dbiq-c3g-indexed-basket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    name: Verify issuer-indexed contract codes and enforce as-of uncertainty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Static public indexed data only. No external downloads, no broker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate issuer indexed basket and zero-trade contract
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_dbiq_indexed_constituents_c3g_v1_0.py
      - name: Analyse indexed constituent composition with explicit provenance limitation
        run: |
          set -euo pipefail
          python fund100_dbiq_indexed_constituents_c3g_v1_0.py \
            --output-json /tmp/fund100-c3g-dbiq-basket.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fund100-c3g-dbiq-basket.json").read_text())
          assert r["status"] == "ISSUER_SEARCH_INDEXED_SNAPSHOT_NO_VERIFIED_EFFECTIVE_TIME"
          assert r["index_constituent_count"] == 28
          assert abs(r["issuer_displayed_weights_total_percent"] - 100) < .05
          assert r["exact_issuer_portfolio_effective_date"] is None
          assert not r["actual_provider_html_or_pdf_bytes_archived"]
          assert not r["historical_replay_or_backtest_eligible"]
          assert not r["portfolio_live_authorized"]
          assert not r["portfolio_paper_authorized"]
          assert r["broker_order_count"] == 0
          print("28 index-listed futures are not a verified historical roll/price series.")
          PY
      - name: Archive metadata-only nontradable research evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-c3g-index-web-constituents-${{ github.run_id }}
          path: /tmp/fund100-c3g-dbiq-basket.json
          retention-days: 90
          if-no-files-found: error
