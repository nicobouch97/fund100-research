name: Fund-100 Forward Lab

on:
  workflow_dispatch:

  schedule:
    # Two automatic attempts Tuesday-Saturday.
    # Repeated runs are safe because completed dates
    # already present in the ledger are not appended again.
    - cron: "37 10 * * 2-6"
    - cron: "37 13 * * 2-6"

permissions:
  contents: write

concurrency:
  group: fund100-forward-lab
  cancel-in-progress: false

jobs:
  forward-lab:
    name: Run Fund-100 Forward Lab

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Forward Lab files
        run: |
          set -euo pipefail

          test -f fund100_forward.py
          test -f fund100_forward_v1_1.py

          test -f forward_outputs/forward_ledger.csv
          test -f forward_outputs/forward_manifest.json
          test -f forward_outputs/forward_state.json
          test -f forward_outputs/latest_forward_report.json

          echo "Forward Lab files found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Run Forward Lab v1.1
        run: |
          set -euo pipefail
          python fund100_forward_v1_1.py

      - name: Check for permanent Forward Lab changes
        id: forward_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain -- \
            forward_outputs/forward_ledger.csv \
            forward_outputs/forward_manifest.json \
            forward_outputs/forward_state.json \
            forward_outputs/latest_forward_report.json \
            forward_outputs/market_revision_log.csv)"

          if [ -z "$CHANGES" ]; then

            echo "No permanent Forward Lab changes."
            echo "forward_changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "Forward Lab state changed:"
            echo "$CHANGES"
            echo "forward_changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Show Forward Lab changes
        if: steps.forward_check.outputs.forward_changed == 'true'
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "Forward Lab diff summary:"
          git diff --stat -- forward_outputs/ || true

      - name: Commit Forward Lab state
        if: steps.forward_check.outputs.forward_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-forward-bot"
          git config user.email "fund100-forward-bot@users.noreply.github.com"

          git add forward_outputs/forward_ledger.csv
          git add forward_outputs/forward_manifest.json
          git add forward_outputs/forward_state.json
          git add forward_outputs/latest_forward_report.json

          if [ -f forward_outputs/market_revision_log.csv ]; then
            git add forward_outputs/market_revision_log.csv
          fi

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          RUN_DATE="$(date -u +'%Y-%m-%d')"

          git commit \
            -m "Forward Lab v1.1 update ${RUN_DATE}"

          git push origin HEAD:main

      - name: Final status
        run: |
          echo "========================================"
          echo "FUND-100 FORWARD LAB v1.1 COMPLETE"
          echo "========================================"

          if [ "${{ steps.forward_check.outputs.forward_changed }}" = "true" ]; then
            echo "Forward Lab state was updated and committed."
          else
            echo "No permanent state change was required."
          fi
