name: Fund-100 Forward Lab

on:
  workflow_dispatch:

  # Recheck authentic market data immediately after a reviewed source,
  # ledger or scorecard repair lands on main. A Forward Lab output commit
  # must NOT trigger itself; scheduled observations remain the fallback.
  push:
    branches: [main]
    paths:
      - 'fund100.py'
      - 'fund100_forward.py'
      - 'fund100_forward_v1_1.py'
      - 'fund100_forward_evidence_scorecard_v1_0.py'
      - '.github/workflows/fund100-forward.yml'

  schedule:
    # First next-UTC-day check: 00:37Z Tue-Sat is after the prior US
    # trading session has closed (in both NYSE DST and standard time).
    # The existing strict < today_utc original-close gate still excludes
    # all current-UTC-date bars; retain morning/afternoon vendor fallbacks.
    - cron: "37 0 * * 2-6"
    - cron: "37 10 * * 2-6"
    - cron: "37 13 * * 2-6"

permissions:
  contents: write

concurrency:
  group: fund100-forward-lab
  cancel-in-progress: false

jobs:
  forward-lab:
    # Manual dispatch can target non-main refs; never publish those outputs to main.
    if: github.ref == 'refs/heads/main'
    name: Run Fund-100 Forward Lab
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Forward Lab files
        run: |
          set -euo pipefail

          test -f fund100_forward.py
          test -f fund100_forward_v1_1.py
          test -f forward_outputs/forward_ledger.csv
          test -f forward_outputs/forward_manifest.json
          test -f forward_outputs/forward_state.json
          test -f forward_outputs/latest_forward_report.json

          echo "Forward Lab files found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          pytest -q

      - name: Run Forward Lab v1.1
        run: |
          set -euo pipefail
          python fund100_forward_v1_1.py

      - name: Produce recovery-aware performance and downside scorecard (no broker)
        run: |
          set -euo pipefail
          python fund100_forward_evidence_scorecard_v1_0.py

      - name: Check for Forward Lab changes
        id: forward_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain -- forward_outputs/)"

          if [ -z "$CHANGES" ]; then
            echo "No permanent Forward Lab changes."
            echo "forward_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Forward Lab state changed:"
            echo "$CHANGES"
            echo "forward_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show Forward Lab changes
        if: steps.forward_check.outputs.forward_changed == 'true'
        run: |
          set -euo pipefail
          git status --short
          git diff --stat -- forward_outputs/ || true

      - name: Commit Forward Lab state
        id: forward_commit
        if: steps.forward_check.outputs.forward_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-forward-bot"
          git config user.email "fund100-forward-bot@users.noreply.github.com"

          # The workflow can start on an older main while a reviewed PR or
          # another ledger writer advances main. Never rebase or force-push
          # stale computed output onto a newer ledger. Re-run the complete
          # immutable-ledger validation and calculation on that newer HEAD.
          BASE_SHA="$(git rev-parse HEAD)"
          RUN_DATE="$(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            git add forward_outputs/

            if git diff --cached --quiet; then
              echo "No new Forward Lab output after latest-main validation."
              echo "forward_published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Forward Lab v1.1 update ${RUN_DATE}"

            if git push origin HEAD:main; then
              echo "forward_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # A push can fail because main moved or because permissions
            # changed. Only retry a verified fast-forward advancement.
            git fetch origin main
            NEW_MAIN_SHA="$(git rev-parse origin/main)"

            if [ "$NEW_MAIN_SHA" = "$BASE_SHA" ]; then
              echo "Push failed without an upstream change; refusing retry."
              exit 1
            fi

            if ! git merge-base --is-ancestor "$BASE_SHA" "$NEW_MAIN_SHA"; then
              echo "Main was rewritten; refusing to publish stale evidence."
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Main advanced during all three bounded attempts."
              exit 1
            fi

            echo "Main advanced; revalidating from current main (attempt ${attempt})."
            git reset --hard "$NEW_MAIN_SHA"
            # Remove only untracked generated output from the stale run.
            git clean -fd -- forward_outputs/
            BASE_SHA="$NEW_MAIN_SHA"

            # A concurrent main commit may have changed the model or its
            # ledger. Test and recompute from the current committed state.
            pytest -q
            python fund100_forward_v1_1.py
            python fund100_forward_evidence_scorecard_v1_0.py
          done

          exit 1

      - name: Final status
        run: |
          echo "========================================"
          echo "FUND-100 FORWARD LAB v1.1 COMPLETE"
          echo "========================================"

          if [ "${{ steps.forward_commit.outputs.forward_published }}" = "true" ]; then
            echo "Forward Lab state was updated and committed."
          else
            echo "No new Forward Lab state was published."
          fi
