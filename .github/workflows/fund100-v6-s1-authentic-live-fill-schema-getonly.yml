name: Fund-100 V6-S1 Actual LIVE FILL Source Five GET (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0.py"
      - "test_fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0.py"
      - "test_fund100_v6_s1_actual_fill_pin_scope_v1_0.py"
      - "audit_fund100_live_boundary.py"
      - "research_lab/V6_S1_ACTUAL_ORIGINAL_LIVE_FILL_ACTIVITY_FIVE_GET_PROTOCOL_2026_10_21.md"
      - ".github/workflows/fund100-v6-s1-authentic-live-fill-schema-getonly.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-v6-s1-authentic-live-fill-schema-getonly.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-s1-original-actual-fill-source-five-get
  cancel-in-progress: false

jobs:
  offline-original-account-and-fill-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Five GET FILL schema, pagination and exact credential pin tests
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0.py
          python -m pytest -q test_fund100_v6_s1_actual_fill_pin_scope_v1_0.py
          python -m pytest -q test_fund100_v6_real_live_getonly_transition_readiness_v1_0.py
      - name: Real LIVE operator STOP unchanged and no FILL writer
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          import fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0 as q
          from pathlib import Path
          assert not q.BROKER_WRITER_RELEASED
          assert q.FILL_PATH=="/v2/account/activities/FILL"
          assert q.FILL_PARAMS=={"after":"2026-10-01","direction":"asc","page_size":100}
          src=Path(q.__file__).read_text()
          for x in ('urlopen(', 'method="POST"', 'requests.post('):
              assert x not in src
          print("Original LIVE FILL activity SOURCE qualification, offline only; no trades.")
          PY

  protected-real-live-five-get-fill-source:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-original-account-and-fill-privacy-tests
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact source SHA and stopped original broker credential scope
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${FUND100_BROKER_KILL_SWITCH}" = "ENGAGED"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          from pathlib import Path
          import audit_fund100_live_boundary as a
          p=".github/workflows/fund100-v6-s1-authentic-live-fill-schema-getonly.yml"
          s="fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0.py"
          assert a.approved_scoped_live_script(p,s,Path(p).read_text())
          print("Exact pinned account/FILL five-GET credential scope PASS.")
          PY
      - name: Inspect genuine original Alpaca LIVE FILL schema (READ ONLY)
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          python fund100_v6_s1_authentic_live_fill_schema_getonly_v1_0.py
      - name: Original LIVE account trading remains stopped
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'Actual private broker FILL activity shape inspected; NO order posted.'
