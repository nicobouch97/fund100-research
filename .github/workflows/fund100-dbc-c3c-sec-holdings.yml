name: Fund-100 C3C DBC SEC Filing-Dated Futures Holdings (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_dbc_sec_holdings_c3c_v1_0.py"
      - "test_fund100_dbc_sec_holdings_c3c_v1_0.py"
      - "research_lab/commodities/dbc_sec_futures_holdings_2026_q1_q2.csv"
      - ".github/workflows/fund100-dbc-c3c-sec-holdings.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-dbc-c3c-sec-holdings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sec-holdings:
    name: Validate actual DBC SEC futures holdings and dated availability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No broker environment, credentials, API keys, user capital, or orders.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify 28 holdings per quarter, SEC dates and anti-lookahead
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_dbc_sec_holdings_c3c_v1_0.py
      - name: Compute descriptive sector weights and reported delivery-month changes
        run: |
          set -euo pipefail
          python fund100_dbc_sec_holdings_c3c_v1_0.py \
            --output-json /tmp/fund100-dbc-sec-c3c-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/fund100-dbc-sec-c3c-summary.json").read_text())
          assert r["status"]=="FILING_DATED_FUTURES_POSITION_RESEARCH_ONLY"
          assert r["actual_roll_pnl_computed"] is False
          assert r["full_daily_holdings_known"] is False
          assert r["index_weights_or_index_portfolio_replicated"] is False
          assert r["paper_authorized"] is False and r["live_authorized"] is False
          assert r["broker_order_count"] == 0
          print("SEC research summary complete: no synthetic futures P&L or market orders.")
          PY
      - name: Preserve reproducible filing-dated research summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-dbc-sec-holdings-c3c-${{ github.run_id }}
          path: /tmp/fund100-dbc-sec-c3c-summary.json
          retention-days: 90
          if-no-files-found: error
