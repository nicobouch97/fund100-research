name: Fund-100 V6 Aggressive Rotation Research (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v6_aggressive_rotation_research_v1_0.py"
      - "test_fund100_v6_aggressive_rotation_research_v1_0.py"
      - "fund100_v6_r1_vs_s1_historical_comparison_v1_0.py"
      - "test_fund100_v6_r1_vs_s1_historical_comparison_v1_0.py"
      - "fund100_v6_existing_four_model_economics_v1_0.py"
      - "test_fund100_v6_existing_four_model_economics_v1_0.py"
      - "fund100_v6_four_model_selection_uncertainty_v1_0.py"
      - "fund100_v6_four_model_walkforward_selector_v1_0.py"
      - "test_fund100_v6_four_model_walkforward_selector_v1_0.py"
      - "test_fund100_v6_four_model_selection_uncertainty_v1_0.py"
      - "research_lab/challengers/V6_FOUR_MODEL_CAUSAL_SWITCHING_2026_10_23.md"
      - "research_lab/challengers/V6_ACTIVE_AGGRESSIVE_RESET_2026_10_15.md"
      - ".github/workflows/fund100-v6-aggressive-rotation-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-aggressive-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Test aggressive concentration, no-lookahead and no-order gates
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_aggressive_rotation_research_v1_0.py test_fund100_v6_r1_vs_s1_historical_comparison_v1_0.py test_fund100_v6_existing_four_model_economics_v1_0.py test_fund100_v6_four_model_selection_uncertainty_v1_0.py test_fund100_v6_four_model_walkforward_selector_v1_0.py
      - name: Compare real frozen historical source at 5,15,35 basis points
        run: |
          set -euo pipefail
          python fund100_v6_aggressive_rotation_research_v1_0.py \
            --frozen-prices-csv research_lab/frozen_history_v2.csv \
            --output-json /tmp/fund100-v6-r1-exploratory.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/fund100-v6-r1-exploratory.json").read_text())
          assert d["status"]=="EXPLORATORY_ALREADY_EXAMINED_HISTORY_NOT_LIVE_APPROVED"
          assert d["source_frozen_v2_file_sha256"]=="acc2c8c08953b895ca5062b3cfba287efb97143b10e108e8ce4bd8b82ffb0d28"
          assert not d["operator_authorised_liquidation"]
          assert not d["operator_authorised_v6_live"]
          assert not d["paper_authorized"] and not d["live_authorized"]
          assert d["broker_orders"]==0
          assert set(d["results_by_one_way_cost_bps"])=={"5","15","35"}
          print("Exploratory research only; no real order authority.")
          PY
      - name: Compare original active momentum with HIGH fixed sector candidate
        run: |
          set -euo pipefail
          python fund100_v6_r1_vs_s1_historical_comparison_v1_0.py --frozen-prices-csv research_lab/frozen_history_v2.csv --output-json /tmp/fund100-v6-r1-vs-s1.json
          python -c "import json; from pathlib import Path; d=json.loads(Path('/tmp/fund100-v6-r1-vs-s1.json').read_text()); assert d['status']=='HISTORICAL_ALREADY_INSPECTED_COMPARISON_NO_STRATEGY_PROMOTION' and d['broker_orders']==0 and d['selected_winner_or_live_strategy'] is None"
      - name: Four-original-model economics and HIGH drawdown screen
        run: |
          set -euo pipefail
          python fund100_v6_existing_four_model_economics_v1_0.py --frozen-prices research_lab/frozen_history_v2.csv --output /tmp/fund100-v6-existing-four.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/fund100-v6-existing-four.json").read_text())
          assert set(d["causal_quarterly_model_switching_exploratory"]) == {"5","15","35"}
          assert d["meta_selector_not_independent_holdout_or_live_strategy"]
          assert d["strategy_promoted_for_funded_trading"] is None
          assert d["real_broker_orders"] == 0
          for x in d["causal_quarterly_model_switching_exploratory"].values():
              assert not x["independent_out_of_sample_alpha_proven"]
              assert x["paper_or_live_orders"] == 0
          for cost, comparison in d["causal_quarterly_model_switching_exploratory"].items():
              assert comparison["vol_target_blend_is_exploratory_cash_only_synthetic"]
              assert comparison["vol_target_blend_no_leverage_or_shorting"]
              assert comparison["vol_target_blend_decision_after_close_applies_next_session"]
              assert comparison["vol_target_blend_lookback_completed_sessions"] == 63
              assert comparison["vol_target_blend_annual_volatility_target_pct"] == 10
              for window, metrics in comparison["comparison_windows"].items():
                  print("Causal cash-only risk blend",cost,"bps",window,
                        "CAGR",metrics["historical_vol_target_blend_cagr_pct"],
                        "maxDD",metrics["historical_vol_target_blend_max_drawdown_pct"],
                        "realised vol",metrics["historical_vol_target_blend_realized_vol_pct"],
                        "mean exposure",metrics["historical_vol_target_blend_average_exposure_pct"],
                        "fixed blend CAGR",metrics["historical_equal_model_blend_cagr_pct"])
          for cost, comparison in d["causal_quarterly_model_switching_exploratory"].items():
              for window, beta in comparison["fixed_blend_acwi_beta_by_window"].items():
                  assert beta["status"] == "DESCRIPTIVE_FIXED_BLEND_ACWI_EQUITY_BETA"
                  assert beta["descriptive_in_sample_not_independent_alpha"]
                  assert beta["identical_post_eligibility_sessions"]
                  assert beta["return_observations"] >= 259
                  assert 0 <= beta["acwi_explained_daily_variance_pct"] <= 100
                  print("ACWI beta and tail exposure",cost,"bps",window,
                        "beta",beta["acwi_daily_beta"],
                        "R2 pct",beta["acwi_explained_daily_variance_pct"],
                        "annual arithmetic intercept pp",
                        beta["zero_cash_rate_ols_intercept_annual_pp"],
                        "worst ACWI 5pct day blend capture pct",
                        beta["worst_5pct_acwi_day_blend_capture_pct"])
          print("Causal four-model selector and risk-target sensitivity evaluated; no trading.")
          PY
      - name: Store reproducible historical review
        uses: actions/upload-artifact@v4
        with:
          name: fund100-v6-aggressive-exploratory
          path: |
            /tmp/fund100-v6-r1-exploratory.json
            /tmp/fund100-v6-r1-vs-s1.json
            /tmp/fund100-v6-existing-four.json
          retention-days: 90
          if-no-files-found: error
