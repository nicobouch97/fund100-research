name: Fund-100 V6-S1 Protected Single-Job Original ACWI Entry (GET ONLY; STOP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-v6-s1-original-one-attempt-protected-entrypoint.yml"
      # Changes to STOP controls or the existing GET-only readers must
      # invalidate stale readiness evidence from earlier main commits.
      - "fund100_live_operator_control.json"
      - "fund100_v6_s1_operator_control.json"
      - "fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py"
      - "fund100_v6_s1_owner_fence_private_getonly_v1_0.py"
      - "fund100_v6_recurring_private_protected_getonly_v1_0.py"
      - "fund100_v6_recurring_event_signed_journal_v1_0.py"
      - "test_fund100_v6_recurring_private_protected_getonly_v1_0.py"

# Deliberately incapable of writing to public GitHub or the private ledger.
# The signed first-ACWI coordinator has NO invocation in this version.
permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: fund100-v6-s1-original-acwi-protected-one-attempt-readiness
  cancel-in-progress: false

jobs:
  protected-main-first-acwi-admission:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 15
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original protected MAIN and all one-attempt trade locks MUST remain STOP
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'nicobouch97/fund100-research'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          test "$FUND100_RISK_LEVEL" = 'HIGH'
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          grep -Eq '"first_original_acwi_sell_enabled": false' fund100_v6_s1_operator_control.json
          python - <<'PY'
          import fund100_v6_s1_original_one_attempt_chain_locked_v1_0 as chain
          import fund100_v6_s1_one_time_owner_claim_cas_v1_0 as owner
          import fund100_v6_s1_immutable_release_publish_locked_v1_0 as publish
          import fund100_v6_s1_active_high_acwi_sell_risk_v2_0 as active
          assert chain.ONE_ATTEMPT_EXECUTION_RELEASED is False
          assert owner.SIGNED_OWNER_CLAIM_TRANSPORT_RELEASED is False
          assert owner.PREPOST_PRIVATE_CAS_RELEASED is False
          assert owner.PREPOST_PUBLIC_WITNESS_RELEASED is False
          assert publish.PUBLISH_SIGNED_HEAD_RELEASED is False
          assert active.ACTIVE_HIGH_SELL_SOURCE_RELEASED is False
          print('Original ACWI single-attempt coordinator installed and HARD LOCKED.')
          PY
      - name: Protected actual original seven GET source - no broker POST
        id: risk_source
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          python fund100_v6_s1_live_flow_timing_native_none_getonly_v1_0.py
      - name: Confirm source-verified postfunding HIGH account risk (NO RELEASE)
        if: steps.risk_source.outputs.risk_pass == 'true'
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          echo 'Fresh seven broker GET source passed; first ACWI order remains STOPPED.'
      - name: Signed original seq1, owner fence and V6 STOP in this SAME protected job
        env:
          FUND100_PRIVATE_STATE_READ_TOKEN: ${{ secrets.FUND100_PRIVATE_STATE_READ_TOKEN }}
          FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX: ${{ secrets.FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0 as ledger
          import fund100_v6_s1_owner_fence_private_getonly_v1_0 as fence
          import fund100_v6_s1_operator_control_v2_0 as v6
          assert v6.read_current_control()['trading_enabled'] is False
          signed=ledger.recover_current_original_signed_head_readonly(
              public_comment_id='6321330005',
              bootstrap_run_id='39637082911',
              read_token=os.environ['FUND100_PRIVATE_STATE_READ_TOKEN'],
              hmac_hex=os.environ['FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX'],
              public_token=os.environ['GITHUB_TOKEN'])
          assert signed['private_ledger_sequence']==1
          assert signed['private_genesis_HMAC_signature_and_original_account_binding_verified']
          assert signed['production_trade_order_submission_authorized'] is False
          assert signed['private_git_writes']==signed['broker_orders']==0
          first=fence.read_current_original_acwi_owner_fence_getonly(
              read_token=os.environ['FUND100_PRIVATE_STATE_READ_TOKEN'],
              hmac_hex=os.environ['FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX'])
          assert first['status']=='SIGNED_UNCLAIMED_FIRST_ACWI_OWNER_FENCE_READONLY'
          assert first['owner_claim_or_broker_POST_authorized'] is False
          assert first['real_private_Git_PUTs']==first['broker_orders']==0
          print('Same job: signed reserved original ACWI seq1 + unclaimed owner HMAC verified; no state mutation.')
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              import fund100_v6_s1_original_one_attempt_chain_locked_v1_0 as chain
              ctx=chain.prepare_original_acwi_context_getonly(
                  private_read_token=os.environ['FUND100_PRIVATE_STATE_READ_TOKEN'],
                  public_read_token=os.environ['GITHUB_TOKEN'],
                  hmac_hex=os.environ['FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX'])
              assert set(ctx)==chain.EXPECTED_CONTEXT
              assert chain.ONE_ATTEMPT_EXECUTION_RELEASED is False
              print('Original signed context hydrated in SAME protected job memory; coordinator STILL STOP.')
          PY
      - name: Authenticate recurring V2 private HEAD with BOTH distinct principals (GET ONLY)
        # Existing read and candidate write principals both authenticate the
        # original signed seq1 file BEFORE any expected recurring-path 404.
        # No broker credentials, no Git PUT, no optional human confirmation.
        env:
          FUND100_PRIVATE_STATE_READ_TOKEN: ${{ secrets.FUND100_PRIVATE_STATE_READ_TOKEN }}
          FUND100_PRIVATE_STATE_PRODUCTION_WRITE_TOKEN: ${{ secrets.FUND100_PRIVATE_STATE_PRODUCTION_WRITE_TOKEN }}
          FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX: ${{ secrets.FUND100_PRIVATE_LEDGER_HMAC_KEY_HEX }}
        run: |
          set -euo pipefail
          python -B fund100_v6_recurring_private_protected_getonly_v1_0.py
      - name: Provider immutable setting MUST pass (Administration READ; NO WRITES)
        env:
          FUND100_IMMUTABLE_RELEASE_ADMIN_READ_TOKEN: ${{ secrets.FUND100_IMMUTABLE_RELEASE_ADMIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import fund100_v6_s1_immutable_release_publish_locked_v1_0 as p
          token=os.environ.get('FUND100_IMMUTABLE_RELEASE_ADMIN_READ_TOKEN','')
          if not token:
              raise SystemExit('IMMUTABLE_RELEASE_ADMIN_READ_TOKEN_MISSING: STOP.')
          try:
              d=p._request(method='GET',url=p.IMMUTABLE_SETTING_URL,token=token)
          except Exception:
              raise SystemExit('IMMUTABLE_RELEASE_ADMIN_READ_DENIED_OR_UNAVAILABLE: STOP.') from None
          if d.get('enabled') is not True or type(d.get('enforced_by_owner')) is not bool:
              raise SystemExit('IMMUTABLE_RELEASE_SETTING_DISABLED_OR_UNKNOWN: STOP.')
          print('IMMUTABLE_RELEASE_SETTING_ENABLED_PROVIDER_VERIFIED; STILL STOP.')
          PY
      - name: Non-executable readiness only - no owner CAS, release, or Alpaca POST
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = 'ENGAGED'
          test "${{ steps.risk_source.outputs.risk_pass }}" = 'true'
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          echo 'ONE protected job checked real account and signed state GET only.'
          echo 'Original first ACWI one-attempt coordinator NOT CALLED; NO LIVE orders.'
