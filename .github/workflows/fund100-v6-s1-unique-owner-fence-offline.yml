name: Fund-100 V6-S1 Owner-Unique ACWI Fence Tests (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py"
      - "test_fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py"
      - "fund100_v6_s1_acwi_fenced_prepost_offline_v1_0.py"
      - "test_fund100_v6_s1_acwi_fenced_prepost_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-unique-owner-fence-offline.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py"
      - "test_fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py"
      - "fund100_v6_s1_acwi_fenced_prepost_offline_v1_0.py"
      - "test_fund100_v6_s1_acwi_fenced_prepost_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-unique-owner-fence-offline.yml"

permissions:
  contents: read

jobs:
  owner-fence-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline original signed owner CAS races, unknown responses and tampering
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py \
            test_fund100_v6_s1_acwi_fenced_prepost_offline_v1_0.py \
            test_fund100_v6_s1_prepost_one_shot_fake_bridge_v1_0.py \
            test_fund100_v6_s1_private_git_cas_protocol_v1_0.py \
            test_fund100_v6_s1_original_acwi_restart_triage_offline_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
