name: Fund-100 Alpaca LIVE Dry-Run Manifest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-alpaca-live-manifest
  cancel-in-progress: false

jobs:
  manifest:
    name: Compile Position-Aware LIVE Dry-Run Manifest

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify manifest files
        run: |
          set -euo pipefail

          test -f fund100_alpaca_live_manifest.py
          test -f fund100_alpaca_live_manifest_v1_1.py
          test -f test_fund100_alpaca_live_manifest_v1_1.py

          test -f fund100_alpaca_live_position_reconcile.py
          test -f fund100_alpaca_live_writer_disconnected_v1_1.py

          test -f fund100_alpaca_live_readonly_smoke.py
          test -f fund100_alpaca_live_preflight.py
          test -f fund100_alpaca_live_execution_boundary.py
          test -f fund100_broker_safety.py

          test -f shadow_outputs/v5_002/shadow_state.json

          echo "LIVE manifest v1.1 dependencies found."

      - name: Run Fund-100 tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Compile position-aware LIVE dry-run manifest v1.1
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
          FUND100_ENABLE_LIVE_MANIFEST: YES_READ_ONLY_LIVE_MANIFEST

          FUND100_LIVE_WRITE_MODE: DISABLED

        run: |
          set -euo pipefail
          python fund100_alpaca_live_manifest_v1_1.py

      - name: Check manifest changes
        id: manifest_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain -- live_dryrun_outputs/v5_002/)"

          if [ -z "$CHANGES" ]; then

            echo "Manifest is unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "Manifest output changed:"
            echo "$CHANGES"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit deterministic manifest
        if: steps.manifest_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-live-dryrun-bot"
          git config user.email "fund100-live-dryrun-bot@users.noreply.github.com"

          git add live_dryrun_outputs/v5_002/

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Update position-aware V5-002 live dry-run manifest"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected dirty working tree after manifest commit."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE MANIFEST v1.1 COMPLETE"
          echo "========================================"
          echo "Position-aware reconciliation: ENABLED"
          echo "Live holdings persisted: NO"
          echo "Volatile broker snapshot persisted: NO"
          echo "Live execution authorized: FALSE"
          echo 'Maximum live execution notional: $0.00'
          echo "Network write capability: ABSENT"
          echo "Orders submitted: 0"
