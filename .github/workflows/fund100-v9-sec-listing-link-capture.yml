name: Fund-100 V9 Original Nasdaq + SEC Current Issuer Coverage (NO BROKER)

# One current original 2-source Nasdaq + 1-source SEC join.
# Research-only exact ticker+exchange associations, NOT common stock eligibility.
on:
  push:
    branches: [main]
    paths:
      - "fund100_v9_sec_current_listing_association_v1_0.py"
      - "test_fund100_v9_sec_current_listing_association_v1_0.py"
      - ".github/workflows/fund100-v9-sec-listing-link-offline.yml"
      - ".github/workflows/fund100-v9-sec-listing-link-capture.yml"
      - "research_lab/stocks/V9_CURRENT_NASDAQ_SEC_ASSOCIATION_AUDIT_2026_11_10.md"
  schedule:
    - cron: "20 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v9-current-nasdaq-sec-issuer-coverage
  cancel-in-progress: false

jobs:
  read-three-public-sources-no-broker:
    if: github.repository == 'nicobouch97/fund100-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current source parser and adversarial SEC association cases
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FUND100_BROKER_KILL_SWITCH" = ENGAGED
          test "$FUND100_LIVE_WRITE_MODE" = DISABLED
          python -m pip install --disable-pip-version-check --no-input 'pytest>=8,<9' 'pandas==2.3.3'
          python -m pytest -q test_fund100_v9_official_current_listing_discovery_v1_0.py test_fund100_v9_sec_current_listing_association_v1_0.py
      - name: Read two Nasdaq official directories and one current SEC ticker map
        # The existing SEC contact identity is for SEC fair access ONLY:
        # never expose it in logs/artifact and NEVER include broker credentials.
        env:
          SEC_USER_AGENT: ${{ secrets.FUND100_SEC_USER_AGENT }}
          OUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -n "$SEC_USER_AGENT"
          python -B fund100_v9_sec_current_listing_association_v1_0.py --out "$OUT_DIR/v9-current-sec-listing-coverage.json"
      - name: Retain only redacted aggregate SHA/count evidence for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: v9-current-sec-listing-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-current-sec-listing-coverage.json
          if-no-files-found: error
          retention-days: 30
