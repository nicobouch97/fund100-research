name: Fund-100 V6-S1 Original XLE Reuse Transition Candidate (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_low_churn_migration_v2_0.py"
      - "test_fund100_v6_s1_low_churn_migration_v2_0.py"
      - "research_lab/v6_s1_low_churn_migration_candidate_v2_2026_10_19.json"
      - "research_lab/V6_S1_REUSE_XLE_LOW_CHURN_TRANSITION_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-low-churn-transition-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-executable-release-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal offline tests
        run: python -m pip install 'pytest>=8,<9'
      - name: Reconcile original paper and live evidence to nontrading low-churn policy
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_low_churn_migration_v2_0.py
          python -m pytest -q test_fund100_v6_s1_cash_at_order_no_churn_v1_0.py
          python - <<'PY'
          import fund100_v6_s1_low_churn_migration_v2_0 as m
          p=m.policy()
          assert p["paper_executable_mechanics"]["workflow_run_id"]==39269640353
          assert p["fresh_original_live_get_only"]["workflow_run_id"]==39272813574
          assert p["may_place_sell_orders"] is False and p["may_place_buy_orders"] is False
          assert p["legacy_nonoverlap_to_exit_after_risk_review"]==["ACWI","EEM","XLV"]
          assert p["overlap_to_retain_if_no_breach"]==["XLE"]
          print('Source-pinned XLE overlap retained; zero orders, no LIVE release.')
          PY
      - name: Old LIVE controls remain intact
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo 'Original HIGH $130.30 exposure and LIVE kill switch unchanged.'
