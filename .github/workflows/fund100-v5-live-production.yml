name: Fund-100 V5-002 LIVE Production

on:
  workflow_dispatch:

  schedule:
    - cron: "17,29,41 15 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: fund100-v5-002-live-production
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

jobs:
  production:
    name: V5-002 LIVE Production Controller
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production source
        run: |
          set -euo pipefail

          python -m py_compile \
            fund100_live_production_controller_v1_0.py

          python -m py_compile \
            test_fund100_live_production_controller_v1_0.py

          echo "Production controller syntax: PASS"

      - name: Run full regression suite on manual validation
        if: github.event_name == 'workflow_dispatch'
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          pytest -q

      - name: Verify bootstrap and policy artifacts exist
        run: |
          set -euo pipefail

          test -f \
            live_activation_outputs/v5_002/live_micro_pilot_policy_v1_0.json

          test -f \
            live_activation_outputs/v5_002/live_bootstrap_v1_0.json

          test -f \
            live_activation_outputs/v5_002/pre_live_release_lock_v1_9.json

          test -f \
            .github/workflows/fund100-alpaca-live-scheduled-compiler.yml

          echo "LIVE pilot policy: PRESENT"
          echo "Successful bootstrap evidence: PRESENT"
          echo "Release Lock v1.9: PRESENT"
          echo "Established scheduled-compiler workflow: PRESENT"

      - name: Import and validate scheduled-compiler arm from established workflow
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import fund100_alpaca_live_scheduled_compiler as compiler


          WORKFLOW_PATH = Path(
              ".github/workflows/"
              "fund100-alpaca-live-scheduled-compiler.yml"
          )


          if not WORKFLOW_PATH.exists():
              raise SystemExit(
                  "STOP: established scheduled-compiler "
                  "workflow is missing."
              )


          source = WORKFLOW_PATH.read_text(
              encoding="utf-8"
          )


          # --------------------------------------------------
          # Extract literal uppercase environment assignments
          # from the already-established working workflow.
          #
          # Supported shapes:
          #
          #   SOME_KEY: "VALUE"
          #   SOME_KEY: VALUE
          #   export SOME_KEY="VALUE"
          #   SOME_KEY=VALUE
          #
          # GitHub expressions / secrets are deliberately
          # ignored. We only need literal control variables.
          # --------------------------------------------------

          candidates = []


          def clean_value(
              value: str,
          ) -> str | None:

              value = value.strip()

              if not value:
                  return None

              if "${{" in value:
                  return None

              # Strip an inline YAML comment only when it is
              # separated from the value by whitespace.
              value = re.sub(
                  r"\s+#.*$",
                  "",
                  value,
              ).strip()

              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in {
                      '"',
                      "'",
                  }
              ):
                  value = value[1:-1]

              value = value.strip()

              if not value:
                  return None

              return value


          yaml_pattern = re.compile(
              r"^\s*"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*:\s*(.*?)\s*$"
          )

          shell_export_pattern = re.compile(
              r"^\s*export\s+"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*=\s*(.*?)\s*$"
          )

          shell_assign_pattern = re.compile(
              r"^\s*"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*=\s*(.*?)\s*$"
          )


          for line in source.splitlines():

              match = yaml_pattern.match(
                  line
              )

              if match is None:
                  match = shell_export_pattern.match(
                      line
                  )

              if match is None:
                  match = shell_assign_pattern.match(
                      line
                  )

              if match is None:
                  continue

              key = match.group(
                  1
              ).strip()

              value = clean_value(
                  match.group(
                      2
                  )
              )

              if value is None:
                  continue

              # Broker credentials should never be tested or
              # exported by this discovery step.
              if key in {
                  "ALPACA_LIVE_KEY",
                  "ALPACA_LIVE_SECRET",
                  "ALPACA_PAPER_KEY",
                  "ALPACA_PAPER_SECRET",
              }:
                  continue

              candidates.append(
                  (
                      key,
                      value,
                  )
              )


          # De-duplicate while preserving deterministic order.
          candidates = sorted(
              set(
                  candidates
              )
          )


          if not candidates:
              raise SystemExit(
                  "STOP: no literal control variables found "
                  "in the established scheduled-compiler workflow."
              )


          gate = (
              compiler.require_compiler_arm
          )


          original_environment = dict(
              os.environ
          )

          passing = []


          # --------------------------------------------------
          # Validate each candidate using the REAL frozen arm
          # gate. Nothing is bypassed or monkeypatched.
          # --------------------------------------------------

          for key, value in candidates:

              os.environ.clear()

              os.environ.update(
                  original_environment
              )

              os.environ[
                  "FUND100_BROKER_KILL_SWITCH"
              ] = "ENGAGED"

              os.environ[
                  key
              ] = value

              try:

                  gate()

              except Exception:
                  continue

              passing.append(
                  (
                      key,
                      value,
                  )
              )


          os.environ.clear()

          os.environ.update(
              original_environment
          )


          if not passing:

              # ------------------------------------------------
              # Second pass:
              #
              # Some workflows define multiple literal control
              # variables that are jointly required.
              #
              # Load ALL safe literal workflow variables
              # together, then verify the real gate.
              # ------------------------------------------------

              test_environment = dict(
                  original_environment
              )

              test_environment[
                  "FUND100_BROKER_KILL_SWITCH"
              ] = "ENGAGED"

              for key, value in candidates:

                  if key in {
                      "ALPACA_LIVE_KEY",
                      "ALPACA_LIVE_SECRET",
                      "ALPACA_PAPER_KEY",
                      "ALPACA_PAPER_SECRET",
                  }:
                      continue

                  test_environment[
                      key
                  ] = value


              os.environ.clear()

              os.environ.update(
                  test_environment
              )


              try:

                  gate()

              except Exception as exc:

                  os.environ.clear()

                  os.environ.update(
                      original_environment
                  )

                  raise SystemExit(
                      "STOP: the established compiler workflow "
                      "variables were found, but they did not "
                      "satisfy require_compiler_arm(). "
                      f"Gate error: {exc}"
                  )


              os.environ.clear()

              os.environ.update(
                  original_environment
              )


              # Export only variables that are plausible
              # compiler control variables rather than every
              # literal in the workflow.

              passing = [
                  (
                      key,
                      value,
                  )
                  for key, value in candidates
                  if any(
                      token in key
                      for token in (
                          "ARM",
                          "COMPILER",
                          "SCHEDULED",
                      )
                  )
              ]


          if not passing:

              raise SystemExit(
                  "STOP: compiler arm gate passed but no "
                  "compiler-control variable could be isolated."
              )


          # --------------------------------------------------
          # Prove the selected set jointly satisfies the gate.
          # --------------------------------------------------

          os.environ.clear()

          os.environ.update(
              original_environment
          )

          os.environ[
              "FUND100_BROKER_KILL_SWITCH"
          ] = "ENGAGED"

          for key, value in passing:

              os.environ[
                  key
              ] = value


          try:

              gate()

          except Exception as exc:

              raise SystemExit(
                  "STOP: final scheduled-compiler arm "
                  f"validation failed: {exc}"
              )


          os.environ.clear()

          os.environ.update(
              original_environment
          )


          # --------------------------------------------------
          # Persist validated control values for later steps.
          # Values are deliberately NOT printed.
          # --------------------------------------------------

          github_env = os.environ[
              "GITHUB_ENV"
          ]


          with open(
              github_env,
              "a",
              encoding="utf-8",
          ) as handle:

              for key, value in passing:

                  if (
                      "\n" in value
                      or "\r" in value
                  ):
                      raise SystemExit(
                          "STOP: malformed compiler "
                          "control value."
                      )

                  handle.write(
                      f"{key}={value}\n"
                  )


          print(
              "Established scheduled-compiler workflow: PARSED"
          )

          print(
              "Frozen require_compiler_arm() gate: VERIFIED"
          )

          print(
              "Validated compiler control variables:",
              len(
                  passing
              ),
          )

          print(
              "Compiler control values: "
              "VALIDATED / NOT PRINTED"
          )

          print(
              "Gate bypass or monkeypatch used: NO"
          )
          PY

      - name: Prove scheduled compiler arm survives into this job
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import fund100_alpaca_live_scheduled_compiler as compiler

          compiler.require_compiler_arm()

          print(
              "Scheduled execution-time compiler arm: PASS"
          )
          PY

      - name: Verify scheduled compiler remains non-executable
        run: |
          set -euo pipefail

          python - <<'PY'
          import inspect

          import fund100_alpaca_live_scheduled_compiler_v1_1 \
              as compiler


          source = inspect.getsource(
              compiler
          )

          forbidden = [
              'method="POST"',
              "method='POST'",
              'method="PUT"',
              "method='PUT'",
              'method="PATCH"',
              "method='PATCH'",
              'method="DELETE"',
              "method='DELETE'",
          ]

          found = [
              item
              for item
              in forbidden
              if item in source
          ]

          if found:

              raise SystemExit(
                  "STOP: scheduled compiler source "
                  "contains unexpected mutating HTTP method."
              )

          print(
              "Scheduled compiler mutation transport: ABSENT"
          )
          PY

      - name: Run V5-002 LIVE production controller
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

        run: |
          set -euo pipefail

          python fund100_live_production_controller_v1_0.py

      - name: Verify production status artifact
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path


          path = Path(
              "live_activation_outputs/v5_002/"
              "live_production_status_v1_0.json"
          )


          if not path.exists():

              raise SystemExit(
                  "STOP: production status artifact missing."
              )


          body = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          if (
              body.get(
                  "strategy"
              )
              != "V5-002_SHADOW"
          ):

              raise SystemExit(
                  "STOP: wrong production strategy."
              )


          if (
              body.get(
                  "broker_environment"
              )
              != "ALPACA_LIVE"
          ):

              raise SystemExit(
                  "STOP: wrong broker environment."
              )


          if (
              body.get(
                  "ordinary_drift_trading"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: ordinary drift trading changed."
              )


          if (
              body.get(
                  "leverage_allowed"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: leverage policy changed."
              )


          if (
              body.get(
                  "shorting_allowed"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: shorting policy changed."
              )


          print(
              "Production status artifact: VERIFIED"
          )

          print(
              "Controller status:",
              body.get(
                  "status"
              ),
          )

          print(
              "Orders submitted this run:",
              body.get(
                  "orders_submitted_this_run"
              ),
          )
          PY

      - name: Upload production status
        uses: actions/upload-artifact@v4
        with:
          name: fund100-live-production-status-${{ github.run_id }}
          path: live_activation_outputs/v5_002/live_production_status_v1_0.json
          retention-days: 30

      - name: Restore transient compiler and status files
        run: |
          set -euo pipefail

          git restore --worktree -- \
            live_dryrun_outputs/v5_002 \
            2>/dev/null || true

          git restore --worktree -- \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            2>/dev/null || true

          if git ls-files --error-unmatch \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            >/dev/null 2>&1; then

            true

          else

            rm -f \
              live_activation_outputs/v5_002/live_production_status_v1_0.json

          fi

      - name: Commit completed LIVE event ledger if changed
        run: |
          set -euo pipefail

          if [ ! -d \
            live_activation_outputs/v5_002/live_production_events ]; then

            echo "No completed production event to commit."
            exit 0

          fi

          git config user.name \
            "fund100-production-bot"

          git config user.email \
            "fund100-production-bot@users.noreply.github.com"

          git add \
            live_activation_outputs/v5_002/live_production_events

          if git diff --cached --quiet; then

            echo "No new completed LIVE event evidence."
            exit 0

          fi

          git commit -m \
            "Record completed V5-002 LIVE production event"

          git pull --rebase origin main

          git push origin HEAD:main

      - name: Final production summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 V5-002 LIVE PRODUCTION RUN COMPLETE"
          echo "========================================"
          echo "Strategy: V5-002"
          echo "Environment: ALPACA LIVE"
          echo "Bootstrap: COMPLETE"
          echo "Scheduled compiler arm: VERIFIED"
          echo "Scheduled compiler: CURRENT / V1.1"
          echo "Frozen 2.5% threshold: PRESERVED"
          echo "Ordinary drift trading: FALSE"
          echo "Position-aware execution: TRUE"
          echo "SELL before BUY: ENFORCED"
          echo "Fresh broker reconstruction: ENFORCED"
          echo "Deterministic client IDs: ENFORCED"
          echo "Cumulative pilot ceiling: ENFORCED"
          echo "Leverage allowed: FALSE"
          echo "Shorting allowed: FALSE"
          echo "Additional deposits automatically usable: FALSE"
