name: Fund-100 V5-002 LIVE Production

on:
  workflow_dispatch:

  schedule:
    - cron: "17,29,41 15 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: fund100-v5-002-live-production
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

jobs:
  production:
    name: V5-002 LIVE Production Controller
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production source
        run: |
          set -euo pipefail

          python -m py_compile \
            fund100_live_production_controller_v1_0.py

          python -m py_compile \
            test_fund100_live_production_controller_v1_0.py

          echo "Production controller syntax: PASS"

      - name: Run full regression suite on manual validation
        if: github.event_name == 'workflow_dispatch'
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          pytest -q

      - name: Verify required production artifacts
        run: |
          set -euo pipefail

          test -f \
            live_activation_outputs/v5_002/live_micro_pilot_policy_v1_0.json

          test -f \
            live_activation_outputs/v5_002/live_bootstrap_v1_0.json

          test -f \
            live_activation_outputs/v5_002/pre_live_release_lock_v1_9.json

          test -f \
            .github/workflows/fund100-alpaca-live-scheduled-compiler.yml

          test -f \
            .github/workflows/fund100-alpaca-live-readonly.yml

          echo "LIVE pilot policy: PRESENT"
          echo "Successful bootstrap evidence: PRESENT"
          echo "Release Lock v1.9: PRESENT"
          echo "Established scheduled-compiler workflow: PRESENT"
          echo "Established LIVE read-only workflow: PRESENT"

      - name: Import established compiler and read-only arm contracts
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          WORKFLOW_PATHS = [
              Path(
                  ".github/workflows/"
                  "fund100-alpaca-live-scheduled-compiler.yml"
              ),

              Path(
                  ".github/workflows/"
                  "fund100-alpaca-live-readonly.yml"
              ),
          ]


          EXCLUDED_KEYS = {
              "FUND100_BROKER_KILL_SWITCH",
              "ALPACA_LIVE_KEY",
              "ALPACA_LIVE_SECRET",
              "ALPACA_PAPER_KEY",
              "ALPACA_PAPER_SECRET",
          }


          yaml_pattern = re.compile(
              r"^\s*"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*:\s*(.*?)\s*$"
          )

          shell_export_pattern = re.compile(
              r"^\s*export\s+"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*=\s*(.*?)\s*$"
          )

          shell_assign_pattern = re.compile(
              r"^\s*"
              r"([A-Z][A-Z0-9_]{2,})"
              r"\s*=\s*(.*?)\s*$"
          )


          def clean_literal_value(
              raw_value,
          ):

              value = str(
                  raw_value
              ).strip()

              if not value:

                  return None

              github_expression_prefix = (
                  "$"
                  + "{"
                  + "{"
              )

              if (
                  github_expression_prefix
                  in value
              ):

                  return None

              value = re.sub(
                  r"\s+#.*$",
                  "",
                  value,
              ).strip()

              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in {
                      '"',
                      "'",
                  }
              ):

                  value = value[
                      1:-1
                  ]

              value = value.strip()

              if not value:

                  return None

              if (
                  "\n" in value
                  or "\r" in value
              ):

                  return None

              return value


          def extract_arm_controls(
              path,
          ):

              if not path.exists():

                  raise SystemExit(
                      "STOP: established control workflow "
                      f"is missing: {path}"
                  )

              text = path.read_text(
                  encoding="utf-8"
              )

              result = {}


              for line in text.splitlines():

                  match = yaml_pattern.match(
                      line
                  )

                  if match is None:

                      match = shell_export_pattern.match(
                          line
                      )

                  if match is None:

                      match = shell_assign_pattern.match(
                          line
                      )

                  if match is None:

                      continue


                  key = (
                      match.group(
                          1
                      )
                      .strip()
                  )

                  value = clean_literal_value(
                      match.group(
                          2
                      )
                  )


                  if value is None:

                      continue


                  if key in EXCLUDED_KEYS:

                      continue


                  # Only import Fund-100 explicit ARM controls.
                  # We deliberately do not inherit arbitrary
                  # workflow modes or broker configuration.

                  if not key.startswith(
                      "FUND100_"
                  ):

                      continue


                  if "ARM" not in key:

                      continue


                  if (
                      key in result
                      and result[key] != value
                  ):

                      raise SystemExit(
                          "STOP: conflicting literal values "
                          f"for {key} inside {path}."
                      )


                  result[
                      key
                  ] = value


              return result


          controls = {}


          for workflow_path in WORKFLOW_PATHS:

              discovered = (
                  extract_arm_controls(
                      workflow_path
                  )
              )


              if not discovered:

                  raise SystemExit(
                      "STOP: no literal Fund-100 arm controls "
                      "could be recovered from "
                      f"{workflow_path}."
                  )


              for key, value in (
                  discovered.items()
              ):

                  if (
                      key in controls
                      and controls[key] != value
                  ):

                      raise SystemExit(
                          "STOP: established workflows disagree "
                          f"about arm control {key}."
                      )


                  controls[
                      key
                  ] = value


          if not controls:

              raise SystemExit(
                  "STOP: no established arm controls recovered."
              )


          def run_gate(
              *,
              module_name,
              function_name,
              label,
          ):

              environment = dict(
                  os.environ
              )

              environment[
                  "FUND100_BROKER_KILL_SWITCH"
              ] = "ENGAGED"


              for key, value in (
                  controls.items()
              ):

                  environment[
                      key
                  ] = value


              program = (
                  "import "
                  + module_name
                  + " as module; "
                  + "module."
                  + function_name
                  + "()"
              )


              result = subprocess.run(
                  [
                      sys.executable,
                      "-c",
                      program,
                  ],
                  env=environment,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )


              if result.returncode != 0:

                  detail = (
                      result.stderr.strip()
                      or result.stdout.strip()
                      or "no diagnostic returned"
                  )

                  raise SystemExit(
                      "STOP: "
                      + label
                      + " did not accept the established "
                      + "workflow arm controls.\n"
                      + detail
                  )


              print(
                  label
                  + ": PASS"
              )


          # Validate the two exact frozen gates that the
          # production compiler needs.

          run_gate(
              module_name=(
                  "fund100_alpaca_live_scheduled_compiler"
              ),

              function_name=(
                  "require_compiler_arm"
              ),

              label=(
                  "Scheduled compiler arm gate"
              ),
          )


          run_gate(
              module_name=(
                  "fund100_alpaca_live_readonly_smoke"
              ),

              function_name=(
                  "require_readonly_arm"
              ),

              label=(
                  "LIVE read-only arm gate"
              ),
          )


          # Persist only the validated non-secret ARM controls
          # for subsequent steps in this same GitHub job.

          github_env_path = (
              os.environ[
                  "GITHUB_ENV"
              ]
          )


          with open(
              github_env_path,
              "a",
              encoding="utf-8",
          ) as handle:

              for key in sorted(
                  controls
              ):

                  value = (
                      controls[
                          key
                      ]
                  )

                  handle.write(
                      f"{key}={value}\n"
                  )


          print(
              "Established scheduled-compiler workflow: PARSED"
          )

          print(
              "Established LIVE read-only workflow: PARSED"
          )

          print(
              "Validated arm controls:",
              len(
                  controls
              ),
          )

          print(
              "Arm control values: "
              "VALIDATED / NOT PRINTED"
          )

          print(
              "Secrets imported from workflow files: NO"
          )

          print(
              "Broker kill-switch override exported: NO"
          )

          print(
              "Gate bypass or monkeypatch used: NO"
          )
          PY

      - name: Prove all read-only prerequisite arms survive into job
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import fund100_alpaca_live_scheduled_compiler \
              as compiler

          import fund100_alpaca_live_readonly_smoke \
              as readonly


          compiler.require_compiler_arm()

          readonly.require_readonly_arm()


          print(
              "Scheduled execution-time compiler arm: PASS"
          )

          print(
              "LIVE read-only inspection arm: PASS"
          )

          print(
              "Nested compiler prerequisites: PASS"
          )
          PY

      - name: Verify read-only compiler dependency remains non-mutating
        run: |
          set -euo pipefail

          python - <<'PY'
          import inspect

          import fund100_alpaca_live_scheduled_compiler_v1_1 \
              as compiler

          import fund100_alpaca_live_readonly_smoke \
              as readonly


          compiler_source = inspect.getsource(
              compiler
          )

          readonly_source = inspect.getsource(
              readonly
          )


          forbidden_compiler = [
              'method="POST"',
              "method='POST'",
              'method="PUT"',
              "method='PUT'",
              'method="PATCH"',
              "method='PATCH'",
              'method="DELETE"',
              "method='DELETE'",
          ]


          found_compiler = [
              item
              for item
              in forbidden_compiler
              if item in compiler_source
          ]


          if found_compiler:

              raise SystemExit(
                  "STOP: scheduled compiler contains "
                  "unexpected mutating HTTP method."
              )


          # The old LIVE read-only helper should explicitly
          # contain no mutation transport.

          found_readonly = [
              item
              for item
              in forbidden_compiler
              if item in readonly_source
          ]


          if found_readonly:

              raise SystemExit(
                  "STOP: LIVE read-only helper contains "
                  "unexpected mutating HTTP method."
              )


          print(
              "Scheduled compiler mutation transport: ABSENT"
          )

          print(
              "LIVE read-only mutation transport: ABSENT"
          )
          PY

      - name: Run V5-002 LIVE production controller
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

        run: |
          set -euo pipefail

          python fund100_live_production_controller_v1_0.py

      - name: Verify production status artifact
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path


          path = Path(
              "live_activation_outputs/v5_002/"
              "live_production_status_v1_0.json"
          )


          if not path.exists():

              raise SystemExit(
                  "STOP: production status artifact missing."
              )


          body = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          if (
              body.get(
                  "strategy"
              )
              != "V5-002_SHADOW"
          ):

              raise SystemExit(
                  "STOP: wrong production strategy."
              )


          if (
              body.get(
                  "broker_environment"
              )
              != "ALPACA_LIVE"
          ):

              raise SystemExit(
                  "STOP: wrong broker environment."
              )


          if (
              body.get(
                  "ordinary_drift_trading"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: ordinary drift trading changed."
              )


          if (
              body.get(
                  "leverage_allowed"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: leverage policy changed."
              )


          if (
              body.get(
                  "shorting_allowed"
              )
              is not False
          ):

              raise SystemExit(
                  "STOP: shorting policy changed."
              )


          print(
              "Production status artifact: VERIFIED"
          )

          print(
              "Controller status:",
              body.get(
                  "status"
              ),
          )

          print(
              "Orders submitted this run:",
              body.get(
                  "orders_submitted_this_run"
              ),
          )
          PY

      - name: Upload production status
        uses: actions/upload-artifact@v4
        with:
          name: fund100-live-production-status-${{ github.run_id }}
          path: live_activation_outputs/v5_002/live_production_status_v1_0.json
          retention-days: 30

      - name: Restore transient compiler and status files
        run: |
          set -euo pipefail

          git restore --worktree -- \
            live_dryrun_outputs/v5_002 \
            2>/dev/null || true

          git restore --worktree -- \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            2>/dev/null || true

          if git ls-files --error-unmatch \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            >/dev/null 2>&1; then

            true

          else

            rm -f \
              live_activation_outputs/v5_002/live_production_status_v1_0.json

          fi

      - name: Commit completed LIVE event ledger if changed
        run: |
          set -euo pipefail

          if [ ! -d \
            live_activation_outputs/v5_002/live_production_events ]; then

            echo "No completed production event to commit."
            exit 0

          fi

          git config user.name \
            "fund100-production-bot"

          git config user.email \
            "fund100-production-bot@users.noreply.github.com"

          git add \
            live_activation_outputs/v5_002/live_production_events

          if git diff --cached --quiet; then

            echo "No new completed LIVE event evidence."
            exit 0

          fi

          git commit -m \
            "Record completed V5-002 LIVE production event"

          git pull --rebase origin main

          git push origin HEAD:main

      - name: Final production summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 V5-002 LIVE PRODUCTION RUN COMPLETE"
          echo "========================================"
          echo "Strategy: V5-002"
          echo "Environment: ALPACA LIVE"
          echo "Bootstrap: COMPLETE"
          echo "Scheduled compiler arm: VERIFIED"
          echo "LIVE read-only arm: VERIFIED"
          echo "Scheduled compiler: CURRENT / V1.1"
          echo "Frozen 2.5% threshold: PRESERVED"
          echo "Ordinary drift trading: FALSE"
          echo "Position-aware execution: TRUE"
          echo "SELL before BUY: ENFORCED"
          echo "Fresh broker reconstruction: ENFORCED"
          echo "Deterministic client IDs: ENFORCED"
          echo "Cumulative pilot ceiling: ENFORCED"
          echo "Leverage allowed: FALSE"
          echo "Shorting allowed: FALSE"
          echo "Additional deposits automatically usable: FALSE"
