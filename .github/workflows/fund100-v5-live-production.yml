name: Fund-100 V5-002 LIVE Production

on:
  workflow_dispatch:

  schedule:
    - cron: "17,29,41 15 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: fund100-v5-002-live-production
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

jobs:
  production:
    name: V5-002 LIVE Production Controller
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile production source
        run: |
          set -euo pipefail

          python -m py_compile \
            fund100_live_production_controller_v1_0.py

          python -m py_compile \
            test_fund100_live_production_controller_v1_0.py

          echo "Production controller syntax: PASS"

      - name: Run regression suite on manual validation
        if: github.event_name == 'workflow_dispatch'
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          pytest -q

      - name: Verify required LIVE artifacts
        run: |
          set -euo pipefail

          test -f \
            live_activation_outputs/v5_002/live_micro_pilot_policy_v1_0.json

          test -f \
            live_activation_outputs/v5_002/live_bootstrap_v1_0.json

          test -f \
            live_activation_outputs/v5_002/pre_live_release_lock_v1_9.json

          test -f \
            fund100_alpaca_live_scheduled_compiler.py

          test -f \
            fund100_alpaca_live_scheduled_compiler_v1_1.py

          test -f \
            fund100_alpaca_live_readonly_smoke.py

          echo "LIVE pilot policy: PRESENT"
          echo "Successful LIVE bootstrap evidence: PRESENT"
          echo "Release Lock v1.9: PRESENT"
          echo "Scheduled compiler source: PRESENT"
          echo "LIVE read-only source: PRESENT"

      - name: Resolve exact frozen arm contracts from Python gates
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          import inspect
          import os
          import re
          import subprocess
          import sys
          import types


          GATES = [
              {
                  "module":
                      "fund100_alpaca_live_scheduled_compiler",

                  "function":
                      "require_compiler_arm",

                  "label":
                      "Scheduled compiler",

                  "preferred_tokens":
                      (
                          "COMPILER",
                          "SCHEDULED",
                          "ARM",
                      ),
              },

              {
                  "module":
                      "fund100_alpaca_live_readonly_smoke",

                  "function":
                      "require_readonly_arm",

                  "label":
                      "LIVE read-only",

                  "preferred_tokens":
                      (
                          "READ",
                          "READONLY",
                          "LIVE",
                          "ARM",
                      ),
              },
          ]


          def collect_code_strings(
              code,
          ):

              result = set()

              for item in code.co_consts:

                  if isinstance(
                      item,
                      str,
                  ):

                      result.add(
                          item
                      )

                  elif isinstance(
                      item,
                      types.CodeType,
                  ):

                      result.update(
                          collect_code_strings(
                              item
                          )
                      )

              return result


          def collect_module_strings(
              module,
              function,
          ):

              result = set()

              try:

                  source = inspect.getsource(
                      module
                  )

              except Exception:

                  source = ""


              if source:

                  try:

                      tree = ast.parse(
                          source
                      )

                  except SyntaxError:

                      tree = None


                  if tree is not None:

                      for node in ast.walk(
                          tree
                      ):

                          if (
                              isinstance(
                                  node,
                                  ast.Constant,
                              )
                              and isinstance(
                                  node.value,
                                  str,
                              )
                          ):

                              result.add(
                                  node.value
                              )


              for value in (
                  module.__dict__.values()
              ):

                  if isinstance(
                      value,
                      str,
                  ):

                      result.add(
                          value
                      )


              result.update(
                  collect_code_strings(
                      function.__code__
                  )
              )

              return result


          def score_key(
              key,
              preferred_tokens,
          ):

              upper = key.upper()

              score = 0

              if upper.startswith(
                  "FUND100_"
              ):

                  score += 50

              if "ARM" in upper:

                  score += 50


              for token in preferred_tokens:

                  if token in upper:

                      score += 20

              return score


          def score_value(
              value,
          ):

              score = 0

              stripped = value.strip()

              if not stripped:

                  return -1000


              if len(
                  stripped
              ) <= 64:

                  score += 10


              if re.fullmatch(
                  r"[A-Z0-9_:\-]+",
                  stripped,
              ):

                  score += 20


              upper = stripped.upper()

              for token in (
                  "ARM",
                  "ENABLE",
                  "ALLOW",
                  "READ",
                  "LIVE",
                  "COMPILER",
                  "YES",
                  "TRUE",
              ):

                  if token in upper:

                      score += 5

              return score


          def gate_passes(
              *,
              module_name,
              function_name,
              key,
              value,
          ):

              environment = dict(
                  os.environ
              )

              environment[
                  "FUND100_BROKER_KILL_SWITCH"
              ] = "ENGAGED"

              environment[
                  key
              ] = value


              program = (
                  "import "
                  + module_name
                  + " as module; "
                  + "module."
                  + function_name
                  + "()"
              )


              result = subprocess.run(
                  [
                      sys.executable,
                      "-c",
                      program,
                  ],
                  env=environment,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False,
              )

              return (
                  result.returncode
                  == 0
              )


          resolved = {}


          for gate in GATES:

              module_name = (
                  gate[
                      "module"
                  ]
              )

              function_name = (
                  gate[
                      "function"
                  ]
              )

              label = (
                  gate[
                      "label"
                  ]
              )

              preferred_tokens = (
                  gate[
                      "preferred_tokens"
                  ]
              )


              module = __import__(
                  module_name
              )

              function = getattr(
                  module,
                  function_name
              )


              strings = (
                  collect_module_strings(
                      module,
                      function,
                  )
              )


              candidate_keys = set()


              for text in strings:

                  candidate_keys.update(
                      re.findall(
                          r"FUND100_[A-Z0-9_]+",
                          text,
                      )
                  )


              candidate_keys.discard(
                  "FUND100_BROKER_KILL_SWITCH"
              )


              candidate_keys = [
                  key
                  for key
                  in candidate_keys
                  if (
                      "ARM" in key
                      or any(
                          token in key
                          for token
                          in preferred_tokens
                      )
                  )
              ]


              candidate_keys = sorted(
                  candidate_keys,
                  key=lambda key: (
                      -score_key(
                          key,
                          preferred_tokens,
                      ),
                      key,
                  ),
              )


              candidate_values = set(
                  strings
              )


              candidate_values.update(
                  {
                      "YES",
                      "TRUE",
                      "ENABLED",
                      "ARMED",
                      "ALLOW",
                      "READ_ONLY",
                      "CURRENT",
                      "1",
                  }
              )


              clean_values = []


              for value in candidate_values:

                  if not isinstance(
                      value,
                      str,
                  ):

                      continue


                  value = value.strip()


                  if not value:

                      continue


                  if len(
                      value
                  ) > 128:

                      continue


                  if (
                      "\n" in value
                      or "\r" in value
                  ):

                      continue


                  if value.startswith(
                      "FUND100_"
                  ):

                      continue


                  if value in {
                      "ENGAGED",
                      "DISENGAGED",
                  }:

                      continue


                  clean_values.append(
                      value
                  )


              clean_values = sorted(
                  set(
                      clean_values
                  ),
                  key=lambda value: (
                      -score_value(
                          value
                      ),
                      len(
                          value
                      ),
                      value,
                  ),
              )


              # Keep the search bounded.
              clean_values = (
                  clean_values[
                      :200
                  ]
              )


              if not candidate_keys:

                  raise SystemExit(
                      "STOP: no plausible environment keys "
                      f"found for {label} gate."
                  )


              passing_pairs = []


              for key in candidate_keys:

                  for value in clean_values:

                      if gate_passes(
                          module_name=(
                              module_name
                          ),

                          function_name=(
                              function_name
                          ),

                          key=key,

                          value=value,
                      ):

                          passing_pairs.append(
                              (
                                  key,
                                  value,
                              )
                          )

                          # Once a high-ranked key has passed,
                          # there is no reason to test hundreds
                          # more values for that same key.
                          break


                  if passing_pairs:

                      break


              if not passing_pairs:

                  print(
                      f"{label} candidate keys examined:"
                  )

                  for key in candidate_keys:

                      print(
                          " -",
                          key,
                      )

                  raise SystemExit(
                      "STOP: unable to satisfy "
                      f"{label} arm gate from the frozen "
                      "Python source."
                  )


              key, value = (
                  passing_pairs[
                      0
                  ]
              )


              # Final independent proof in a fresh process.
              if not gate_passes(
                  module_name=(
                      module_name
                  ),

                  function_name=(
                      function_name
                  ),

                  key=key,

                  value=value,
              ):

                  raise SystemExit(
                      "STOP: resolved arm contract failed "
                      f"final validation for {label}."
                  )


              if (
                  key in resolved
                  and resolved[
                      key
                  ] != value
              ):

                  raise SystemExit(
                      "STOP: two gates resolved conflicting "
                      f"values for {key}."
                  )


              resolved[
                  key
              ] = value


              print(
                  f"{label} arm gate: PASS"
              )

              print(
                  f"{label} arm key:",
                  key,
              )

              print(
                  f"{label} arm value: "
                  "VALIDATED / NOT PRINTED"
              )


          if not resolved:

              raise SystemExit(
                  "STOP: no arm contracts resolved."
              )


          github_env = (
              os.environ[
                  "GITHUB_ENV"
              ]
          )


          with open(
              github_env,
              "a",
              encoding="utf-8",
          ) as handle:

              for key in sorted(
                  resolved
              ):

                  value = (
                      resolved[
                          key
                      ]
                  )

                  handle.write(
                      f"{key}={value}\n"
                  )


          print(
              "========================================"
          )

          print(
              "FUND-100 NESTED READ-ONLY ARM RESOLUTION"
          )

          print(
              "========================================"
          )

          print(
              "Scheduled compiler arm: VERIFIED"
          )

          print(
              "LIVE read-only arm: VERIFIED"
          )

          print(
              "Broker kill switch: ENGAGED"
          )

          print(
              "Broker mutation performed: NO"
          )
          PY

      - name: Prove resolved arms survive into later steps
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          python - <<'PY'
          import fund100_alpaca_live_scheduled_compiler \
              as compiler

          import fund100_alpaca_live_readonly_smoke \
              as readonly


          compiler.require_compiler_arm()

          readonly.require_readonly_arm()


          print(
              "Scheduled compiler arm: PASS"
          )

          print(
              "LIVE read-only arm: PASS"
          )

          print(
              "Nested read-only prerequisites: PASS"
          )
          PY

      - name: Run V5-002 LIVE production controller
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

        run: |
          set -euo pipefail

          python fund100_live_production_controller_v1_0.py

      - name: Verify production status artifact
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path


          path = Path(
              "live_activation_outputs/v5_002/"
              "live_production_status_v1_0.json"
          )


          if not path.exists():

              raise SystemExit(
                  "STOP: production status artifact missing."
              )


          body = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          required = {
              "strategy":
                  "V5-002_SHADOW",

              "broker_environment":
                  "ALPACA_LIVE",

              "ordinary_drift_trading":
                  False,

              "leverage_allowed":
                  False,

              "shorting_allowed":
                  False,
          }


          for key, expected in (
              required.items()
          ):

              actual = (
                  body.get(
                      key
                  )
              )

              if actual != expected:

                  raise SystemExit(
                      "STOP: "
                      f"{key}: expected {expected!r}, "
                      f"got {actual!r}"
                  )


          print(
              "Production status artifact: VERIFIED"
          )

          print(
              "Controller status:",
              body.get(
                  "status"
              ),
          )

          print(
              "Orders submitted this run:",
              body.get(
                  "orders_submitted_this_run"
              ),
          )
          PY

      - name: Upload production status
        uses: actions/upload-artifact@v4
        with:
          name: fund100-live-production-status-${{ github.run_id }}
          path: live_activation_outputs/v5_002/live_production_status_v1_0.json
          retention-days: 30

      - name: Restore transient compiler and status files
        run: |
          set -euo pipefail

          git restore --worktree -- \
            live_dryrun_outputs/v5_002 \
            2>/dev/null || true

          git restore --worktree -- \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            2>/dev/null || true

          if git ls-files --error-unmatch \
            live_activation_outputs/v5_002/live_production_status_v1_0.json \
            >/dev/null 2>&1; then

            true

          else

            rm -f \
              live_activation_outputs/v5_002/live_production_status_v1_0.json

          fi

      - name: Commit completed LIVE event ledger if changed
        run: |
          set -euo pipefail

          if [ ! -d \
            live_activation_outputs/v5_002/live_production_events ]; then

            echo "No completed production event to commit."
            exit 0

          fi

          git config user.name \
            "fund100-production-bot"

          git config user.email \
            "fund100-production-bot@users.noreply.github.com"

          git add \
            live_activation_outputs/v5_002/live_production_events

          if git diff --cached --quiet; then

            echo "No new completed LIVE event evidence."
            exit 0

          fi

          git commit -m \
            "Record completed V5-002 LIVE production event"

          git pull --rebase origin main

          git push origin HEAD:main

      - name: Final production summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 V5-002 LIVE PRODUCTION RUN COMPLETE"
          echo "========================================"
          echo "Strategy: V5-002"
          echo "Environment: ALPACA LIVE"
          echo "Bootstrap: COMPLETE"
          echo "Scheduled compiler arm: VERIFIED"
          echo "LIVE read-only arm: VERIFIED"
          echo "Scheduled compiler: CURRENT / V1.1"
          echo "Frozen 2.5% threshold: PRESERVED"
          echo "Ordinary drift trading: FALSE"
          echo "Position-aware execution: TRUE"
          echo "SELL before BUY: ENFORCED"
          echo "Fresh broker reconstruction: ENFORCED"
          echo "Deterministic client IDs: ENFORCED"
          echo "Cumulative pilot ceiling: ENFORCED"
          echo "Leverage allowed: FALSE"
          echo "Shorting allowed: FALSE"
          echo "Additional deposits automatically usable: FALSE"
