name: Fund-100 ETF Paper Rehearsal (no broker)

on:
  push:
    branches: [main]
    paths:
      - "fund100_etf_paper_rehearsal_v1_0.py"
      - "test_fund100_etf_paper_rehearsal_v1_0.py"
      - "fund100_live_production_controller_v1_0.py"
      - "fund100_live_portfolio_risk_v1_0.py"
      - "fund100_live_risk_sizing_v1_0.py"
      - ".github/workflows/fund100-etf-paper-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-etf-paper-rehearsal
  cancel-in-progress: true

jobs:
  synthetic-rehearsal:
    name: ETF risk-aware SELL / BUY paper acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_RISK_LEVEL: HIGH
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the complete paper acceptance suite
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_etf_paper_rehearsal_v1_0.py

      - name: Execute paper rehearsal and save synthetic report
        run: |
          set -euo pipefail
          python fund100_etf_paper_rehearsal_v1_0.py > synthetic_etf_rehearsal.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("synthetic_etf_rehearsal.json").read_text())
          assert r["status"] == "SUCCESS"
          assert r["mode"] == "OFFLINE_SYNTHETIC_PAPER"
          assert r["unmocked_broker_requests"] == 0
          assert r["replay_duplicate_orders"] == 0
          assert r["order_count"] == 2
          print("Fund-100 synthetic ETF paper run: PASS")
          print("Synthetic orders:", r["order_count"])
          print("Duplicate synthetic fills:", r["replay_duplicate_orders"])
          print("Alpaca requests:", r["unmocked_broker_requests"])
          PY

      - name: Upload synthetic proof only (no account data)
        uses: actions/upload-artifact@v4
        with:
          name: fund100-etf-paper-rehearsal
          path: synthetic_etf_rehearsal.json
          retention-days: 14
