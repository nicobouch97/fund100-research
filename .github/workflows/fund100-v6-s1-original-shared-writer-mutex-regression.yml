name: Fund-100 Original ACWI Shared LIVE Writer Mutex (NO BROKER)
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-v6-s1-original-acwi-one-attempt-locked.yml"
      - "release_candidates/fund100-v6-s1-original-first-acwi-funded-once.REVIEW-ONLY.yml"
      - "test_fund100_v6_s1_original_single_writer_mutex_v1_0.py"
      - "test_fund100_v6_s1_original_acwi_one_attempt_workflow_locked_v1_0.py"
      - "test_fund100_v6_s1_original_first_acwi_funded_workflow_blueprint_v1_0.py"
      - ".github/workflows/fund100-v6-s1-original-shared-writer-mutex-regression.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-v6-s1-original-acwi-one-attempt-locked.yml"
      - "release_candidates/fund100-v6-s1-original-first-acwi-funded-once.REVIEW-ONLY.yml"
      - "test_fund100_v6_s1_original_single_writer_mutex_v1_0.py"
      - ".github/workflows/fund100-v6-s1-original-shared-writer-mutex-regression.yml"
permissions:
  contents: read
jobs:
  verify-original-first-acwi-shared-mutex-with-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check first funded ACWI shared writer lock, STOP, and blueprint gates
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_s1_original_single_writer_mutex_v1_0.py \
            test_fund100_v6_s1_original_acwi_one_attempt_workflow_locked_v1_0.py \
            test_fund100_v6_s1_original_first_acwi_funded_workflow_blueprint_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          echo 'Original ACWI and V5 share the real account writer mutex; no order authorisation.'
