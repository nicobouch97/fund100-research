name: Fund-100 V6 Recurring Signed CAS Transport (OFFLINE TESTS; NO BROKER)

# Fast targeted check for real HTTP adapter using injected fake GitHub
# responses only. No GitHub write permissions or protected secrets.
on:
  pull_request:
    paths:
      - "fund100_v6_recurring_real_cas_transport_locked_v1_0.py"
      - "test_fund100_v6_recurring_real_cas_transport_locked_v1_0.py"
      - ".github/workflows/fund100-v6-recurring-real-cas-transport-regressions.yml"

permissions:
  contents: read

jobs:
  exact-signed-conditional-put-fake-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test signed HMAC first event CAS, single PUT and no retries under STOP
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v6_recurring_real_cas_transport_locked_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
