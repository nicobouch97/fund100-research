name: Fund-100 V6-S1 Locked Fractional LIVE SELL Candidate (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py"
      - "test_fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py"
      - "research_lab/V6_S1_PRE_REG_FRACTIONAL_LIVE_SELL_TRANSPORT_HARD_LOCKED_2026_10_19.md"
      - ".github/workflows/fund100-v6-s1-fractional-sell-writer-locked.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-only-broker-shaped-sell-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pure test runner
        run: python -m pip install 'pytest>=8,<9'
      - name: Check strict V6 fractional SELL shape, existing order recovery and original S1 stages
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_s1_frac_live_sell_writer_candidate_v1_0.py
          python -m pytest -q test_fund100_v6_s1_staged_controller_core_v1_0.py
          python -m pytest -q test_fund100_alpaca_live_writer_candidate_v1_1.py
      - name: Hard locks and operator STOP unchanged
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python - <<'PY'
          import fund100_v6_s1_frac_live_sell_writer_candidate_v1_0 as w
          import fund100_alpaca_live_writer_candidate_v1_1 as old
          assert not w.TRANSPORT_RELEASED and not w.PUBLIC_EXECUTION_ENABLED
          assert not old.TRANSPORT_RELEASED and not old.PUBLIC_EXECUTION_ENABLED
          for name in w.LEGACY_TO_EXIT:
              p=w.inspect_sell_shape(symbol=name,original_qty='0.123456789')
              assert p['side']=='sell' and p['time_in_force']=='day'
              assert 'notional' not in p
          print('V6-S1 fractional SELL transport HARD LOCKED. NO credentials or broker requests.')
          PY
