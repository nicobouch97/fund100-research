name: Fund-100 V6-S1 Public Genesis Witness, NO PRODUCTION LEDGER (OFFLINE)

on:
  pull_request:
    paths:
      - "research_lab/V6_S1_INITIAL_PUBLIC_LEDGER_GENESIS_WITNESS_2026_10_21.json"
      - "research_lab/V6_S1_PUBLIC_EXTERNAL_GENESIS_WITNESS_PROTOCOL_2026_10_21.md"
      - "fund100_v6_s1_public_genesis_witness_v1_0.py"
      - "test_fund100_v6_s1_public_genesis_witness_v1_0.py"
      - ".github/workflows/fund100-v6-s1-public-genesis-witness-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-pinned-genesis-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only pytest for offline signed-genesis compatibility
        run: python -m pip install 'pytest>=8,<9'
      - name: Verify original witnessed LIVE account source, SHA and synthetic HMAC
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_v6_s1_public_genesis_witness_v1_0.py \
            test_fund100_v6_s1_private_git_cas_protocol_v1_0.py \
            test_fund100_v6_s1_private_production_ledger_getonly_preflight_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
      - name: Output categorical public-genesis readiness only
        run: |
          set -euo pipefail
          python fund100_v6_s1_public_genesis_witness_v1_0.py \
            > /tmp/fund100-v6-s1-public-genesis-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/fund100-v6-s1-public-genesis-readiness.json').read_text())
          assert x['original_live_four_get_run']==39621888269
          assert not x['private_state_genesis_created']
          assert not x['independent_continuity_head_anchor_complete']
          assert not x['live_orders_authorized']
          assert x['broker_requests']==x['github_write_requests']==0
          print('Original public nonce witness is SOURCE-PINNED. NO production ledger created.')
          PY
