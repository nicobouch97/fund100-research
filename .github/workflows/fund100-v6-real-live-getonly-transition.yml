name: Fund-100 V6 ACTUAL LIVE GET-only Account Transition Check (NO ORDERS)

on:
  pull_request:
    paths:
      - "fund100_v6_real_live_getonly_transition_readiness_v1_0.py"
      - "test_fund100_v6_real_live_getonly_transition_readiness_v1_0.py"
      - ".github/workflows/fund100-v6-real-live-getonly-transition.yml"
      - "research_lab/V6_ACTUAL_LIVE_ACCOUNT_READINESS_PROTOCOL_2026_10_18.md"
  push:
    branches: [main]
    paths:
      - "fund100_v6_real_live_getonly_transition_readiness_v1_0.py"
      - ".github/workflows/fund100-v6-real-live-getonly-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v6-getonly-real-broker-transition
  cancel-in-progress: false

jobs:
  privacy-and-source-tests:
    name: Source-bound private response contract, without broker credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'pytest>=8,<9'
      - name: Verify actual original BOOT/POLICY/STOP contracts with fabricated quotes
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v6_real_live_getonly_transition_readiness_v1_0.py

  current-live-getonly:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: privacy-and-source-tests
    name: LIVE account direct GET only; private numbers never printed
    runs-on: ubuntu-latest
    environment: fund100-live-broker
    timeout-minutes: 8
    env:
      FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}
      FUND100_RISK_LEVEL: ${{ vars.FUND100_RISK_LEVEL }}
      FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove exact source contains no order or non-GET paths
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path("fund100_v6_real_live_getonly_transition_readiness_v1_0.py").read_text()
          tree=ast.parse(source)
          # All actual Alpaca requests flow through the imported read-only
          # Alpaca implementation and exactly four fixed GET endpoints.
          assert 'live.get_json(' in source
          assert not any(x in source for x in (
              "live.live_request(", "urlopen(", "method=\"POST\"",
              "method='POST'", "submit_order(", "place_order(",
              "requests.post(", "requests.delete("
          ))
          print("GET ONLY / NO order executor imported, no brokerage output artifact.")
          PY
      - name: Authenticate via existing LIVE env and check four positions (GET only)
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: |
          set -euo pipefail
          python fund100_v6_real_live_getonly_transition_readiness_v1_0.py
      - name: Confirm no trading controls changed
        run: |
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          echo "V6 real-account transition inspection finished; no orders, no exposure changes."
