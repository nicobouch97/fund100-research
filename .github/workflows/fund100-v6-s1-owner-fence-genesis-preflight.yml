name: Fund-100 V6-S1 Owner Fence Genesis Preflight (NO WRITES)

on:
  pull_request:
    paths:
      - "fund100_v6_s1_owner_fence_genesis_preflight_offline_v1_0.py"
      - "test_fund100_v6_s1_owner_fence_genesis_preflight_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-owner-fence-genesis-preflight.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v6_s1_owner_fence_genesis_preflight_offline_v1_0.py"
      - "test_fund100_v6_s1_owner_fence_genesis_preflight_offline_v1_0.py"
      - ".github/workflows/fund100-v6-s1-owner-fence-genesis-preflight.yml"

permissions:
  contents: read

jobs:
  offline-genesis-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Signed original empty ledger and two-view unclaimed owner fence preflight
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q \
            test_fund100_v6_s1_owner_fence_genesis_preflight_offline_v1_0.py \
            test_fund100_v6_s1_acwi_unique_owner_fence_offline_v1_0.py \
            test_fund100_v6_s1_independent_signed_genesis_recovery_getonly_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
