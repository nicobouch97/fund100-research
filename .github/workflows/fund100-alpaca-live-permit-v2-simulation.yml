name: Fund-100 Alpaca LIVE Permit V2 Simulation

on:
  workflow_dispatch:
    inputs:
      simulated_approval:
        description: "Simulate the future manual-approval condition"
        required: true
        default: "YES"
        type: choice
        options:
          - "YES"
          - "NO"

permissions:
  contents: write

concurrency:
  group: fund100-alpaca-live-permit-v2-simulation
  cancel-in-progress: false

jobs:
  permit-v2-simulation:
    name: Simulate Future LIVE Permit Contract

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify simulation files
        run: |
          set -euo pipefail

          test -f fund100_alpaca_live_permit_v2_simulator.py
          test -f test_fund100_alpaca_live_permit_v2_simulator.py

          test -f fund100_alpaca_live_readonly_smoke.py
          test -f fund100_alpaca_live_preflight.py
          test -f fund100_broker_safety.py

          test -f live_dryrun_outputs/v5_002/scheduled_execution_time.json

          echo "V2 permit simulation dependencies found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Simulate future V2 LIVE permit
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_ENABLE_LIVE_READONLY: YES_READ_ONLY_LIVE

          FUND100_ENABLE_LIVE_PERMIT_V2_SIMULATION: YES_SIMULATE_LIVE_PERMIT_V2

          FUND100_SIMULATED_MANUAL_APPROVAL: ${{ inputs.simulated_approval }}

        run: |
          set -euo pipefail
          python fund100_alpaca_live_permit_v2_simulator.py

      - name: Check V2 simulation artifact
        id: simulation_check
        shell: bash
        run: |
          set -euo pipefail

          CHANGES="$(git status --porcelain -- live_dryrun_outputs/v5_002/live_execution_permit_v2_simulation.json)"

          if [ -z "$CHANGES" ]; then

            echo "V2 simulation artifact unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "V2 simulation artifact changed:"
            echo "$CHANGES"

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit V2 simulation artifact
        if: steps.simulation_check.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "fund100-live-dryrun-bot"
          git config user.email "fund100-live-dryrun-bot@users.noreply.github.com"

          git add live_dryrun_outputs/v5_002/live_execution_permit_v2_simulation.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit \
            -m "Update V5-002 live permit V2 simulation"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 LIVE PERMIT V2 SIMULATION DONE"
          echo "========================================"
          echo "Simulation only: TRUE"
          echo "Permit issued: FALSE"
          echo "Live execution authorized: FALSE"
          echo "Maximum live execution notional: \$0.00"
          echo "Writer connected: FALSE"
          echo "Orders submitted: 0"
