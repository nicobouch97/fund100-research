name: Fund-100 V7 X9 S1 Delayed Risk Maintenance (NO BROKER)

on:
  pull_request:
    paths:
      - 'fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py'
      - 'test_fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py'
      - 'research_lab/V7_X9_PREDECLARED_NEXT_CLOSE_S1_RISK_REPAIR_2026_10_26.md'
      - '.github/workflows/fund100-v7-x9-delayed-risk-maintenance.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py'
      - 'test_fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py'
      - '.github/workflows/fund100-v7-x9-delayed-risk-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-frozen-costed-next-session-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify source, next-close execution, costs and no broker
        run: |
          set -euo pipefail
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          python -m pytest -q test_fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py
          python fund100_v7_x9_next_close_s1_risk_maintenance_v1_0.py --output /tmp/fund100-v7-x9-delayed-risk-only.json
          python - <<'PY'
          import json
          from pathlib import Path
          import fund100_v7_x9_next_close_s1_risk_maintenance_v1_0 as x
          result=json.loads(Path('/tmp/fund100-v7-x9-delayed-risk-only.json').read_text())
          assert result['schema']==x.SCHEMA
          assert result['original_live_usd_capital_ceiling_unchanged']=='130.30'
          assert set(result['results'])==set(result['pilot_sized_results'])=={'5','15','35'}
          assert all(set(p)==set(x.WINDOWS) for p in result['results'].values())
          assert all(set(p)==set(x.WINDOWS) for p in result['pilot_sized_results'].values())
          assert result['original_100usd_research_comparator_preserved'] is True
          assert result['fixed_one_dollar_minimum_is_absolute_not_a_portfolio_percentage'] is True
          assert result['broker_gets']==result['broker_posts']==result['broker_orders']==0
          assert result['live_authorized'] is False
          for label,cohorts,expected in (
              ('original',result['results'],100.0),
              ('pilot',result['pilot_sized_results'],130.30)):
              for windows in cohorts.values():
                  for p in windows.values():
                      assert p['model_starting_capital_usd']==expected,(label,p)
                      assert p['modeled_minimum_sell_notional_usd']==1.0
                      assert p['actual_broker_orders']==0
                      for leg in p['trade_log']:
                          assert leg['signal_session']<leg['execution_session']
          print('Original frozen source, next-close-only sell decisions, no trading authority.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fund100-v7-x9-source-frozen-risk-repairs-${{ github.run_id }}
          path: /tmp/fund100-v7-x9-delayed-risk-only.json
          retention-days: 90
          if-no-files-found: error
