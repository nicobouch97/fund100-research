name: Fund-100 V6 first ACWI Independent Risk PASS Admission (OFFLINE ONLY)

on:
  pull_request:
    paths:
      - 'fund100_live_risk_watch_admission_getonly_v1_0.py'
      - 'test_fund100_live_risk_watch_admission_getonly_v1_0.py'
      - 'fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py'
      - 'fund100_v6_s1_original_one_attempt_chain_locked_v1_0.py'
      - 'test_fund100_v6_s1_original_one_attempt_chain_locked_v1_0.py'
      - 'fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py'
      - 'test_fund100_v6_s1_original_first_funded_entry_to_chain_offline_v1_0.py'
      - '.github/workflows/fund100-v6-first-acwi-risk-admission-offline.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_live_risk_watch_admission_getonly_v1_0.py'
      - 'test_fund100_live_risk_watch_admission_getonly_v1_0.py'
      - 'fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py'
      - 'fund100_v6_s1_original_one_attempt_chain_locked_v1_0.py'
      - 'test_fund100_v6_s1_original_one_attempt_chain_locked_v1_0.py'
      - 'fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py'
      - 'test_fund100_v6_s1_original_first_funded_entry_to_chain_offline_v1_0.py'
      - '.github/workflows/fund100-v6-first-acwi-risk-admission-offline.yml'

permissions:
  contents: read

jobs:
  mock-only-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed V6 original ACWI risk admission offline tests (NO BROKER)
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pytest -q \
            test_fund100_live_risk_watch_admission_getonly_v1_0.py \
            test_fund100_v6_s1_original_first_acwi_entry_locked_v1_0.py \
            test_fund100_v6_s1_original_first_funded_entry_to_chain_offline_v1_0.py \
            test_fund100_v6_s1_original_one_attempt_chain_locked_v1_0.py \
            test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py
