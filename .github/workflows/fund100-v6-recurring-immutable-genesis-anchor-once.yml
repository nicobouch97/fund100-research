name: Fund-100 V6 Immutable Genesis Publisher Regression (RETIRED; NO RELEASE)

# The original protected main release POST on run 40884760157 was REJECTED.
# It is one-shot; never replay or rearm this release attempt. Retain
# credentialless PR regressions ONLY. No protected secrets, release mutation,
# private state mutation, trading or broker credentials are available here.
on:
  pull_request:
    paths:
      - ".github/workflows/fund100-v6-recurring-immutable-genesis-anchor-once.yml"
      - "fund100_v6_recurring_immutable_genesis_anchor_once_v1_0.py"
      - "test_fund100_v6_recurring_immutable_genesis_anchor_once_v1_0.py"

permissions:
  contents: read

jobs:
  credentialless-immutable-genesis-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fake immutable publisher only; no protected secrets or public mutation
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q test_fund100_v6_recurring_immutable_genesis_anchor_once_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
