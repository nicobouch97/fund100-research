name: Fund-100 V6 External Signed Risk Receipt HTTPS Ingress (MOCK ONLY)

on:
  pull_request:
    paths:
      - 'fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - '.github/workflows/fund100-v6-external-receipt-ingress-offline.yml'
  push:
    branches: [main]
    paths:
      - 'fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - 'test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py'
      - '.github/workflows/fund100-v6-external-receipt-ingress-offline.yml'

permissions:
  contents: read

jobs:
  exact-signed-risk-no-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fresh independently signed read-only proof and hard locks
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9' 'cryptography>=45,<47'
          python -m pytest -q test_fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py
          grep -Fq 'RECEIPT_INGRESS_RELEASED = False' fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py
          grep -Fq 'NO_TRADE_RELEASE = True' fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0.py
          ! grep -Fq 'fund100_v6_s1_external_signed_risk_receipt_ingress_v1_0' Dockerfile
