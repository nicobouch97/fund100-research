name: Fund-100 V5 PAPER Fill Probe — Offline Tests

on:
  push:
    branches: [main]
    paths:
      - "fund100_v5_connected_paper_fill_probe_v1_0.py"
      - "test_fund100_v5_connected_paper_fill_probe_v1_0.py"
      - ".github/workflows/fund100-v5-paper-fill-probe-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-v5-paper-fill-probe-offline
  cancel-in-progress: true

jobs:
  verify:
    name: Verify small ETF PAPER order and cleanup safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and test PAPER-only probe with mocked HTTP
        run: |
          set -euo pipefail
          python -m py_compile \
            fund100_v5_connected_paper_fill_probe_v1_0.py \
            test_fund100_v5_connected_paper_fill_probe_v1_0.py
          python -m pytest -q \
            test_fund100_v5_connected_paper_fill_probe_v1_0.py
