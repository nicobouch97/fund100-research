name: Fund-100 P4N Broad Official SEC Coverage (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "test_fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - ".github/workflows/fund100-p4n-broad-sec-coverage.yml"
  push:
    branches: [main]
    paths:
      - "fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "test_fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - ".github/workflows/fund100-p4n-broad-sec-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-p4n-broad-sec-coverage
  cancel-in-progress: false

jobs:
  broad-sec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify 24-company SEC identity and 16-company capture contract offline
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_stock_broad_sec_coverage_p4n_v1_0.py \
            test_fund100_stock_sec_source_p4b_v1_0.py \
            test_fund100_stock_sec_quality_p4a_v1_0.py \
            test_fund100_stock_broad_momentum_p4l_v1_0.py
      - name: Acquire current official SEC source for additional issuers (main only)
        id: capture
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SEC_USER_AGENT: ${{ secrets.FUND100_SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "SEC contact not configured; no anonymous request attempted."
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python fund100_stock_broad_sec_coverage_p4n_v1_0.py \
            --output-dir /tmp/fund100-p4n-original-sec
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/fund100-p4n-original-sec")
          report = json.loads((root / "manifest.json").read_text())
          assert report["new_issuers_captured"] == 16
          assert report["source_count"] == 32
          assert report["original_eight_ciks_checked_against_official_registry"]
          assert report["official_registry_sha256"] == hashlib.sha256(
              (root / "official-sec-ticker-registry.json").read_bytes()).hexdigest()
          assert report["broker_orders"] == 0
          assert not report["trading_authorized"] and not report["live_authorized"]
          assert not report["paper_authorized"] and not report["historic_stock_alpha_backtest_eligible"]
          for row in report["observations"]:
              assert not row["issuer_specific_gaap_mapping_reviewed"]
              assert not row["fundamental_quality_for_trading_approved"]
              for p in row["source_provenance"].values():
                  raw = (root / p["source_file"]).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == p["raw_sha256"]
          print("Original SEC source and generic descriptive coverage verified:",
                report["new_issuers_captured"], "new issuers;",
                report["new_issuers_generic_score_available"], "generic scores.")
          PY
          echo "acquired=true" >> "$GITHUB_OUTPUT"
      - name: Preserve original SEC bytes, source identities and missing coverage
        if: steps.capture.outputs.acquired == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-p4n-original-sec-16-new-issuers-${{ github.run_id }}
          path: /tmp/fund100-p4n-original-sec/
          retention-days: 90
          if-no-files-found: error
