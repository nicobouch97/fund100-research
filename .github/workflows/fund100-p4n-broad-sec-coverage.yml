name: Fund-100 P4N Broad Official SEC Coverage (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "test_fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "fund100_stock_broad_sec_annual_replay_p4q_v1_0.py"
      - "test_fund100_stock_broad_sec_annual_replay_p4q_v1_0.py"
      - "fund100_stock_sec_quality_forward_p4r_v1_0.py"
      - "fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py"
      - "test_fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py"
      - "test_fund100_stock_sec_quality_forward_p4r_v1_0.py"
      - "fund100_stock_sec_eps_yield_p4s_v1_0.py"
      - "test_fund100_stock_sec_eps_yield_p4s_v1_0.py"
      - ".github/workflows/fund100-p4n-broad-sec-coverage.yml"
  push:
    branches: [main]
    paths:
      - "fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "test_fund100_stock_broad_sec_coverage_p4n_v1_0.py"
      - "fund100_stock_broad_sec_annual_replay_p4q_v1_0.py"
      - "test_fund100_stock_broad_sec_annual_replay_p4q_v1_0.py"
      - "fund100_stock_sec_quality_forward_p4r_v1_0.py"
      - "fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py"
      - "test_fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py"
      - "test_fund100_stock_sec_quality_forward_p4r_v1_0.py"
      - "fund100_stock_sec_eps_yield_p4s_v1_0.py"
      - "test_fund100_stock_sec_eps_yield_p4s_v1_0.py"
      - ".github/workflows/fund100-p4n-broad-sec-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fund100-p4n-broad-sec-coverage
  cancel-in-progress: false

jobs:
  broad-sec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify 24-company SEC identity and 16-company capture contract offline
        run: |
          set -euo pipefail
          python -m pytest -q \
            test_fund100_stock_broad_sec_coverage_p4n_v1_0.py \
            test_fund100_stock_broad_sec_annual_replay_p4q_v1_0.py \
            test_fund100_stock_sec_quality_forward_p4r_v1_0.py \
            test_fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py \
            test_fund100_stock_sec_eps_yield_p4s_v1_0.py \
            test_fund100_stock_sec_source_p4b_v1_0.py \
            test_fund100_stock_sec_quality_p4a_v1_0.py \
            test_fund100_stock_broad_momentum_p4l_v1_0.py
      - name: Acquire current official SEC source for additional issuers (main only)
        id: capture
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          SEC_USER_AGENT: ${{ secrets.FUND100_SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "SEC contact not configured; no anonymous request attempted."
            echo "acquired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python fund100_stock_broad_sec_coverage_p4n_v1_0.py \
            --output-dir /tmp/fund100-p4n-original-sec
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/fund100-p4n-original-sec")
          report = json.loads((root / "manifest.json").read_text())
          assert report["new_issuers_captured"] == 16
          assert report["source_count"] == 32
          assert report["new_issuer_source_matched_scores_are_descriptive_not_trade_ready"]
          assert 0 <= report["new_issuers_source_matched_score_available"] <= 12
          assert 0 <= report["new_issuers_bank_diagnostics_available"] <= 1
          assert 0 <= report["new_issuers_sector_diagnostics_available"] <= 3
          assert report["original_eight_ciks_checked_against_official_registry"]
          assert report["drifted_original_eight_issuer_scores_not_joined_to_current_cik"]
          assert report["original_eight_registry_identity_all_match"] == (not report["original_eight_identity_drift_quarantined"])
          assert all(row["ticker"] not in {r["ticker"] for r in report["observations"]}
                     for row in report["original_eight_identity_drift_quarantined"])
          assert report["official_registry_sha256"] == hashlib.sha256(
              (root / "official-sec-ticker-registry.json").read_bytes()).hexdigest()
          assert report["broker_orders"] == 0
          assert not report["trading_authorized"] and not report["live_authorized"]
          assert not report["paper_authorized"] and not report["historic_stock_alpha_backtest_eligible"]
          for row in report["observations"]:
              assert not row["issuer_specific_gaap_mapping_reviewed"]
              assert not row["fundamental_quality_for_trading_approved"]
              q = row["source_matched_latest_10k_quality"]
              assert not q["for_trading_approved"] and not q["cross_sector_economics_reviewed"]
              if row["ticker"] in {"CVX", "JPM", "LLY", "NEE"}:
                  assert q["score"] is None
              if row["ticker"] == "JPM":
                  bank = q["bank_diagnostics"]
                  assert not bank["for_trading_approved"]
                  assert not bank["cross_sector_comparison_approved"]
                  assert bank["bank_specific_diagnostic_not_industrial_fcf_score"]
                  if bank["state"] == "BANK_LATEST_10K_DESCRIPTIVE_ONLY":
                      assert bank["net_revenue_identity_reconciled_both_years"]
                      assert bank["current_efficiency_ratio"] is not None
              if row["ticker"] in {"CVX", "LLY", "NEE"}:
                  sector = q["sector_diagnostics"]
                  assert not sector["for_trading_approved"]
                  assert not sector["cross_sector_comparison_approved"]
                  assert not sector["industrial_fcf_score_computed"]
                  if sector["state"] == "SECTOR_LATEST_10K_DESCRIPTIVE_ONLY":
                      assert sector["metrics"] is not None
                      assert sector["current_and_prior_from_same_accession"]
              if q["score"] is not None:
                  assert q["state"] == "SOURCE_MATCHED_LATEST_10K_DESCRIPTIVE_ONLY"
                  assert q["latest_10k_accession"] and q["comparative_from_same_latest_accession"]
              for p in row["source_provenance"].values():
                  raw = (root / p["source_file"]).read_bytes()
                  assert hashlib.sha256(raw).hexdigest() == p["raw_sha256"]
          print("Original SEC source and generic descriptive coverage verified:",
                report["new_issuers_captured"], "new issuers;",
                report["new_issuers_generic_score_available"], "generic scores;",
                report["new_issuers_source_matched_score_available"], "source-matched descriptive scores;",
                "original-eight CIK drift quarantined:",
                [r["ticker"] for r in report["original_eight_identity_drift_quarantined"]])
          PY
          echo "acquired=true" >> "$GITHUB_OUTPUT"
      - name: Reconstruct dated 10-K accession quality without future filings or trades
        if: steps.capture.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          python fund100_stock_broad_sec_annual_replay_p4q_v1_0.py \
            --source-dir /tmp/fund100-p4n-original-sec \
            --output /tmp/fund100-p4n-original-sec/annual-accession-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/fund100-p4n-original-sec/annual-accession-replay.json").read_text())
          assert d["new_issuers_verified"] == 16
          assert d["industrial_issuer_chronologies"] == 12
          assert len(d["sector_specific_issuers_not_replayed"]) == 4
          assert d["original_accession_and_filed_day_used"]
          assert d["today_retrieved_companyfacts_not_original_historical_capture"]
          assert d["issuer_roster_selected_with_2026_knowledge"]
          s=d["industrial_annual_score_stability"]
          assert s["method"]=="ADJACENT_ORIGINAL_10K_SCORE_PAIRS_NO_MISSING_BACKFILL"
          assert sum(s["score_observation_distribution"].values()) == d["industrial_annual_scores_available"]
          assert s["adjacent_annual_pairs_with_both_scores"] == (
              s["unchanged_score_pairs"] + s["improved_score_pairs"]
              + s["deteriorated_score_pairs"])
          assert s["adjacent_annual_pairs_with_both_scores"] + s["adjacent_annual_pairs_with_missing_score"] <= d["industrial_annual_filing_dates_reviewed"]
          assert s["score_persistence_is_not_stock_return_predictiveness"]
          assert s["source_retrieved_today_not_independent_historical_vintage"]
          assert not d["historical_investable_backtest_eligible"]
          assert not d["independent_alpha_validated"]
          assert not d["trading_authorized"] and not d["paper_authorized"]
          assert not d["live_authorized"]
          assert d["broker_requests"] == d["broker_orders"] == 0
          print("Dated SEC original-accession quality replay:",
                d["industrial_annual_scores_available"], "available scores from",
                d["industrial_annual_filing_dates_reviewed"], "reviewed annual dates")
          print("Adjacent scored annual pairs",s["adjacent_annual_pairs_with_both_scores"],
                "unchanged",s["unchanged_score_pairs"],
                "improved",s["improved_score_pairs"],
                "deteriorated",s["deteriorated_score_pairs"],
                "missing pairs",s["adjacent_annual_pairs_with_missing_score"])
          PY
      - name: Match dated original 10-K scores to 126-session historical stock outcomes (not alpha)
        if: steps.capture.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          python fund100_stock_sec_quality_forward_p4r_v1_0.py \
            --source-dir /tmp/fund100-p4n-original-sec \
            --output /tmp/fund100-p4n-original-sec/quality-126-session-event-study.json \
            --output-prices-csv /tmp/fund100-p4n-original-sec/original-revisable-historical-adjusted-prices.csv \
            --output-rates-csv /tmp/fund100-p4n-original-sec/original-revisable-irx-bill-discount-quotes.csv
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("/tmp/fund100-p4n-original-sec")
          d=json.loads((root/"quality-126-session-event-study.json").read_text())
          raw=(root/"original-revisable-historical-adjusted-prices.csv").read_bytes()
          assert hashlib.sha256(raw).hexdigest()==d["source_prices_canonical_csv_sha256"]
          irx=(root/"original-revisable-irx-bill-discount-quotes.csv").read_bytes()
          assert hashlib.sha256(irx).hexdigest()==d["cash_rate_source_canonical_sha256"]
          assert d["cash_rate_source"]=="YAHOO_IRX_13W_BILL_DISCOUNT_PROXY"
          assert d["cash_rate_lag_weekdays"]==3
          assert d["cash_rate_is_revisable_vendor_quote_not_archived_historical_vintage"]
          assert d["cash_rate_not_actual_broker_interest_or_executable_rolled_bill"]
          assert d["zero_cash_baseline_preserved"]
          assert d["schema"].endswith("_V6")
          assert set(d["costed_six_slot_spy_idle_capital_overlay"])=={"5","15","35"}
          for cost,overlay in d["costed_six_slot_spy_idle_capital_overlay"].items():
              original=d["costed_six_slot_overlap_replay"][cost]
              assert overlay["admitted_events"]==original["admitted_events"]
              assert overlay["peak_concurrent_positions"]==original["peak_concurrent_positions"]
              assert overlay["all_spy_to_stock_and_stock_to_spy_switches_costed"]
              assert overlay["original_admissions_reused_without_refitting_thresholds"]
              assert overlay["not_a_validated_point_in_time_survivorship_free_strategy"]
              assert overlay["not_risk_matched_to_low_equity_cash_portfolio"]
              assert overlay["research_only_no_broker_or_live_authority"]
              risk=overlay["paired_realized_active_risk"]
              assert risk["method"]=="REALIZED_PAIRED_DAILY_ACTIVE_RISK_NOT_PREDICTIVE_ALPHA"
              assert risk["daily_return_observations"]>1000
              assert risk["realized_annual_tracking_error_pct"]>=0
              assert risk["overlay_realized_annual_volatility_pct"]>=0
              assert risk["passive_realized_annual_volatility_pct"]>=0
              assert risk["maximum_relative_wealth_drawdown_pct"]<=0
              assert risk["fees_included_in_both_nav_paths"]
              assert risk["in_sample_survivor_selected_no_significance_or_alpha_claim"]
          deletion=d["spy_overlay_fixed_admission_issuer_deletion_15bps"]
          base=d["costed_six_slot_spy_idle_capital_overlay"]["15"]
          assert deletion["method"]=="FIXED_ADMISSIONS_WHOLE_ISSUER_DELETION_SPY_FUNDED_15BPS"
          assert deletion["all_issuers_admitted_events"]==base["admitted_events"]
          assert deletion["all_issuers_baseline_cagr_advantage_pp"]==base["replacement_minus_passive_cagr_pp"]
          assert deletion["distinct_admitted_issuers"]==len(deletion["per_excluded_issuer"])
          assert sum(v["removed_admitted_events"] for v in deletion["per_excluded_issuer"].values())==base["admitted_events"]
          values=[v["replacement_minus_passive_cagr_pp"] for v in deletion["per_excluded_issuer"].values()]
          assert deletion["exclusion_advantage_range_pp"]==([min(values),max(values)] if values else None)
          assert deletion["exclusions_with_positive_cagr_advantage"]+deletion["exclusions_with_nonpositive_cagr_advantage"]==len(values)
          assert deletion["removed_positions_remain_in_spy_no_replacement_signals"]
          assert deletion["identical_passive_spy_benchmark_and_transaction_costs"]
          assert deletion["retrospective_deletion_not_investable_issuer_selection"]
          assert deletion["survivor_universe_and_revisable_prices_preclude_alpha"]
          assert deletion["not_a_confidence_interval_or_independent_holdout"]
          assert deletion["research_only_no_broker_or_live_authority"]
          print("15bp fixed-admission issuer-deletion fragility:", deletion)
          print("15bp SPY-funded stock replacement vs fully invested passive SPY:",
                d["costed_six_slot_spy_idle_capital_overlay"]["15"])
          assert set(d["costed_six_slot_cash_carry_sensitivity"])=={"5","15","35"}
          for cost in ("5","15","35"):
              original=d["costed_six_slot_overlap_replay"][cost]
              scenarios=d["costed_six_slot_cash_carry_sensitivity"][cost]
              assert set(scenarios)=={"IRX_GROSS","IRX_MINUS_50BP"}
              for label,row in scenarios.items():
                  assert row["admitted_events"]==original["admitted_events"]
                  assert row["cash_accrual_uses_prior_session_rate_and_actual_calendar_days"]
                  assert not row["cash_yield_assumed_zero_not_a_historical_bill_benchmark"]
                  assert row["no_broker_or_trading_authority"]
          print("15bp cash-carry sensitivity:",{
              k: {"stock_cagr":v["stock"]["net_cagr_pct"],
                  "paired_spy_cagr":v["same_entry_dollar_matched_spy"]["net_cagr_pct"],
                  "stock_minus_spy_cagr":v["stock_minus_paired_spy_cagr_pp"]}
              for k,v in d["costed_six_slot_cash_carry_sensitivity"]["15"].items()})
          assert d["predeclared_forward_sessions"]==126
          assert d["cost_per_side_bps"]==[5,15,35]
          assert 0 <= d["completed_event_returns"] <= d["original_annual_scores"]
          assert (d["completed_event_returns"] + d["right_censored_eligible_scores"]
                  + d["left_censored_eligible_scores"] + d["scores_without_future_entry_close"]
                  <= d["original_annual_scores"])
          assert d["retrospectively_selected_2026_survivors"]
          assert d["SEC_facts_retrieved_today_not_historical_vintages"]
          assert d["vendor_adjusted_prices_revisable_and_corporate_actions_not_independently_verified"]
          assert d["no_point_in_time_investable_backtest"]
          assert d["not_a_self_financing_portfolio_or_validated_alpha"]
          assert not d["trading_authorized"] and not d["paper_authorized"] and not d["live_authorized"]
          assert d["broker_requests"]==d["broker_orders"]==0
          print("Matched SEC event outcomes:",d["completed_event_returns"],
                "right-censored:",d["right_censored_eligible_scores"],
                "left-censored:",d["left_censored_eligible_scores"])
          print("Score >=2 15bp matched SPY:",d["summary"]["15"]["score_2_or_3"])
          print("Score <2 15bp matched SPY:",d["summary"]["15"]["score_0_or_1"])
          assert set(d["issuer_balanced_sensitivity"]) == {"5","15","35"}
          for bps, diag in d["issuer_balanced_sensitivity"].items():
              assert diag["method"] == "ISSUER_EQUAL_WEIGHT_WITH_WHOLE_ISSUER_DELETION"
              assert diag["deletion_range_is_not_a_confidence_interval"]
              assert diag["survivorship_and_overlapping_outcomes_preclude_alpha_inference"]
              for group in ("score_0_or_1", "score_2_or_3"):
                  assert diag[group]["distinct_issuers"] == d["summary"][bps][group]["distinct_issuers"]
                  assert diag[group]["distinct_issuers"] == len(diag[group]["per_issuer_mean_stock_minus_spy_pp"])
              values=list(diag["leave_one_issuer_out_gap_pp"].values())
              assert diag["leave_one_issuer_out_evaluable_exclusions"] == len(values)
              assert diag["leave_one_issuer_out_gap_range_pp"] == ([min(values),max(values)] if values else None)
          print("15bp issuer-balanced quality sensitivity:",
                d["issuer_balanced_sensitivity"]["15"])
          assert d["predeclared_pre_filing_momentum_sessions"] == 126
          assert d["pre_filing_momentum_threshold_pp"] == 0
          assert set(d["quality_by_pre_filing_relative_momentum"]) == {"5","15","35"}
          for event in d["event_returns"]:
              last = event["pre_filing_momentum_last_close"]
              first = event["pre_filing_momentum_first_close"]
              if last is None:
                  assert first is None
                  assert event["pre_filing_relative_momentum_positive"] is None
                  assert event["pre_filing_126_session_stock_minus_spy_pp"] is None
              else:
                  assert first < last < event["conservative_available_date"]
                  assert event["pre_filing_relative_momentum_positive"] is not None
          for bps, cells in d["quality_by_pre_filing_relative_momentum"].items():
              assert cells["all_completed_events_accounted"]
              assert cells["momentum_uses_only_closes_strictly_before_filing_day"]
              assert cells["no_threshold_search_or_fitted_allocation"]
              assert cells["no_independent_alpha_or_statistical_significance_claim"]
              assert cells["unavailable_lookback_events"] == d["missing_pre_filing_momentum_lookback_events"]
              assert (cells["positive_relative_momentum"]["events"]
                      + cells["nonpositive_relative_momentum"]["events"]
                      + cells["unavailable_lookback_events"] == d["completed_event_returns"])
              for side in ("positive_relative_momentum","nonpositive_relative_momentum"):
                  cell=cells[side]
                  assert cell["score_0_or_1"]["events"] + cell["score_2_or_3"]["events"] == cell["events"]
                  assert cell["issuer_balanced_sensitivity"]["deletion_range_is_not_a_confidence_interval"]
          print("15bp pre-filing momentum x SEC quality:",
                d["quality_by_pre_filing_relative_momentum"]["15"])
          print("RETROSPECTIVE SURVIVORS, NOT A VALIDATED INVESTABLE BACKTEST")
          PY
      - name: Test SEC event advantage persistence across calendar regimes (no orders)
        if: steps.capture.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          python fund100_stock_sec_quality_calendar_regimes_p4ab_v1_0.py \
            --source-p4r-report /tmp/fund100-p4n-original-sec/quality-126-session-event-study.json \
            --output /tmp/fund100-p4n-original-sec/quality-calendar-regime-fragility.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/fund100-p4n-original-sec/quality-calendar-regime-fragility.json")
          v=json.loads(p.read_text())
          original=json.loads(Path("/tmp/fund100-p4n-original-sec/quality-126-session-event-study.json").read_text())
          assert v["all_event_panel"]["events"]==original["completed_event_returns"]
          assert sum(x["all_scored"]["events"] for x in v["calendar_regime_panels"].values())==original["completed_event_returns"]
          assert v["calendar_years_with_positive_mean"]+v["calendar_years_with_nonpositive_mean"]==v["calendar_years_with_eligible_events"]
          assert v["original_p4r_event_rows_reused_without_new_selection"]
          assert v["issuer_set_selected_with_future_2026_information"]
          assert v["outcomes_overlapping_across_issuers_are_not_independent"]
          assert not v["promotable_new_strategy"] and not v["live_order_authorized"]
          assert v["broker_posts"]==v["broker_gets"]==0
          screen=v["within_year_quality_discrimination"]
          assert screen["screen_is_not_independent_alpha_or_trade_authorization"]
          assert screen["predeclared_min_comparable_calendar_years_for_triage"]==4
          assert not screen["live_trading_authorized"]
          assert (screen["qualifying_calendar_years_positive_gap"]
                  + screen["qualifying_calendar_years_nonpositive_gap"]
                  == screen["calendar_years_with_at_least_two_distinct_issuers_per_disjoint_group"])
          print("SEC 15bps matched-SPY calendar annual fragility",
                v["calendar_year_mean_excess_pp"],
                "quality group years",v["high_quality_panel"]["distinct_entry_calendar_years"])
          print("QUALITY WITHIN-YEAR DESCRIPTIVE SCREEN",screen["descriptive_quality_screen"])
          print("QUALIFYING YEARS",screen["calendar_years_with_at_least_two_distinct_issuers_per_disjoint_group"],
                "REGIMES",screen["qualifying_calendar_regimes_represented"],
                "POSITIVE/NONPOSITIVE",
                screen["qualifying_calendar_years_positive_gap"],
                screen["qualifying_calendar_years_nonpositive_gap"],
                "YEAR-EQUAL GAP pp",screen["qualifying_year_equal_quality_gap_pp"])
          print("Historical survivor-selection restriction: never promote this to LIVE.")
          PY
      - name: Research original SEC diluted EPS yield versus prior momentum (not alpha)
        if: steps.capture.outputs.acquired == 'true'
        run: |
          set -euo pipefail
          python fund100_stock_sec_eps_yield_p4s_v1_0.py \
            --source-dir /tmp/fund100-p4n-original-sec \
            --event-report /tmp/fund100-p4n-original-sec/quality-126-session-event-study.json \
            --output /tmp/fund100-p4n-original-sec/gaap-eps-yield-event-diagnostic.json \
            --raw-close-csv /tmp/fund100-p4n-original-sec/raw-vendor-split-adjusted-close.csv \
            --split-factors-csv /tmp/fund100-p4n-original-sec/raw-vendor-stock-splits.csv
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("/tmp/fund100-p4n-original-sec")
          d=json.loads((root/"gaap-eps-yield-event-diagnostic.json").read_text())
          p4r=json.loads((root/"quality-126-session-event-study.json").read_text())
          assert d["completed_events"] == p4r["completed_event_returns"]
          raw_close=(root/"raw-vendor-split-adjusted-close.csv").read_bytes()
          raw_splits=(root/"raw-vendor-stock-splits.csv").read_bytes()
          assert hashlib.sha256(raw_close+raw_splits).hexdigest() == d["raw_vendor_market_csv_sha256"]
          assert d["original_eps_available"] <= d["completed_events"]
          assert d["predeclared_positive_earnings_yield_threshold"] == 0.05
          assert d["comparison_cost_per_side_bps"] == 15
          assert d["no_historical_investable_backtest_or_validated_alpha"]
          assert d["reconstructed_yahoo_close_and_splits_not_independent_corporate_action_proof"]
          assert not d["trading_authorized"] and not d["paper_authorized"] and not d["live_authorized"]
          assert d["broker_requests"] == d["broker_orders"] == 0
          assert sum(cell["events"] for groups in d["valuation_by_prior_momentum"].values()
                     for cell in groups.values()) == d["completed_events"]
          print("Original 10-K diluted EPS available:", d["original_eps_available"],
                "of", d["completed_events"])
          print("15bp matched excess-return research cells:", d["valuation_by_prior_momentum"])
          print("NOT owner earnings, point-in-time universe or validated alpha.")
          PY
      - name: Preserve original SEC bytes, source identities and missing coverage
        if: steps.capture.outputs.acquired == 'true'
        uses: actions/upload-artifact@v4
