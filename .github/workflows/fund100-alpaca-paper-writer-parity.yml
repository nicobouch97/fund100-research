name: Fund-100 Alpaca PAPER Connected-Writer Parity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fund100-alpaca-paper-writer-parity
  cancel-in-progress: false

jobs:
  paper-parity:
    name: Exercise Locked Writer Candidate Against PAPER

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PAPER parity inputs
        run: |
          set -euo pipefail

          test -f fund100_alpaca_live_writer_candidate_v1_0.py

          test -f fund100_alpaca_paper_transport_v1_0.py
          test -f fund100_alpaca_paper_writer_parity_v1_0.py
          test -f test_fund100_alpaca_paper_writer_parity_v1_0.py

          test -f audit_fund100_live_boundary_v1_13.py

          test -f \
            release_outputs/v5_002/pre_live_release_lock.json

          echo "PAPER writer-parity inputs found."

      - name: Run full Fund-100 test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Re-run locked LIVE static audit v1.13
        run: |
          set -euo pipefail
          python audit_fund100_live_boundary_v1_13.py

      - name: Run real PAPER connected-writer parity
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}

          FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

          FUND100_ENABLE_PAPER_WRITER_PARITY: YES_PAPER_WRITER_PARITY

          FUND100_PAPER_PARITY_RUN_ID: ${{ github.run_id }}

        run: |
          set -euo pipefail
          python fund100_alpaca_paper_writer_parity_v1_0.py

      - name: Verify safe PAPER parity artifact
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json

          path = (
              "live_dryrun_outputs/v5_002/"
              "paper_connected_writer_parity_v1_0.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as handle:
              package = json.load(handle)

          body = package[
              "paper_parity"
          ]

          canonical = json.dumps(
              body,
              sort_keys=True,
              separators=(",", ":"),
              ensure_ascii=True,
          )

          assert (
              hashlib.sha256(
                  canonical.encode("utf-8")
              ).hexdigest()
              == package[
                  "paper_parity_sha256"
              ]
          )

          assert (
              body[
                  "schema"
              ]
              == "FUND100_PAPER_CONNECTED_WRITER_PARITY_V1"
          )

          assert (
              body[
                  "source_release_lock_builder_version"
              ]
              == "1.5"
          )

          assert (
              body[
                  "paper_endpoint_verified"
              ]
              is True
          )

          assert (
              body[
                  "live_endpoint_contacted"
              ]
              is False
          )

          assert (
              body[
                  "live_credentials_supplied"
              ]
              is False
          )

          assert (
              body[
                  "paper_credentials_persisted"
              ]
              is False
          )

          assert (
              body[
                  "candidate_transport_source_flag_false_before_after"
              ]
              is True
          )

          assert (
              body[
                  "candidate_public_execution_source_flag_false_before_after"
              ]
              is True
          )

          assert (
              body[
                  "first_submission_status"
              ]
              == "SUBMITTED"
          )

          assert (
              body[
                  "restart_status"
              ]
              == "EXISTING_MATCHING_ORDER"
          )

          assert (
              body[
                  "candidate_get_requests"
              ]
              == 2
          )

          assert (
              body[
                  "candidate_post_requests"
              ]
              == 1
          )

          assert (
              body[
                  "candidate_non_paper_host_requests"
              ]
              == 0
          )

          assert (
              body[
                  "duplicate_post_requests"
              ]
              == 0
          )

          assert (
              body[
                  "paper_order_cleanup_verified"
              ]
              is True
          )

          assert (
              body[
                  "paper_order_zero_fill_verified"
              ]
              is True
          )

          assert (
              body[
                  "paper_position_created"
              ]
              is False
          )

          assert (
              body[
                  "synthetic_permit_persisted"
              ]
              is False
          )

          assert (
              body[
                  "synthetic_executable_intent_persisted"
              ]
              is False
          )

          assert (
              body[
                  "live_execution_authorized"
              ]
              is False
          )

          assert (
              body[
                  "live_permit_issued"
              ]
              is False
          )

          assert (
              float(
                  body[
                      "live_max_execution_notional_usd"
                  ]
              )
              == 0.0
          )

          assert (
              body[
                  "live_writer_connected"
              ]
              is False
          )

          assert (
              body[
                  "live_orders_submitted"
              ]
              == 0
          )

          assert (
              body[
                  "paper_connected_writer_parity_passed"
              ]
              is True
          )

          forbidden = {
              "api_key",
              "api_secret",
              "permit",
              "intents",
              "broker_order",
              "order_id",
              "client_order_id",
          }

          assert (
              forbidden.intersection(
                  body.keys()
              )
              == set()
          )

          print("PAPER parity artifact SHA256: PASS")
          print("Exact candidate GET-before-POST: PASS")
          print("Exact candidate POST: PASS")
          print("Restart duplicate suppression: PASS")
          print("Duplicate POST count: 0")
          print("PAPER cleanup zero-fill: PASS")
          print("LIVE endpoint requests: 0")
          print("LIVE orders submitted: 0")
          PY

      - name: Verify only PAPER parity artifact changed
        run: |
          set -euo pipefail

          STATUS="$(
            git status --porcelain
          )"

          EXTRA="$(
            printf '%s\n' "$STATUS" \
              | grep -vE \
                '^.. live_dryrun_outputs/v5_002/paper_connected_writer_parity_v1_0\.json$' \
              || true
          )"

          if [ -n "$EXTRA" ]; then
            echo "Unexpected working-tree changes:"
            echo "$EXTRA"
            git status --short
            exit 1
          fi

          echo "Only expected PAPER parity artifact changed."

      - name: Check PAPER parity artifact changes
        id: paper_parity_check
        run: |
          set -euo pipefail

          CHANGES="$(
            git status --porcelain -- \
              live_dryrun_outputs/v5_002/paper_connected_writer_parity_v1_0.json
          )"

          if [ -z "$CHANGES" ]; then
            echo "PAPER parity artifact unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "PAPER parity artifact changed:"
            echo "$CHANGES"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit safe PAPER parity artifact
        if: steps.paper_parity_check.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config \
            user.name \
            "fund100-paper-parity-bot"

          git config \
            user.email \
            "fund100-paper-parity-bot@users.noreply.github.com"

          git add \
            live_dryrun_outputs/v5_002/paper_connected_writer_parity_v1_0.json

          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit \
            -m "Record V5-002 PAPER connected-writer parity"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Unexpected dirty working tree."
            git status --short
            exit 1
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final safety status
        run: |
          echo "========================================"
          echo "FUND-100 PAPER CONNECTED-WRITER PARITY COMPLETE"
          echo "========================================"
          echo "Release lock v1.5: VERIFIED"
          echo "Exact writer-candidate transport path: VERIFIED"
          echo "Broker environment: PAPER ONLY"
          echo "Paper candidate GET-before-POST: PASS"
          echo "Paper candidate POST: PASS"
          echo "Paper restart duplicate suppression: PASS"
          echo "Paper cleanup / zero-fill: PASS"
          echo "Candidate transport released in source: FALSE"
          echo "Candidate public execution enabled in source: FALSE"
          echo "LIVE credentials supplied: NO"
          echo "LIVE endpoint contacted: NO"
          echo "Live execution authorized: FALSE"
          echo "Live permit issued: FALSE"
          echo 'Maximum LIVE execution notional: $0.00'
          echo "LIVE writer connected: FALSE"
          echo "LIVE orders submitted: 0"
