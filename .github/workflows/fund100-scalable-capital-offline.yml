name: Fund-100 Scalable Capital Offline CI (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_scalable_capital_preview_v1_0.py"
      - "test_fund100_scalable_capital_preview_v1_0.py"
      - "research_lab/FUND100_SCALABLE_CAPITAL_DESIGN_2026_11_09.md"
      - ".github/workflows/fund100-scalable-capital-offline.yml"
  push:
    branches: [main]
    paths:
      - "fund100_scalable_capital_preview_v1_0.py"
      - "test_fund100_scalable_capital_preview_v1_0.py"
      - "research_lab/FUND100_SCALABLE_CAPITAL_DESIGN_2026_11_09.md"
      - ".github/workflows/fund100-scalable-capital-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-broker-capital-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Prove USD capital cap and no live trading boundary
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_scalable_capital_preview_v1_0.py
          python - <<'PY'
          import fund100_scalable_capital_preview_v1_0 as m
          assert m.LIVE_TRADING_RELEASED is False
          assert m.PILOT_CAP == 130.30 and m.PILOT_MAX_NEW_TICKET == 65
          assert m.BROKER_GETS == m.BROKER_POSTS == 0
          print("Offline preview only; LIVE STOP and original mandate unchanged.")
          PY
