name: Fund-100 V8 Original SEC100 Issuer Shares Source Coverage (NO BROKER)

# Do not multiply issuer-level SEC shares by a vendor TICKER price: company
# share-class identity, split adjustments and true market cap are NOT proven.
# Only exact original U3 + original 200-companyfacts/submissions archives.
on:
  pull_request:
    paths:
      - "fund100_v8_sec100_original_issuer_share_source_v1_0.py"
      - "test_fund100_v8_sec100_original_issuer_share_source_v1_0.py"
      - ".github/workflows/fund100-v8-sec100-original-issuer-share-source.yml"
  push:
    branches: [main]
    paths:
      - "fund100_v8_sec100_original_issuer_share_source_v1_0.py"
      - "test_fund100_v8_sec100_original_issuer_share_source_v1_0.py"
      - ".github/workflows/fund100-v8-sec100-original-issuer-share-source.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fund100-original-sec100-issuer-share-class-evidence-only
  cancel-in-progress: false

jobs:
  original-sec100-shares-source-offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned existing source dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify 100 original issuer joins, filing time, source hash, no valuation or live broker
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_v8_sec100_original_issuer_share_source_v1_0.py
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json

  actual-original-100-sec-issuer-share-evidence:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: original-sec100-shares-source-offline-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      FUND100_BROKER_KILL_SWITCH: ENGAGED
      FUND100_LIVE_WRITE_MODE: DISABLED
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing bounded SEC research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact first U3 identities and completed official original SEC100 run
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "nicobouch97/fund100-research"
          test "$GITHUB_REF" = "refs/heads/main"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40545345749 > /tmp/shares-original-u3-run.json
          gh api repos/$GITHUB_REPOSITORY/actions/runs/42620947546 > /tmp/shares-original-sec100-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          sources=(
            ('/tmp/shares-original-u3-run.json',40545345749,
                'fund100-v7-u3-dated-issuer-mirror-sec100.yml',None),
            ('/tmp/shares-original-sec100-run.json',42620947546,
                'fund100-v8-sec100-official-annual-quality-source.yml',
                '8b0356cfaf406127a1b418bbe29d87c27457c0dd'))
          for path,ident,workflow,sha in sources:
              obj=json.loads(Path(path).read_text())
              assert obj['id']==ident
              assert obj['status']=='completed' and obj['conclusion']=='success'
              assert obj['head_branch']=='main'
              assert obj['path'].endswith('/'+workflow)
              if sha:assert obj['head_sha']==sha
          print('Only registered ORIGINAL first-source SEC CIK and SEC100 archives.')
          PY
          mkdir -p /tmp/f100-original-u3 /tmp/f100-original-sec100
          gh run download 40545345749 --repo "$GITHUB_REPOSITORY" \
            --name fund100-v7-u3-first-dated-mirror-sec100-40545345749 \
            --dir /tmp/f100-original-u3
          gh run download 42620947546 --repo "$GITHUB_REPOSITORY" \
            --name fund100-v8-original-sec100-quality-42620947546 \
            --dir /tmp/f100-original-sec100
      - name: Independently replay all original SEC issuer sources and assess shares WITHOUT market caps
        run: |
          set -euo pipefail
          python -B fund100_v8_sec100_original_issuer_share_source_v1_0.py \
            --original-u3 /tmp/f100-original-u3 \
            --original-sec100 /tmp/f100-original-sec100 \
            --output /tmp/f100-original-sec100-issuer-shares-no-valuation.json
      - name: Archive nontrading issuer shares coverage with strict class-identity caveat
        uses: actions/upload-artifact@v4
        with:
          name: fund100-v8-original-sec100-issuer-shares-${{ github.run_id }}
          path: /tmp/f100-original-sec100-issuer-shares-no-valuation.json
          if-no-files-found: error
          retention-days: 90
      - name: Confirm STOP, NO broker connection, NO trading instructions
        run: |
          set -euo pipefail
          test "$FUND100_BROKER_KILL_SWITCH" = "ENGAGED"
          grep -Eq '"trading_enabled": false' fund100_live_operator_control.json
          grep -Eq '"trading_enabled": false' fund100_v6_s1_operator_control.json
          echo 'SEC issuer share count evidence only; 0 ticker-class valuations, 0 trades.'
