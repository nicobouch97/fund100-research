name: Fund-100 LIVE Micro-Pilot Bootstrap

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: "Type exactly: I_AUTHORIZE_FUND100_LIVE_BOOTSTRAP"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fund100-live-micro-pilot-bootstrap
  cancel-in-progress: false

env:
  FUND100_BROKER_KILL_SWITCH: ${{ vars.FUND100_BROKER_KILL_SWITCH }}

jobs:
  bootstrap:
    name: Bootstrap V5-002 LIVE Micro-Pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify explicit bootstrap authorization
        env:
          BOOTSTRAP_AUTH: ${{ inputs.authorization }}
        run: |
          set -euo pipefail

          if [ "${BOOTSTRAP_AUTH}" != "I_AUTHORIZE_FUND100_LIVE_BOOTSTRAP" ]; then
            echo "STOP: bootstrap authorization mismatch."
            exit 1
          fi

          echo "Explicit LIVE bootstrap authorization: PRESENT"

      - name: Verify repository kill switch was deliberately disengaged
        run: |
          set -euo pipefail

          if [ "${FUND100_BROKER_KILL_SWITCH}" != "DISENGAGED" ]; then
            echo "STOP: broker kill switch is not DISENGAGED."
            exit 1
          fi

          echo "FUND100_BROKER_KILL_SWITCH = DISENGAGED"

      - name: Run regression suite under safe test state
        env:
          FUND100_BROKER_KILL_SWITCH: ENGAGED
        run: |
          set -euo pipefail

          pytest -q

      - name: Verify required locked artifacts exist
        run: |
          set -euo pipefail

          test -f \
            live_activation_outputs/v5_002/pre_live_release_lock_v1_9.json

          test -f \
            live_activation_outputs/v5_002/live_micro_pilot_policy_v1_0.json

          test -f \
            live_activation_outputs/v5_002/live_micro_pilot_preparation_v1_0.json

          test -f \
            live_dryrun_outputs/v5_002/live_execution_manifest.json

          echo "Release Lock v1.9: PRESENT"
          echo "LIVE pilot policy: PRESENT"
          echo "LIVE pilot preparation: PRESENT"
          echo "LIVE manifest package: PRESENT"

      - name: Verify manifest package and LIVE-pilot lineage before broker write
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          policy_path = Path(
              "live_activation_outputs/v5_002/"
              "live_micro_pilot_policy_v1_0.json"
          )

          preparation_path = Path(
              "live_activation_outputs/v5_002/"
              "live_micro_pilot_preparation_v1_0.json"
          )

          lock_path = Path(
              "live_activation_outputs/v5_002/"
              "pre_live_release_lock_v1_9.json"
          )

          manifest_path = Path(
              "live_dryrun_outputs/v5_002/"
              "live_execution_manifest.json"
          )

          policy = json.loads(
              policy_path.read_text(
                  encoding="utf-8"
              )
          )

          preparation = json.loads(
              preparation_path.read_text(
                  encoding="utf-8"
              )
          )

          release_lock = json.loads(
              lock_path.read_text(
                  encoding="utf-8"
              )
          )

          package = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          if "manifest" in package:
              manifest = package.get(
                  "manifest"
              )

              if not isinstance(
                  manifest,
                  dict
              ):
                  raise SystemExit(
                      "STOP: manifest package body is malformed."
                  )

              recorded_hash = str(
                  package.get(
                      "manifest_sha256",
                      ""
                  )
              ).strip().lower()

              if len(recorded_hash) != 64:
                  raise SystemExit(
                      "STOP: manifest_sha256 missing or malformed."
                  )

              canonical = json.dumps(
                  manifest,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              )

              actual_hash = hashlib.sha256(
                  canonical.encode(
                      "utf-8"
                  )
              ).hexdigest()

              if actual_hash != recorded_hash:
                  raise SystemExit(
                      "STOP: manifest SHA256 verification failed."
                  )

          else:
              manifest = package

          if release_lock.get(
              "release_lock_version"
          ) != "1.9":
              raise SystemExit(
                  "STOP: Release Lock v1.9 is not current."
              )

          if policy.get(
              "strategy"
          ) != "V5-002_SHADOW":
              raise SystemExit(
                  "STOP: pilot policy strategy is not V5-002."
              )

          if policy.get(
              "deployment_mode"
          ) != "LIVE_MICRO_PILOT":
              raise SystemExit(
                  "STOP: policy is not LIVE_MICRO_PILOT."
              )

          if policy.get(
              "bootstrap_alignment_allowed"
          ) is not True:
              raise SystemExit(
                  "STOP: policy does not authorize bootstrap."
              )

          if policy.get(
              "leverage_allowed"
          ) is not False:
              raise SystemExit(
                  "STOP: leverage unexpectedly authorized."
              )

          if policy.get(
              "shorting_allowed"
          ) is not False:
              raise SystemExit(
                  "STOP: shorting unexpectedly authorized."
              )

          if preparation.get(
              "orders_submitted"
          ) != 0:
              raise SystemExit(
                  "STOP: preparation artifact is not clean."
              )

          if manifest.get(
              "strategy"
          ) != "V5-002_SHADOW":
              raise SystemExit(
                  "STOP: manifest strategy is not V5-002."
              )

          policy_state_hash = str(
              policy.get(
                  "activation_shadow_state_sha256",
                  ""
              )
          ).strip().lower()

          manifest_state_hash = str(
              manifest.get(
                  "strategy_state_sha256",
                  ""
              )
          ).strip().lower()

          if len(
              policy_state_hash
          ) != 64:
              raise SystemExit(
                  "STOP: policy shadow-state hash is invalid."
              )

          if len(
              manifest_state_hash
          ) != 64:
              raise SystemExit(
                  "STOP: manifest strategy_state_sha256 "
                  "is missing or invalid."
              )

          if (
              manifest_state_hash
              != policy_state_hash
          ):
              raise SystemExit(
                  "STOP: the current manifest and LIVE pilot "
                  "policy refer to different V5-002 shadow "
                  "states. Re-engage the kill switch and "
                  "re-run LIVE Micro-Pilot Preparation."
              )

          if manifest.get(
              "live_execution_authorized"
          ) is not False:
              raise SystemExit(
                  "STOP: dry-run manifest unexpectedly "
                  "authorizes LIVE execution."
              )

          target_weights = manifest.get(
              "target_weights"
          )

          if not isinstance(
              target_weights,
              dict
          ):
              raise SystemExit(
                  "STOP: manifest target weights missing."
              )

          if not target_weights:
              raise SystemExit(
                  "STOP: manifest target portfolio is empty."
              )

          print(
              "Manifest package SHA256: VERIFIED"
          )

          print(
              "Release Lock lineage: VERIFIED"
          )

          print(
              "V5-002 pilot-policy binding: VERIFIED"
          )

          print(
              "Manifest shadow-state binding: VERIFIED"
          )

          print(
              "Manifest target weights: PRESENT"
          )

          print(
              "Pre-write lineage gate: PASS"
          )
          PY

      - name: Execute one-time LIVE bootstrap
        env:
          ALPACA_LIVE_KEY: ${{ secrets.ALPACA_LIVE_KEY }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}

          FUND100_LIVE_BOOTSTRAP_ARM: "YES"

        run: |
          set -euo pipefail

          python fund100_live_bootstrap_v1_0.py

      - name: Verify bootstrap evidence
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "live_activation_outputs/v5_002/"
              "live_bootstrap_v1_0.json"
          )

          if not path.exists():
              raise SystemExit(
                  "STOP: LIVE bootstrap evidence missing."
              )

          body = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          required = {
              "schema":
                  "FUND100_LIVE_MICRO_PILOT_BOOTSTRAP_V1",

              "strategy":
                  "V5-002_SHADOW",

              "broker_environment":
                  "ALPACA_LIVE",

              "bootstrap_complete":
                  True,

              "duplicate_live_posts":
                  0,

              "ordinary_drift_trading_enabled":
                  False,

              "autonomous_strategy_event_execution_enabled":
                  False,
          }

          for key, expected in required.items():

              actual = body.get(
                  key
              )

              if actual != expected:

                  raise SystemExit(
                      "STOP: "
                      f"{key}: expected {expected!r}, "
                      f"got {actual!r}"
                  )

          reconciliation = body.get(
              "reconciliation",
              {}
          )

          if reconciliation.get(
              "open_orders"
          ) != 0:
              raise SystemExit(
                  "STOP: LIVE open orders remain after bootstrap."
              )

          if reconciliation.get(
              "equity_positive"
          ) is not True:
              raise SystemExit(
                  "STOP: final LIVE equity validation failed."
              )

          if not body.get(
              "manifest_sha256"
          ):
              raise SystemExit(
                  "STOP: bootstrap evidence lost manifest binding."
              )

          print(
              "LIVE bootstrap evidence: VERIFIED"
          )
          PY

      - name: Commit LIVE bootstrap evidence
        run: |
          set -euo pipefail

          git config user.name \
            "fund100-research-bot"

          git config user.email \
            "fund100-research-bot@users.noreply.github.com"

          git add \
            live_activation_outputs/v5_002/live_bootstrap_v1_0.json

          if git diff --cached --quiet; then

            echo "Bootstrap evidence unchanged."

          else

            git commit -m \
              "Record Fund-100 LIVE micro-pilot bootstrap"

            git push

          fi

      - name: Final summary
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FUND-100 LIVE MICRO-PILOT BOOTSTRAP COMPLETE"
          echo "========================================"
          echo "Strategy: V5-002"
          echo "Environment: ALPACA LIVE"
          echo "Release Lock v1.9: VERIFIED"
          echo "Manifest package SHA256: VERIFIED"
          echo "Pilot account binding: VERIFIED"
          echo "Current shadow-state binding: VERIFIED"
          echo "LIVE capital ceiling: ENFORCED"
          echo "Leverage allowed: FALSE"
          echo "Shorting allowed: FALSE"
          echo "Deterministic order IDs: PASS"
          echo "Cumulative notional ceiling: PASS"
          echo "LIVE fills: VERIFIED"
          echo "Duplicate LIVE submissions: 0"
          echo "Final reconciliation: PASS"
          echo "Open LIVE orders: 0"
          echo "Bootstrap complete: TRUE"
          echo "Ordinary drift trading: FALSE"
          echo "Autonomous event execution: NOT YET ENABLED"
