name: Fund-100 C4 Commodity Equity-Stress Research (NO BROKER)

on:
  pull_request:
    paths:
      - "fund100_commodity_c4_equity_stress_v1_0.py"
      - "test_fund100_commodity_c4_equity_stress_v1_0.py"
      - ".github/workflows/fund100-commodity-c4-stress-research.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fund100-commodity-c4-stress-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c4-stress:
    name: C4 fixed equity stress hypothesis vs static commodity basket
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Research only. No Alpaca, brokerage environment, secrets or order APIs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify C4 signal no-lookahead, cap, cost and no-promotion invariants
        run: |
          set -euo pipefail
          python -m pytest -q test_fund100_commodity_c4_equity_stress_v1_0.py
      - name: Fetch public ETF adjusted prices for exploratory historical study
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python fund100_commodity_price_source_v1_0.py \
            --output-csv /tmp/fund100-c4-etf-prices.csv
      - name: Compare C4 and static GLD/DBC/SHY for every cost scenario
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python fund100_commodity_c4_equity_stress_v1_0.py \
            --prices-csv /tmp/fund100-c4-etf-prices.csv \
            --output-json /tmp/fund100-c4-stress-results.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/fund100-c4-stress-results.json").read_text())
          assert p["status"] == "EXPLORATORY_HISTORY_ALREADY_EXAMINED_NO_PROMOTION"
          assert p["retrospective_holdout_is_not_independent_validation"]
          assert p["no_real_futures_carry_signal_computed"]
          assert not p["paper_authorized"] and not p["live_authorized"]
          assert p["broker_order_count"] == 0
          print("Historical stress comparison descriptive only: NOT a new clean holdout.")
          PY
      - name: Archive research inputs and dated exploratory comparison
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: fund100-c4-stress-exploratory-${{ github.run_id }}
          path: |
            /tmp/fund100-c4-etf-prices.csv
            /tmp/fund100-c4-stress-results.json
          retention-days: 90
          if-no-files-found: error
